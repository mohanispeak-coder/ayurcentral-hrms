<style>
.formt-page .formt-status { margin: 12px 0; min-height: 1.5em; }
.formt-page .formt-status-loading { display: inline-flex; align-items: center; gap: 8px; color: var(--color-text-muted); }
</style>
<script>
(function () {
  'use strict';

  var initialized_ = false;
  var MODULE_KEY_ = 'attendance-form-t';
  var period_ = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
  var catalog_ = [];
  var runsCache_ = [];
  var runState_ = { runId: '', vertical: '' };
  var viewCache_ = null;

  function whenAppReady(fn) {
    function run() {
      var App = window.HrmsApp;
      if (!App || !App.registerRoute || !App.callServer) return false;
      fn(App);
      return true;
    }
    if (run()) return;
    var tries = 0;
    var timer = setInterval(function () {
      if (run() || ++tries > 200) clearInterval(timer);
    }, 25);
  }

  whenAppReady(function initFormTUi(App) {
    if (initialized_) return;
    initialized_ = true;

    var callServer = App.callServer;
    var escapeHtml = App.escapeHtml;
    var showToast = App.showToast;
    var navigate = App.navigate;

    function esc_(v) {
      return escapeHtml(v == null ? '' : String(v));
    }

    function pageEl_() {
      var p = document.getElementById('page-content');
      if (p) p.classList.remove('hidden');
      return p;
    }

    function periodKey_() {
      return period_.year + '-' + period_.month;
    }

    function skeletonMount_() {
      if (App.sectionSkeleton) {
        return App.sectionSkeleton({ variant: 'card', lines: 3, label: 'Loading Form T' });
      }
      return '<div class="hrms-loading-block" aria-busy="true"><span class="visually-hidden">Loading</span></div>';
    }

    var MONTH_NAMES_ = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function fmtPeriod_(y, m) {
      return (MONTH_NAMES_[m - 1] || m) + ' ' + y;
    }

    function monthSelectHtml_(selectedMonth) {
      return MONTH_NAMES_.map(function (name, i) {
        var v = i + 1;
        return '<option value="' + v + '"' + (Number(selectedMonth) === v ? ' selected' : '') + '>' + name + '</option>';
      }).join('');
    }

    function readPeriodFromForm_() {
      var yEl = document.getElementById('formt-year');
      var mEl = document.getElementById('formt-month');
      var y = yEl ? Number(yEl.value) : period_.year;
      var m = mEl ? Number(mEl.value) : period_.month;
      if (!y || y < 2000 || y > 2100) return null;
      if (!m || m < 1 || m > 12) return null;
      return { year: y, month: m };
    }

    function applyPeriodFromForm_(clearRunId) {
      var p = readPeriodFromForm_();
      if (!p) {
        showToast('Enter a valid year and month.', 'error');
        return false;
      }
      var changed = p.year !== period_.year || p.month !== period_.month;
      period_.year = p.year;
      period_.month = p.month;
      if (clearRunId || changed) runState_.runId = '';
      viewCache_ = null;
      if (App.persistPayrollPeriodContext) {
        App.persistPayrollPeriodContext({
          year: period_.year,
          month: period_.month,
          vertical: runState_.vertical,
          runId: ''
        });
      }
      return true;
    }

    function verticalFromRun_(run) {
      if (App.runVerticalFromRow) return App.runVerticalFromRow(run) || '';
      var v = String(run && run.vertical_name || '').trim().toUpperCase();
      if (v) return v;
      if (App.verticalFromPayrollRunId) return App.verticalFromPayrollRunId(run && run.payroll_run_id) || '';
      return '';
    }

    function mergePayrollNavParams_(params) {
      params = params || {};
      if (App.readPayrollPeriodContext) {
        var ctx = App.readPayrollPeriodContext();
        if (ctx) {
          if (ctx.year != null && params.year == null) params.year = ctx.year;
          if (ctx.month != null && params.month == null) params.month = ctx.month;
          if (ctx.runId && params.runId == null) params.runId = ctx.runId;
          if (ctx.vertical && params.vertical == null) params.vertical = ctx.vertical;
        }
      }
      if (App.getPayrollPeriodParams) {
        var pp = App.getPayrollPeriodParams();
        if (pp) {
          if (pp.year != null && params.year == null) params.year = pp.year;
          if (pp.month != null && params.month == null) params.month = pp.month;
          var ctxPeriodSet = params.year != null && params.month != null;
          var ppPeriodMismatch = ctxPeriodSet && pp.year != null && pp.month != null &&
            (Number(params.year) !== Number(pp.year) || Number(params.month) !== Number(pp.month));
          if (pp.runId && params.runId == null && !ppPeriodMismatch) params.runId = pp.runId;
          if (pp.vertical && params.vertical == null && !ppPeriodMismatch) params.vertical = pp.vertical;
        }
      }
      return params;
    }

    function applyRouteParams_(params) {
      if (params.year) period_.year = Number(params.year);
      if (params.month) period_.month = Number(params.month);
      if (params.vertical) runState_.vertical = String(params.vertical).trim().toUpperCase();
      if (params.runId) runState_.runId = String(params.runId).trim();
    }

    function findRunForPeriod_(runs, year, month, vertical) {
      var list = (runs || []).filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month;
      });
      var want = vertical ? String(vertical).trim().toUpperCase() : '';
      function pickBest_(matches) {
        if (!matches || !matches.length) return null;
        var locked = matches.filter(function (r) {
          return String(r.status || '').toUpperCase() === 'LOCKED';
        });
        if (locked.length) return locked[0];
        return matches[0];
      }
      if (want) {
        if (App.findRunForVerticalMonth) {
          var matched = App.findRunForVerticalMonth(runs, year, month, want);
          if (matched) return matched;
        }
        var vertMatches = list.filter(function (r) { return verticalFromRun_(r) === want; });
        var picked = pickBest_(vertMatches);
        if (picked) return picked;
      }
      var open = list.filter(function (r) {
        return String(r.status || '').toUpperCase() !== 'LOCKED';
      });
      if (open.length === 1) return open[0];
      if (!want && open.length) {
        var legacy = open.filter(function (r) { return !verticalFromRun_(r); });
        if (legacy.length) return legacy[0];
        return open[0];
      }
      return pickBest_(list) || null;
    }

    function resolveRunForFormT_(runs) {
      runs = runs || [];
      var y = Number(period_.year);
      var m = Number(period_.month);
      if (runState_.runId) {
        var byId = runs.filter(function (r) { return r.payroll_run_id === runState_.runId; })[0];
        if (byId && Number(byId.period_year) === y && Number(byId.period_month) === m) {
          return byId;
        }
      }
      return findRunForPeriod_(runs, y, m, runState_.vertical);
    }

    function resolveRunIdForVertical_(vertical, fallbackRun) {
      var want = String(vertical || '').trim().toUpperCase();
      if (!want) return fallbackRun.payroll_run_id;
      var runV = verticalFromRun_(fallbackRun);
      if (!runV || runV === want) return fallbackRun.payroll_run_id;
      var match = findRunForPeriod_(runsCache_, fallbackRun.period_year, fallbackRun.period_month, want);
      return match ? match.payroll_run_id : fallbackRun.payroll_run_id;
    }

    function reconcilePeriodWithRuns_(runs) {
      if (!App.reconcilePayrollPeriodWithRuns) return;
      var rec = App.reconcilePayrollPeriodWithRuns({
        year: period_.year,
        month: period_.month,
        runId: runState_.runId,
        vertical: runState_.vertical
      }, runs || []);
      if (rec.year) period_.year = rec.year;
      if (rec.month) period_.month = rec.month;
      if (rec.runId) runState_.runId = rec.runId;
      if (rec.vertical) runState_.vertical = rec.vertical;
      if (App.persistPayrollPeriodContext) App.persistPayrollPeriodContext(rec);
    }

    function findLatestPayrollRun_(runs) {
      runs = (runs || []).slice().sort(function (a, b) {
        var ya = Number(b.period_year) - Number(a.period_year);
        if (ya !== 0) return ya;
        return Number(b.period_month) - Number(a.period_month);
      });
      return runs[0] || null;
    }

    function verticalOptionsHtml_(selected) {
      return (catalog_ || []).map(function (v) {
        var sel = selected === v.vertical_name ? ' selected' : '';
        return '<option value="' + esc_(v.vertical_name) + '"' + sel + '>' +
          esc_(v.vertical_name) + ' - ' + esc_(v.legal_name) + '</option>';
      }).join('');
    }

    function render_(params) {
      params = mergePayrollNavParams_(params || {});
      applyRouteParams_(params);
      if (viewCache_ && viewCache_.run) {
        var cacheRunId = String(viewCache_.run.payroll_run_id || '').trim();
        var wantRunId = params.runId ? String(params.runId).trim() : '';
        if (viewCache_.periodKey !== periodKey_() ||
            (wantRunId && cacheRunId !== wantRunId)) {
          viewCache_ = null;
        }
      }

      var page = pageEl_();
      if (!page) return;

      var forceRefresh = App.isModuleRefresh && App.isModuleRefresh(MODULE_KEY_);
      if (!forceRefresh && viewCache_ && viewCache_.run && viewCache_.periodKey === periodKey_()) {
        var wantRunId = params.runId || runState_.runId;
        if (!wantRunId || viewCache_.run.payroll_run_id === String(wantRunId).trim()) {
          period_.year = Number(viewCache_.run.period_year);
          period_.month = Number(viewCache_.run.period_month);
          catalog_ = viewCache_.catalog || catalog_;
          runState_.runId = viewCache_.run.payroll_run_id;
          if (viewCache_.selectedVertical) runState_.vertical = viewCache_.selectedVertical;
          page.innerHTML =
            '<div class="formt-page"><div class="page-header"><h2>Form T</h2></div><div id="formt-mount"></div></div>';
          paintMain_(viewCache_.run, viewCache_.selectedVertical, viewCache_.statusHtml, viewCache_.canDownload);
          if (App.consumeModuleViewRestore) App.consumeModuleViewRestore(MODULE_KEY_);
          if (App.markModuleViewLoaded) App.markModuleViewLoaded(MODULE_KEY_, { params: params });
          return;
        }
      }

      page.innerHTML =
        '<div class="formt-page"><div class="page-header"><h2>Form T</h2></div>' +
        '<div id="formt-mount">' + skeletonMount_() + '</div></div>';

      var runsRpc = App.fetchPayrollRunsList
        ? App.fetchPayrollRunsList(callServer)
        : callServer('apiListPayrollRuns');
      Promise.all([
        (App.fetchVerticalCatalog ? App.fetchVerticalCatalog(callServer) : callServer('apiGetVerticalCatalog')).catch(function () { return []; }),
        runsRpc
      ]).then(function (boot) {
        catalog_ = boot[0] || [];
        runsCache_ = boot[1] || [];
        loadContext_(true);
      }).catch(function (err) {
        var m = document.getElementById('formt-mount');
        if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load.') + '</div>';
      });
    }

    function loadContext_(runsAlreadyLoaded) {
      function afterRuns_(runs) {
        runsCache_ = runs || [];
        reconcilePeriodWithRuns_(runsCache_);
        var run = resolveRunForFormT_(runsCache_);
        if (!run) {
          paintNoRun_();
          return;
        }
        runState_.runId = run.payroll_run_id;
        if (verticalFromRun_(run)) runState_.vertical = verticalFromRun_(run);
        if (!runState_.vertical && catalog_.length) runState_.vertical = catalog_[0].vertical_name;
        if (App.persistPayrollPeriodContext) {
          App.persistPayrollPeriodContext({
            year: run.period_year,
            month: run.period_month,
            runId: run.payroll_run_id,
            vertical: runState_.vertical
          });
        }
        paintMain_(run, runState_.vertical, '', false, true);
      }
      if (runsAlreadyLoaded) {
        afterRuns_(runsCache_);
        return;
      }
      var runsRpc = App.fetchPayrollRunsList
        ? App.fetchPayrollRunsList(callServer)
        : callServer('apiListPayrollRuns');
      runsRpc.then(afterRuns_).catch(function (err) {
        var m = document.getElementById('formt-mount');
        if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load.') + '</div>';
      });
    }

    function paintNoRun_() {
      var m = document.getElementById('formt-mount');
      if (!m) return;
      m.innerHTML =
        '<div class="card"><h2>' + esc_(fmtPeriod_(period_.year, period_.month)) + '</h2>' +
        '<p class="hint">No payroll run for this month. Start payroll for the month you need, or change the period below.</p>' +
        '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Year</label><input class="form-input" id="formt-year" type="number" min="2000" max="2100" value="' + period_.year + '"></div>' +
        '<div class="form-group"><label class="form-label">Month</label><select class="form-select" id="formt-month">' +
        monthSelectHtml_(period_.month) + '</select></div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="formt-retry-period">Load this month</button> ' +
        '<button type="button" class="btn btn-secondary" id="formt-goto-payroll">Open Payroll</button></div>';

      document.getElementById('formt-retry-period').addEventListener('click', function () {
        if (!applyPeriodFromForm_(true)) return;
        loadContext_(true);
      });
      document.getElementById('formt-goto-payroll').addEventListener('click', function () {
        navigate('payroll', { year: period_.year, month: period_.month });
      });
      if (App.markModuleViewLoaded) App.markModuleViewLoaded(MODULE_KEY_);
    }

    function downloadBlob_(file) {
      if (!file || !file.base64) return;
      var binary = atob(file.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.fileName || 'FormT.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function refreshStatus_(baseRun, skipCacheUpdate) {
      var sel = document.getElementById('formt-vertical');
      var statusEl = document.getElementById('formt-status');
      var dlBtn = document.getElementById('formt-download');
      if (!sel || !statusEl || !baseRun) return;

      var vertical = sel.value;
      if (!vertical) {
        statusEl.textContent = 'Select a vertical.';
        if (dlBtn) dlBtn.disabled = true;
        return;
      }

      var runId = resolveRunIdForVertical_(vertical, baseRun);
      runState_.vertical = vertical;
      if (App.persistPayrollPeriodContext) {
        App.persistPayrollPeriodContext({
          year: baseRun.period_year,
          month: baseRun.period_month,
          runId: runId,
          vertical: vertical
        });
      }

      statusEl.innerHTML =
        '<span class="formt-status-loading" aria-busy="true">' +
        '<span class="spinner-sm" aria-hidden="true"></span> Checking attendance for ' + esc_(vertical) + '…</span>';
      if (dlBtn) dlBtn.disabled = true;

      callServer('apiGetFormTStatus', runId, vertical).then(function (st) {
        var statusHtml;
        var canDl = false;
        if (st.canGenerate) {
          statusHtml = '<span class="text-success">' + esc_(st.employeeCount) +
            ' employees ready · ' + esc_(st.legalName) + '</span>';
          canDl = true;
        } else {
          statusHtml = '<span class="text-warning">' + esc_(st.message || 'Not ready') + '</span>';
        }
        statusEl.innerHTML = statusHtml;
        if (dlBtn) dlBtn.disabled = !canDl;
        if (!skipCacheUpdate && viewCache_) {
          viewCache_.selectedVertical = vertical;
          viewCache_.statusHtml = statusHtml;
          viewCache_.canDownload = canDl;
          viewCache_.run = baseRun;
        }
      }).catch(function (err) {
        statusEl.textContent = err.message || 'Status check failed.';
        if (dlBtn) dlBtn.disabled = true;
      });
    }

    function paintMain_(run, selectedVertical, statusHtml, canDownload, fetchStatus) {
      var m = document.getElementById('formt-mount');
      if (!m) return;

      var defaultVertical = selectedVertical || runState_.vertical ||
        verticalFromRun_(run) || (catalog_.length ? catalog_[0].vertical_name : '');
      var statusContent = statusHtml || '<span class="hint">Checking status…</span>';

      period_.year = Number(run.period_year);
      period_.month = Number(run.period_month);

      m.innerHTML =
        '<div class="card">' +
        '<p class="page-lede">Choose payroll month and vertical, then download Form T Excel for that period (including finalized months).</p>' +
        '<div class="form-row formt-period-toolbar" style="align-items:flex-end;margin-bottom:12px">' +
        '<div class="form-group"><label class="form-label" for="formt-year">Year</label>' +
        '<input class="form-input" id="formt-year" type="number" min="2000" max="2100" value="' + esc_(period_.year) + '"></div>' +
        '<div class="form-group"><label class="form-label" for="formt-month">Month</label>' +
        '<select class="form-select" id="formt-month">' + monthSelectHtml_(period_.month) + '</select></div>' +
        '<div class="form-group"><label class="form-label" for="formt-vertical">Vertical</label>' +
        '<select class="form-select" id="formt-vertical">' + verticalOptionsHtml_(defaultVertical) + '</select></div>' +
        '<button type="button" class="btn btn-secondary" id="formt-apply-period">Apply</button>' +
        '</div>' +
        '<p class="hint"><strong>' + esc_(fmtPeriod_(run.period_year, run.period_month)) + '</strong> · ' +
        '<span class="mono" id="formt-run-label">' + esc_(run.payroll_run_id) + '</span> · ' +
        esc_(String(run.status || '')) + '</p>' +
        '<div id="formt-status" class="formt-status">' + statusContent + '</div>' +
        '<div class="bulk-action-bar">' +
        '<button type="button" class="btn btn-primary" id="formt-download"' + (canDownload ? '' : ' disabled') + '>Download Form T</button>' +
        '<button type="button" class="btn btn-secondary" id="formt-goto-register">Register</button>' +
        '</div></div>';

      document.getElementById('formt-apply-period').addEventListener('click', function () {
        if (!applyPeriodFromForm_(true)) return;
        loadContext_(true);
      });

      document.getElementById('formt-goto-register').addEventListener('click', function () {
        var vertical = document.getElementById('formt-vertical').value;
        var runId = resolveRunIdForVertical_(vertical, run);
        navigate('attendance-bulk-upload', {
          year: run.period_year,
          month: run.period_month,
          runId: runId,
          vertical: vertical
        });
      });

      document.getElementById('formt-vertical').addEventListener('change', function () {
        refreshStatus_(run);
      });

      document.getElementById('formt-download').addEventListener('click', function () {
        var vertical = document.getElementById('formt-vertical').value;
        var runId = resolveRunIdForVertical_(vertical, run);
        var btn = this;
        callServer('apiDownloadFormT', runId, vertical, { button: btn, loadingText: 'Generating…' })
          .then(function (res) {
            downloadBlob_(res);
            showToast('Form T downloaded.', 'success');
          })
          .catch(function (err) { showToast(err.message || 'Download failed', 'error'); });
      });

      viewCache_ = {
        periodKey: periodKey_(),
        run: run,
        catalog: (catalog_ || []).slice(),
        selectedVertical: defaultVertical,
        statusHtml: statusContent,
        canDownload: !!canDownload
      };

      if (fetchStatus) refreshStatus_(run);
      if (App.markModuleViewLoaded) App.markModuleViewLoaded(MODULE_KEY_);
    }

    App.registerRoute('attendance-form-t', { title: 'Form T', render: render_ });
  });
})();
</script>
