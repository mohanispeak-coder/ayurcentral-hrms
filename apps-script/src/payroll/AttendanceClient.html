<style>
.att-page .att-list-head { display: flex; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.att-page .data-table { width: 100%; }
.att-page .att-day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 12px; }
.att-page .att-day-cell label { font-size: 11px; color: var(--color-text-muted); display: block; }
.att-page .att-day-cell input { width: 100%; text-align: center; text-transform: uppercase; }
.att-page .att-codes-hint { font-size: 13px; color: var(--color-text-muted); margin: 8px 0; }
.att-page .hidden-file { display: none !important; }
.att-page .att-vertical-section { margin-top: 16px; }
.att-page .att-preview-grid { font-size: 12px; overflow-x: auto; }
.att-page .att-preview-grid td, .att-page .att-preview-grid th { padding: 4px 6px; text-align: center; }
</style>
<script>
(function () {
  'use strict';

  var initialized_ = false;
  var MODULE_KEY_ = 'attendance-bulk-upload';
  var bulkState_ = { uploadId: null, preview: null, runId: null, vertical: null, fileMeta: null, fileName: '' };
  var period_ = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
  var catalog_ = [];
  var viewCache_ = null;

  function periodKey_() {
    return period_.year + '-' + period_.month;
  }

  function skeletonMount_(App) {
    if (App.sectionSkeleton) {
      return App.sectionSkeleton({ variant: 'card', lines: 4, label: 'Loading register' });
    }
    return '<div class="hrms-loading-block" aria-busy="true"><span class="visually-hidden">Loading</span></div>';
  }

  function whenAppReady(fn) {
    function run() {
      var App = window.HrmsApp;
      if (!App || !App.registerRoute || !App.callServer) return false;
      fn(App);
      return true;
    }
    if (run()) return;
    var tries = 0;
    var timer = setInterval(function () {
      if (run() || ++tries > 200) clearInterval(timer);
    }, 25);
  }

  whenAppReady(function initAttendanceUi(App) {
    if (initialized_) return;
    initialized_ = true;

    var callServer = App.callServer;
    var escapeHtml = App.escapeHtml;
    var showToast = App.showToast;
    var navigate = App.navigate;

    function esc_(v) {
      return escapeHtml(v == null ? '' : String(v));
    }

    function pageEl_() {
      var p = document.getElementById('page-content');
      if (p) p.classList.remove('hidden');
      return p;
    }

    function fmtPeriod_(y, m) {
      var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return (names[m - 1] || m) + ' ' + y;
    }

    function verticalOptionsHtml_(selected) {
      return (catalog_ || []).map(function (v) {
        var sel = selected === v.vertical_name ? ' selected' : '';
        return '<option value="' + esc_(v.vertical_name) + '"' + sel + '>' +
          esc_(v.vertical_name) + ' - ' + esc_(v.legal_name) + '</option>';
      }).join('');
    }

    function render_(params) {
      params = params || {};
      if (params.year) period_.year = Number(params.year);
      if (params.month) period_.month = Number(params.month);
      var page = pageEl_();
      if (!page) return;

      var forceRefresh = App.isModuleRefresh && App.isModuleRefresh(MODULE_KEY_);
      var restore = !forceRefresh && App.consumeModuleViewRestore && App.consumeModuleViewRestore(MODULE_KEY_);
      if (restore && viewCache_ && viewCache_.periodKey === periodKey_() && viewCache_.run) {
        catalog_ = viewCache_.catalog || catalog_;
        if (viewCache_.bulkState) {
          bulkState_.vertical = viewCache_.bulkState.vertical || bulkState_.vertical;
          bulkState_.fileMeta = viewCache_.bulkState.fileMeta || null;
          bulkState_.fileName = viewCache_.bulkState.fileName || '';
          bulkState_.uploadId = viewCache_.bulkState.uploadId || null;
          bulkState_.preview = viewCache_.bulkState.preview || null;
        }
        page.innerHTML =
          '<div class="att-page"><div class="page-header"><h2>Register</h2></div><div id="att-mount"></div></div>';
        paintMain_(viewCache_.run, viewCache_.list || [], {});
        if (App.markModuleViewLoaded) App.markModuleViewLoaded(MODULE_KEY_);
        return;
      }

      page.innerHTML =
        '<div class="att-page"><div class="page-header"><h2>Register</h2></div>' +
        '<div id="att-mount">' + skeletonMount_(App) + '</div></div>';
      callServer('apiGetVerticalCatalog').then(function (cat) {
        catalog_ = cat || [];
        loadContext_();
      }).catch(function () {
        catalog_ = [];
        loadContext_();
      });
    }

    function loadContext_() {
      callServer('apiListPayrollRuns').then(function (runs) {
        var run = findRunForPeriod_(runs || [], period_.year, period_.month);
        if (!run) {
          paintNoRun_();
          return;
        }
        bulkState_.runId = run.payroll_run_id;
        Promise.all([
          callServer('apiListAttendanceRegister', run.payroll_run_id),
          callServer('apiGetPayrollRun', run.payroll_run_id)
        ]).then(function (res) {
          paintMain_(run, res[0] || [], res[1] || {});
        }).catch(function (err) {
          var m = document.getElementById('att-mount');
          if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load attendance.') + '</div>';
        });
      }).catch(function (err) {
        var m = document.getElementById('att-mount');
        if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load payroll runs.') + '</div>';
      });
    }

    function findRunForPeriod_(runs, year, month) {
      var open = runs.filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month &&
          String(r.status || '').toUpperCase() !== 'LOCKED';
      });
      if (open.length) return open[0];
      return runs.filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month;
      })[0] || null;
    }

    function filterListByVertical_(list, vertical) {
      if (!vertical) return list || [];
      var want = String(vertical).toUpperCase();
      return (list || []).filter(function (r) {
        return String(r.vertical_name || '').toUpperCase() === want;
      });
    }

    function groupByVertical_(list) {
      var groups = {};
      (list || []).forEach(function (r) {
        var v = String(r.vertical_name || 'OTHERS').toUpperCase();
        if (!groups[v]) groups[v] = [];
        groups[v].push(r);
      });
      return groups;
    }

    function refreshVerticalSections_(list) {
      var mount = document.getElementById('att-vertical-sections');
      if (!mount) return;
      var vertical = selectedVertical_();
      mount.innerHTML = renderVerticalSections_(filterListByVertical_(list, vertical));
    }

    function renderVerticalSections_(list) {
      var groups = groupByVertical_(list);
      var codes = ['P', 'W/H', 'A', 'L', 'WO', 'ML', 'H'];
      var verticals = Object.keys(groups).sort();
      if (!verticals.length) return '<p class="hint">No employees in this payroll run yet.</p>';
      return verticals.map(function (v, idx) {
        var rows = groups[v];
        var openAttr = idx === 0 ? ' open' : '';
        var body = rows.map(function (r) {
          var cc = r.code_counts || (r.summary && r.summary.code_counts) || {};
          var codeCells = codes.map(function (c) {
            return '<td class="num">' + esc_(cc[c] != null ? cc[c] : 0) + '</td>';
          }).join('');
          var complete = r.register_complete ? 'Yes' : 'No';
          return '<tr><td class="mono">' + esc_(r.employee_id) + '</td><td>' + esc_(r.display_name) + '</td>' +
            codeCells +
            '<td class="num">' + esc_(r.days_total != null ? r.days_total : (r.summary && r.summary.days_total)) + '</td>' +
            '<td>' + esc_(complete) + '</td></tr>';
        }).join('');
        var headCodes = codes.map(function (c) { return '<th class="num">' + esc_(c) + '</th>'; }).join('');
        return '<details class="card att-vertical-section"' + openAttr + '><summary><strong>' + esc_(v) +
          '</strong> <span class="hint">(' + rows.length + ')</span></summary>' +
          '<table class="data-table"><thead><tr><th>ID</th><th>Name</th>' + headCodes +
          '<th class="num">DAYS</th><th>Complete</th></tr></thead><tbody>' + body + '</tbody></table></details>';
      }).join('');
    }

    function paintNoRun_() {
      var m = document.getElementById('att-mount');
      if (!m) return;
      m.innerHTML =
        '<div class="card"><h2>' + esc_(fmtPeriod_(period_.year, period_.month)) + '</h2>' +
        '<p class="page-lede">Start payroll for this month first, then upload or enter attendance.</p>' +
        '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Year</label><input class="form-input" id="att-year" type="number" value="' + period_.year + '"></div>' +
        '<div class="form-group"><label class="form-label">Month</label><input class="form-input" id="att-month" type="number" min="1" max="12" value="' + period_.month + '"></div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="att-start-run">Start payroll for this month</button></div>';
      document.getElementById('att-year').addEventListener('change', function () { period_.year = Number(this.value); });
      document.getElementById('att-month').addEventListener('change', function () { period_.month = Number(this.value); });
      document.getElementById('att-start-run').addEventListener('click', function () {
        var btn = this;
        callServer('apiCreatePayrollRun', period_.year, period_.month, '', { button: btn, loadingText: 'Starting…' })
          .then(function () {
            showToast('Payroll started.', 'success');
            loadContext_();
          })
          .catch(function (err) { showToast(err.message || 'Failed', 'error'); });
      });
      if (App.markModuleViewLoaded) App.markModuleViewLoaded('attendance-bulk-upload');
    }

    function paintMain_(run, list, detail) {
      var m = document.getElementById('att-mount');
      if (!m) return;
      var st = String(run.status || '').toUpperCase();
      var canEdit = st === 'DRAFT' || st === 'CALCULATED';
      var defaultVertical = bulkState_.vertical || (catalog_.length ? catalog_[0].vertical_name : '');

      m.innerHTML =
        '<div class="card bulk-upload-card"><div class="form-row" style="margin-bottom:12px">' +
        '<div class="form-group"><label class="form-label">Period</label><strong>' + esc_(fmtPeriod_(run.period_year, run.period_month)) +
        '</strong> <span class="hint">(' + esc_(run.payroll_run_id) + ' · ' + esc_(st) + ')</span></div>' +
        '<div class="form-group"><label class="form-label" for="att-vertical">Vertical</label>' +
        '<select class="form-select" id="att-vertical" ' + (canEdit ? '' : 'disabled') + '>' + verticalOptionsHtml_(defaultVertical) + '</select></div>' +
        '</div>' +
        (canEdit ? '<ol class="bulk-steps"><li>Select vertical and download register template</li>' +
          '<li>Fill day columns on the Attendance sheet (from row 3)</li>' +
          '<li>Choose Excel file, <strong>Validate upload</strong>, then confirm import</li></ol>' : '') +
        '<div class="att-list-head bulk-action-bar">' +
        (canEdit ? '<button type="button" class="btn btn-secondary" id="att-dl-template">Download register template</button>' +
          '<button type="button" class="btn btn-secondary" id="att-choose-file">Choose Excel file</button>' +
          '<input type="file" id="att-file" class="hidden-file" tabindex="-1" aria-hidden="true" accept=".xlsx,.xls">' +
          '<button type="button" class="btn btn-primary" id="att-validate-upload" disabled>Validate upload</button>' +
          '<button type="button" class="btn btn-secondary" id="att-commit" disabled>Upload attendance</button>' : '') +
        '<button type="button" class="btn btn-secondary" id="att-goto-payroll">Continue to Payroll</button>' +
        '<button type="button" class="btn btn-secondary" id="att-goto-formt">Form T</button></div>' +
        (canEdit ? '<p id="att-file-name" class="form-hint">' + esc_(bulkState_.fileName || 'No file selected.') + '</p>' : '') +
        '<p class="att-codes-hint">Codes: <strong>P</strong> present · <strong>W/H</strong> Work from Home · <strong>A</strong> absent · ' +
        '<strong>L</strong> leave · <strong>WO</strong> weekly off · <strong>ML</strong> Maternity Leave (legacy S on import) · <strong>H</strong> holiday</p>' +
        '<p class="hint">Register summary below is for the selected vertical. Download template and upload for that same vertical.</p>' +
        '<div id="att-vertical-sections">' + renderVerticalSections_(filterListByVertical_(list, defaultVertical)) + '</div>' +
        '</div>' +
        '<div id="att-preview"></div><div id="att-feedback" class="action-feedback hidden"></div>';

      document.getElementById('att-goto-payroll').addEventListener('click', function () {
        navigate('payroll', { year: run.period_year, month: run.period_month, runId: run.payroll_run_id });
      });
      document.getElementById('att-goto-formt').addEventListener('click', function () {
        navigate('attendance-form-t', { year: run.period_year, month: run.period_month, runId: run.payroll_run_id });
      });

      if (canEdit) bindBulk_(run.payroll_run_id);

      if (canEdit) {
        syncBulkActionButtons_();
        if (bulkState_.preview) {
          paintPreview_(bulkState_.preview, run.payroll_run_id, false);
        }
      }

      syncBulkViewCache_(run, list);
      if (App.markModuleViewLoaded) App.markModuleViewLoaded(MODULE_KEY_);
    }

    function selectedVertical_() {
      var sel = document.getElementById('att-vertical');
      return sel ? sel.value : '';
    }

    function syncBulkViewCache_(run, list) {
      viewCache_ = {
        periodKey: periodKey_(),
        run: run,
        list: list,
        catalog: (catalog_ || []).slice(),
        bulkState: {
          vertical: bulkState_.vertical || selectedVertical_(),
          fileMeta: bulkState_.fileMeta,
          fileName: bulkState_.fileName || '',
          uploadId: bulkState_.uploadId,
          preview: bulkState_.preview
        }
      };
    }

    function clearStagedUpload_() {
      bulkState_.uploadId = null;
      bulkState_.preview = null;
      var prev = document.getElementById('att-preview');
      if (prev) prev.innerHTML = '';
      syncBulkActionButtons_();
    }

    function syncBulkActionButtons_() {
      var validateBtn = document.getElementById('att-validate-upload');
      var commitBtn = document.getElementById('att-commit');
      var hasFile = !!(bulkState_.fileMeta && selectedVertical_());
      var ready = bulkState_.preview && Number(bulkState_.preview.readyCount) > 0 && bulkState_.uploadId;
      if (validateBtn) validateBtn.disabled = !hasFile;
      if (commitBtn) commitBtn.disabled = !ready;
    }

    function downloadBlob_(file) {
      if (!file || !file.base64) return;
      var binary = atob(file.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.fileName || 'HRMS_Attendance_Register.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function bindBulk_(runId) {
      var fileInput = document.getElementById('att-file');
      var validateBtn = document.getElementById('att-validate-upload');
      var commitBtn = document.getElementById('att-commit');
      var nameEl = document.getElementById('att-file-name');
      var verticalSel = document.getElementById('att-vertical');
      if (verticalSel) {
        verticalSel.addEventListener('change', function () {
          bulkState_.vertical = verticalSel.value;
          clearStagedUpload_();
          if (viewCache_ && viewCache_.list) refreshVerticalSections_(viewCache_.list);
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          syncBulkActionButtons_();
        });
        if (!bulkState_.vertical) bulkState_.vertical = verticalSel.value;
      }

      document.getElementById('att-dl-template').addEventListener('click', function () {
        var vertical = selectedVertical_();
        if (!vertical) {
          showToast('Select a vertical first.', 'error');
          return;
        }
        var btn = this;
        callServer('apiDownloadAttendanceRegisterTemplate', runId, vertical, { button: btn, loadingText: 'Downloading…' })
          .then(function (res) {
            if (!res || !res.base64) {
              showToast('Template download returned no file. Run clasp push and redeploy the web app.', 'error');
              return;
            }
            downloadBlob_(res);
            var n = res.employeeCount != null ? res.employeeCount : '';
            var extra = n !== '' ? ' - ' + n + ' employee' + (n === 1 ? '' : 's') : '';
            showToast('Register template downloaded' + extra + '.', 'success');
          })
          .catch(function (err) {
            showToast((err && err.message) || 'Download failed', 'error');
          });
      });

      var chooseBtn = document.getElementById('att-choose-file');
      if (chooseBtn && fileInput) {
        chooseBtn.addEventListener('click', function () {
          if (!selectedVertical_()) {
            showToast('Select a vertical first.', 'error');
            return;
          }
          fileInput.click();
        });
      }

      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        bulkState_.fileMeta = null;
        bulkState_.fileName = '';
        clearStagedUpload_();
        if (!f) {
          if (nameEl) nameEl.textContent = 'No file selected.';
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          syncBulkActionButtons_();
          return;
        }
        if (nameEl) nameEl.textContent = f.name;
        bulkState_.fileName = f.name;
        var reader = new FileReader();
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          var binary = '';
          for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          bulkState_.fileMeta = { fileName: f.name, mimeType: f.type, base64: btoa(binary) };
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          syncBulkActionButtons_();
        };
        reader.readAsArrayBuffer(f);
      });

      if (validateBtn) {
        validateBtn.addEventListener('click', function () {
          var vertical = selectedVertical_();
          if (!vertical || !bulkState_.fileMeta) return;
          callServer('apiValidateAttendanceRegisterUpload', runId, vertical, bulkState_.fileMeta,
            { button: validateBtn, loadingText: 'Validating…' })
            .then(function (preview) {
              bulkState_.uploadId = preview.uploadId;
              bulkState_.preview = preview;
              bulkState_.vertical = vertical;
              paintPreview_(preview, runId, false);
              syncBulkActionButtons_();
              if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
              if (preview.readyCount > 0) {
                showToast(preview.readyCount + ' employee(s) ready to import' +
                  (preview.errorCount > 0 ? (' · ' + preview.errorCount + ' need attention') : '') + '.', 'success');
              } else {
                showToast(preview.errorCount ? 'No valid rows to import. See details below.' : 'Nothing to import.', 'error');
              }
            })
            .catch(function (err) { showToast(err.message || 'Validation failed', 'error'); });
        });
      }

      if (commitBtn) {
        commitBtn.addEventListener('click', function () {
          if (!bulkState_.preview || !bulkState_.uploadId || !bulkState_.preview.readyCount) return;
          var preview = bulkState_.preview;
          callServer('apiCommitAttendanceRegisterUpload', runId, bulkState_.uploadId,
            { button: commitBtn, loadingText: 'Importing…' })
            .then(function () {
              bulkState_.uploadId = null;
              bulkState_.preview = null;
              bulkState_.fileMeta = null;
              bulkState_.fileName = '';
              if (fileInput) fileInput.value = '';
              if (nameEl) nameEl.textContent = 'No file selected.';
              if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
              clearStagedUpload_();
              showToast('Attendance imported (' + preview.readyCount + '). Re-upload overwrites existing days.', 'success');
              if (preview.errorCount > 0) {
                showToast(preview.errorCount + ' row(s) skipped - fix the file and validate again.', 'warning');
              }
              loadContext_();
            })
            .catch(function (err) { showToast(err.message || 'Import failed', 'error'); });
        });
      }

      bindPreviewActions_(runId, fileInput, nameEl);
    }

    function bindPreviewActions_(runId, fileInput, nameEl) {
      var cancelBtn = document.getElementById('att-cancel-staged');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function () {
          clearStagedUpload_();
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          showToast('Validation cleared. Choose a file and validate again.', 'info');
        });
      }
    }

    function paintPreviewGrid_(validRows, dim) {
      if (!validRows || !validRows.length) return '';
      var codes = ['P', 'W/H', 'A', 'L', 'WO', 'ML', 'H'];
      var head = '<tr><th>ID</th><th>Name</th>';
      for (var d = 1; d <= dim; d++) {
        var key = (d < 10 ? '0' : '') + d;
        head += '<th>' + key + '</th>';
      }
      codes.forEach(function (c) { head += '<th>' + c + '</th>'; });
      head += '<th>DAYS</th></tr>';
      var body = validRows.map(function (row) {
        var reg = row.register || {};
        var cc = row.code_counts || {};
        var line = '<tr><td class="mono">' + esc_(row.employee_id) + '</td><td>' + esc_(row.display_name) + '</td>';
        for (var day = 1; day <= dim; day++) {
          var k = (day < 10 ? '0' : '') + day;
          line += '<td>' + esc_(reg[k] || '') + '</td>';
        }
        codes.forEach(function (c) {
          line += '<td class="num">' + esc_(cc[c] != null ? cc[c] : 0) + '</td>';
        });
        line += '<td class="num">' + esc_(row.days_total != null ? row.days_total : '') + '</td></tr>';
        return line;
      }).join('');
      return '<table class="data-table att-preview-grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    }

    function paintPreview_(preview, runId, errorsOnly) {
      var el = document.getElementById('att-preview');
      if (!el || !preview) return;
      var ready = Number(preview.readyCount || preview.validCount || 0);
      var errN = Number(preview.errorCount || 0);
      var total = Number(preview.totalRows || preview.employeesFound || 0);
      var html = '<div class="card upload-preview"><h3>Validation result</h3>' +
        '<p><strong>' + esc_(total) + '</strong> row(s) in file · ' +
        '<strong>' + esc_(ready) + '</strong> ready to import · ' +
        '<strong>' + esc_(errN) + '</strong> need attention</p>';
      if (ready > 0 && !errorsOnly) {
        html += '<p class="hint">Click <strong>Upload attendance</strong> to import validated rows. Re-import overwrites daily codes for those employees.</p>';
      }
      if (preview.errors && preview.errors.length) {
        html += '<div class="' + (errN ? 'alert alert-warning' : '') + '" style="margin-top:12px">' +
          '<strong>Rows needing attention</strong><ul class="hint" style="margin:8px 0 0">';
        preview.errors.slice(0, 20).forEach(function (err) {
          var msgs = (err.messages || []).map(function (m) { return m.message || m; }).join('; ');
          html += '<li>Row ' + esc_(err.rowNumber) + (err.employee_id ? ' · ' + esc_(err.employee_id) : '') +
            (msgs ? ': ' + esc_(msgs) : '') + '</li>';
        });
        if (preview.errors.length > 20) html += '<li>…and ' + (preview.errors.length - 20) + ' more</li>';
        html += '</ul></div>';
      }
      if (ready > 0) {
        html += '<div class="primary-next" style="margin-top:12px">' +
          '<button type="button" class="btn btn-secondary" id="att-cancel-staged">Clear validation</button></div>';
      } else if (errN) {
        html += '<div class="primary-next" style="margin-top:12px">' +
          '<button type="button" class="btn btn-secondary" id="att-cancel-staged">Dismiss</button></div>';
      }
      html += '</div>';
      el.innerHTML = html;
      bindPreviewActions_(runId);
    }

    function daysInMonth_(y, m) {
      return new Date(y, m, 0).getDate();
    }

    App.registerRoute('attendance-bulk-upload', { title: 'Register', render: render_ });
  });
})();
</script>
