<style>
.att-page .att-list-head { display: flex; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.att-page .data-table { width: 100%; }
.att-page .att-day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 12px; }
.att-page .att-day-cell label { font-size: 11px; color: var(--color-text-muted); display: block; }
.att-page .att-day-cell input { width: 100%; text-align: center; text-transform: uppercase; }
.att-page .att-codes-hint { font-size: 13px; color: var(--color-text-muted); margin: 8px 0; }
.att-page .hidden-file { display: none !important; }
.att-page .att-vertical-section { margin-top: 16px; }
.att-page .att-preview-grid { font-size: 12px; overflow-x: auto; }
.att-page .att-preview-grid td, .att-page .att-preview-grid th { padding: 4px 6px; text-align: center; }
.att-page .bulk-action-bar .btn { min-height: var(--touch-min, 44px); }
.att-page .att-vertical-section summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
@media (max-width: 768px) {
  .att-page .form-row { flex-direction: column; align-items: stretch; }
  .att-page .bulk-action-bar { flex-direction: column; align-items: stretch; }
  .att-page .bulk-action-bar .btn { width: 100%; }
  .att-page .data-table { font-size: 12px; }
  .att-page .att-vertical-section .table-wrap { margin: 0 -4px; }
}
</style>
<script>
(function () {
  'use strict';

  var initialized_ = false;
  var MODULE_KEY_ = 'attendance-bulk-upload';
  var bulkState_ = { uploadId: null, preview: null, runId: null, vertical: null, fileMeta: null, fileName: '' };
  var period_ = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };
  var catalog_ = [];
  var viewCache_ = null;
  var runsCache_ = [];
  var listCacheByRun_ = {};

  function verticalFromRunId_(runId) {
    var parts = String(runId || '').trim().split('-');
    if (parts[0] !== 'PR' || parts.length < 4) return '';
    var vert = parts[3];
    if (!vert || /^C\d+$/i.test(vert)) return '';
    return vert.toUpperCase();
  }

  function verticalFromRun_(run) {
    var v = String(run && run.vertical_name || '').trim().toUpperCase();
    if (v) return v;
    return verticalFromRunId_(run && run.payroll_run_id);
  }

  function periodKey_() {
    return period_.year + '-' + period_.month;
  }

  function skeletonMount_(App) {
    if (App.sectionSkeleton) {
      return App.sectionSkeleton({ variant: 'card', lines: 4, label: 'Loading register' });
    }
    return '<div class="hrms-loading-block" aria-busy="true"><span class="visually-hidden">Loading</span></div>';
  }

  function whenAppReady(fn) {
    function run() {
      var App = window.HrmsApp;
      if (!App || !App.registerRoute || !App.callServer) return false;
      fn(App);
      return true;
    }
    if (run()) return;
    var tries = 0;
    var timer = setInterval(function () {
      if (run() || ++tries > 200) clearInterval(timer);
    }, 25);
  }

  whenAppReady(function initAttendanceUi(App) {
    if (initialized_) return;
    initialized_ = true;

    var callServer = App.callServer;
    var escapeHtml = App.escapeHtml;
    var showToast = App.showToast;
    var navigate = App.navigate;

    function esc_(v) {
      return escapeHtml(v == null ? '' : String(v));
    }

    function pageEl_() {
      var p = document.getElementById('page-content');
      if (p) p.classList.remove('hidden');
      return p;
    }

    function fmtPeriod_(y, m) {
      var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return (names[m - 1] || m) + ' ' + y;
    }

    function verticalOptionsHtml_(selected) {
      return (catalog_ || []).map(function (v) {
        var sel = selected === v.vertical_name ? ' selected' : '';
        var label = App.formatVerticalOptionLabel
          ? App.formatVerticalOptionLabel(v.vertical_name, v.legal_name)
          : (v.vertical_name + ' - ' + (v.legal_name || ''));
        return '<option value="' + esc_(v.vertical_name) + '"' + sel + '>' + esc_(label) + '</option>';
      }).join('');
    }

    function mergePayrollNavParams_(params) {
      params = params || {};
      if (App.readPayrollPeriodContext) {
        var ctx = App.readPayrollPeriodContext();
        if (ctx) {
          if (ctx.year != null && params.year == null) params.year = ctx.year;
          if (ctx.month != null && params.month == null) params.month = ctx.month;
          if (ctx.runId && params.runId == null) params.runId = ctx.runId;
          if (ctx.vertical && params.vertical == null) params.vertical = ctx.vertical;
        }
      }
      if (App.getPayrollPeriodParams) {
        var pp = App.getPayrollPeriodParams();
        if (pp) {
          if (pp.year != null && params.year == null) params.year = pp.year;
          if (pp.month != null && params.month == null) params.month = pp.month;
          if (pp.runId && params.runId == null) params.runId = pp.runId;
          if (pp.vertical && params.vertical == null) params.vertical = pp.vertical;
        }
      }
      return params;
    }

    function applyRouteParams_(params) {
      if (params.year) period_.year = Number(params.year);
      if (params.month) period_.month = Number(params.month);
      if (params.vertical) bulkState_.vertical = String(params.vertical).trim().toUpperCase();
      if (params.runId) bulkState_.runId = String(params.runId).trim();
    }

    function invalidateListCache_(runId) {
      if (runId) delete listCacheByRun_[runId];
      else listCacheByRun_ = {};
    }

    function fetchAttendanceList_(runId, options) {
      options = options || {};
      var sync = !!options.syncEmployees;
      var id = String(runId || '').trim();
      if (!id) return Promise.resolve([]);
      if (!sync && listCacheByRun_[id] && listCacheByRun_[id].list) {
        return Promise.resolve(listCacheByRun_[id].list);
      }
      var rpcArgs = sync ? [id, true] : [id];
      return callServer.apply(null, ['apiListAttendanceRegister'].concat(rpcArgs)).then(function (list) {
        list = list || [];
        listCacheByRun_[id] = { list: list, at: Date.now() };
        return list;
      });
    }

    function applyViewCacheState_(params) {
      if (!viewCache_ || !viewCache_.run) return false;
      var run = viewCache_.run;
      var wantRunId = params.runId || bulkState_.runId;
      if (wantRunId && run.payroll_run_id !== String(wantRunId).trim()) return false;
      var wantV = params.vertical ? String(params.vertical).trim().toUpperCase() : '';
      var cacheRunV = verticalFromRun_(run);
      if (wantV && cacheRunV && cacheRunV !== wantV) return false;
      period_.year = Number(run.period_year);
      period_.month = Number(run.period_month);
      bulkState_.runId = run.payroll_run_id;
      if (viewCache_.bulkState) {
        bulkState_.vertical = viewCache_.bulkState.vertical || bulkState_.vertical;
        bulkState_.fileMeta = viewCache_.bulkState.fileMeta || null;
        bulkState_.fileName = viewCache_.bulkState.fileName || '';
        bulkState_.uploadId = viewCache_.bulkState.uploadId || null;
        bulkState_.preview = viewCache_.bulkState.preview || null;
      }
      if (verticalFromRun_(run)) bulkState_.vertical = verticalFromRun_(run);
      catalog_ = viewCache_.catalog || catalog_;
      return true;
    }

    function tryRestoreCachedView_(params, forceRefresh) {
      if (forceRefresh) return false;
      if (!applyViewCacheState_(params)) return false;
      return !!(viewCache_.list && viewCache_.run);
    }

    function resolveRunForAttendance_(runs) {
      runs = runs || [];
      if (bulkState_.runId) {
        var byId = runs.filter(function (r) { return r.payroll_run_id === bulkState_.runId; })[0];
        if (byId) return byId;
      }
      return findRunForPeriod_(runs, period_.year, period_.month, bulkState_.vertical);
    }

    function runsForMonth_(year, month) {
      return (runsCache_ || []).filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month;
      });
    }

    function paintRunPickerHtml_(run) {
      var list = runsForMonth_(run.period_year, run.period_month);
      if (list.length <= 1) return '';
      var opts = list.map(function (r) {
        var vert = verticalFromRun_(r) || 'Combined';
        var st = String(r.status || '').toUpperCase();
        var label = r.payroll_run_id + ' · ' + vert + ' · ' + st;
        var sel = r.payroll_run_id === run.payroll_run_id ? ' selected' : '';
        return '<option value="' + esc_(r.payroll_run_id) + '"' + sel + '>' + esc_(label) + '</option>';
      }).join('');
      return '<div class="form-group" style="margin-top:8px"><label class="form-label" for="att-run-picker">Payroll run</label>' +
        '<p class="hint">Multiple runs exist this month. Pick the same run as on Payroll before downloading the template.</p>' +
        '<select class="form-select" id="att-run-picker" style="max-width:420px">' + opts + '</select></div>';
    }

    function render_(params) {
      params = mergePayrollNavParams_(params || {});
      applyRouteParams_(params);
      if (params.runId && viewCache_ && viewCache_.run &&
          viewCache_.run.payroll_run_id !== String(params.runId).trim()) {
        viewCache_ = null;
      }
      if (App.persistPayrollPeriodContext) App.persistPayrollPeriodContext(params);
      var page = pageEl_();
      if (!page) return;

      var forceRefresh = App.isModuleRefresh && App.isModuleRefresh(MODULE_KEY_);
      if (tryRestoreCachedView_(params, forceRefresh)) {
        page.innerHTML =
          '<div class="att-page"><div class="page-header"><h2>Register</h2></div><div id="att-mount"></div></div>';
        paintMain_(viewCache_.run, viewCache_.list || [], {});
        if (App.consumeModuleViewRestore) App.consumeModuleViewRestore(MODULE_KEY_);
        if (App.markModuleViewLoaded) {
          App.markModuleViewLoaded(MODULE_KEY_, { params: params });
        }
        return;
      }

      page.innerHTML =
        '<div class="att-page"><div class="page-header"><h2>Register</h2></div>' +
        '<div id="att-mount">' + skeletonMount_(App) + '</div></div>';
      var runsRpc = App.fetchPayrollRunsList
        ? App.fetchPayrollRunsList(callServer)
        : callServer('apiListPayrollRuns');
      (App.fetchVerticalCatalog ? App.fetchVerticalCatalog(callServer) : callServer('apiGetVerticalCatalog'))
        .catch(function () { return []; })
        .then(function (cat) { catalog_ = cat || []; });
      runsRpc.then(function (runs) {
        runsCache_ = runs || [];
        loadContext_(true);
      }).catch(function (err) {
        var m = document.getElementById('att-mount');
        if (m) {
          m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load attendance.') + '</div>';
        }
      });
    }

    function reconcilePeriodWithRuns_(runs) {
      if (!App.reconcilePayrollPeriodWithRuns) return;
      var rec = App.reconcilePayrollPeriodWithRuns({
        year: period_.year,
        month: period_.month,
        runId: bulkState_.runId,
        vertical: bulkState_.vertical
      }, runs || []);
      if (rec.year) period_.year = rec.year;
      if (rec.month) period_.month = rec.month;
      if (rec.runId) bulkState_.runId = rec.runId;
      if (rec.vertical) bulkState_.vertical = rec.vertical;
      if (App.persistPayrollPeriodContext) App.persistPayrollPeriodContext(rec);
    }

    function applySuggestedPeriodIfNeeded_(runs) {
      var run = resolveRunForAttendance_(runs);
      if (run || !runs || !runs.length || !App.suggestPayrollPeriodFromRuns) return run;
      var sug = App.suggestPayrollPeriodFromRuns(runs, bulkState_.vertical);
      if (!sug) return null;
      period_.year = sug.year;
      period_.month = sug.month;
      if (sug.runId) bulkState_.runId = sug.runId;
      if (sug.vertical) bulkState_.vertical = sug.vertical;
      reconcilePeriodWithRuns_(runs);
      return resolveRunForAttendance_(runs);
    }

    function loadContext_(runsAlreadyLoaded) {
      function afterRuns_(runs) {
        runsCache_ = runs || [];
        reconcilePeriodWithRuns_(runsCache_);
        var run = applySuggestedPeriodIfNeeded_(runsCache_);
        if (!run) {
          paintNoRun_();
          return;
        }
        bulkState_.runId = run.payroll_run_id;
        if (verticalFromRun_(run)) bulkState_.vertical = verticalFromRun_(run);
        var syncList = App.isModuleRefresh && App.isModuleRefresh(MODULE_KEY_);
        var cached = !syncList && listCacheByRun_[run.payroll_run_id];
        if (cached && cached.list) {
          paintMain_(run, cached.list);
        }
        fetchAttendanceList_(run.payroll_run_id, { syncEmployees: syncList }).then(function (list) {
          if (App.persistPayrollPeriodContext) {
            App.persistPayrollPeriodContext({
              year: run.period_year,
              month: run.period_month,
              runId: run.payroll_run_id,
              vertical: bulkState_.vertical || verticalFromRun_(run)
            });
          }
          if (!cached || !cached.list) {
            paintMain_(run, list || []);
          } else if (list && list.length !== cached.list.length) {
            paintMain_(run, list || []);
          }
        }).catch(function (err) {
          var m = document.getElementById('att-mount');
          if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load attendance.') + '</div>';
        });
      }
      if (runsAlreadyLoaded) {
        afterRuns_(runsCache_);
        return;
      }
      var runsRpc = App.fetchPayrollRunsList
        ? App.fetchPayrollRunsList(callServer)
        : callServer('apiListPayrollRuns');
      runsRpc.then(afterRuns_).catch(function (err) {
        var m = document.getElementById('att-mount');
        if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load payroll runs.') + '</div>';
      });
    }

    function findRunForPeriod_(runs, year, month, vertical) {
      var list = (runs || []).filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month;
      });
      var want = vertical ? String(vertical).trim().toUpperCase() : '';
      if (want) {
        var openMatch = list.filter(function (r) {
          return String(r.status || '').toUpperCase() !== 'LOCKED' && verticalFromRun_(r) === want;
        });
        if (openMatch.length) return openMatch[0];
        var anyMatch = list.filter(function (r) { return verticalFromRun_(r) === want; });
        if (anyMatch.length) return anyMatch[0];
      }
      var open = list.filter(function (r) {
        return String(r.status || '').toUpperCase() !== 'LOCKED';
      });
      if (open.length === 1) return open[0];
      if (!want && open.length) {
        var legacy = open.filter(function (r) { return !verticalFromRun_(r); });
        if (legacy.length) return legacy[0];
        return open[0];
      }
      return list[0] || null;
    }

    function activeRunId_(fallbackRunId) {
      return bulkState_.runId || fallbackRunId;
    }

    function resolveRunIdForVertical_(vertical, fallbackRunId) {
      var want = String(vertical || '').trim().toUpperCase();
      if (!want) return activeRunId_(fallbackRunId);
      var currentId = activeRunId_(fallbackRunId);
      var current = (runsCache_ || []).filter(function (r) { return r.payroll_run_id === currentId; })[0];
      if (current && (!verticalFromRun_(current) || verticalFromRun_(current) === want)) return currentId;
      var match = findRunForPeriod_(runsCache_, period_.year, period_.month, want);
      if (match) {
        bulkState_.runId = match.payroll_run_id;
        return match.payroll_run_id;
      }
      return currentId;
    }

    function reloadRunData_(run) {
      bulkState_.runId = run.payroll_run_id;
      if (verticalFromRun_(run)) bulkState_.vertical = verticalFromRun_(run);
      var mount = document.getElementById('att-mount');
      if (mount) mount.innerHTML = skeletonMount_(window.HrmsApp);
      return fetchAttendanceList_(run.payroll_run_id, { syncEmployees: true }).then(function (list) {
        paintMain_(run, list || []);
      });
    }

    function paintHolidaysBanner_(year, month, vertical) {
      var el = document.getElementById('att-holidays-banner');
      if (!el) return;
      el.textContent = 'Loading public holidays…';
      callServer('apiHolidayListForMonth', year, month, vertical || '')
        .then(function (data) {
          var list = data.holidays || [];
          if (!list.length) {
            el.innerHTML = 'No public holidays configured for this month. Download the <strong>year Excel template</strong> under Attendance → Holidays, fill dates, import, then re-download the register template to pre-fill <strong>H</strong>.';
            return;
          }
          el.innerHTML = '<strong>Public holidays (' + list.length + '):</strong> ' +
            list.map(function (h) {
              return esc_(h.holiday_date) + ' ' + esc_(h.name);
            }).join(' · ') + ' - register download pre-fills <strong>H</strong> on these days.';
        })
        .catch(function () {
          el.textContent = '';
        });
    }

    function filterListByVertical_(list, vertical) {
      if (!vertical) return list || [];
      var want = String(vertical).toUpperCase();
      return (list || []).filter(function (r) {
        return String(r.vertical_name || '').toUpperCase() === want;
      });
    }

    function groupByVertical_(list) {
      var groups = {};
      (list || []).forEach(function (r) {
        var v = String(r.vertical_name || 'OTHERS').toUpperCase();
        if (!groups[v]) groups[v] = [];
        groups[v].push(r);
      });
      return groups;
    }

    function refreshVerticalSections_(list) {
      var mount = document.getElementById('att-vertical-sections');
      if (!mount) return;
      var vertical = selectedVertical_();
      mount.innerHTML = renderVerticalSections_(filterListByVertical_(list, vertical));
    }

    function renderVerticalSections_(list) {
      var groups = groupByVertical_(list);
      var codes = ['P', 'W/H', 'A', 'L', 'WO', 'ML', 'H'];
      var verticals = Object.keys(groups).sort();
      if (!verticals.length) return '<p class="hint">No employees in this payroll run yet.</p>';
      return verticals.map(function (v, idx) {
        var rows = groups[v];
        var openAttr = idx === 0 ? ' open' : '';
        var body = rows.map(function (r) {
          var cc = r.code_counts || (r.summary && r.summary.code_counts) || {};
          var codeCells = codes.map(function (c) {
            var val;
            if (c === 'P') {
              val = r.days_present != null ? r.days_present : (r.summary && r.summary.present != null ? r.summary.present : 0);
            } else if (c === 'L') {
              val = r.summary && r.summary.leave_days_l_column != null ? r.summary.leave_days_l_column
                : (r.days_leave != null ? r.days_leave - (Number(cc.ML) || 0) : (Number(cc.L) || 0));
            } else if (c === 'A') {
              val = r.summary && r.summary.absent_a_column != null ? r.summary.absent_a_column
                : (cc.A != null ? cc.A : 0);
            } else if (c === 'ML') {
              val = r.summary && r.summary.medical_leave_l_column != null ? r.summary.medical_leave_l_column
                : (cc.ML != null ? cc.ML : 0);
            } else {
              val = cc[c] != null ? cc[c] : 0;
            }
            return '<td class="num">' + esc_(val) + '</td>';
          }).join('');
          var complete = r.register_complete ? 'Yes' : 'No';
          return '<tr><td class="mono">' + esc_(r.employee_id) + '</td><td>' + esc_(r.display_name) + '</td>' +
            codeCells +
            '<td class="num">' + esc_(r.days_total != null ? r.days_total : (r.summary && r.summary.days_total)) + '</td>' +
            '<td>' + esc_(complete) + '</td></tr>';
        }).join('');
        var headCodes = codes.map(function (c) { return '<th class="num">' + esc_(c) + '</th>'; }).join('');
        return '<details class="card att-vertical-section"' + openAttr + '><summary><strong>' + esc_(v) +
          '</strong> <span class="hint">(' + rows.length + ')</span></summary>' +
          '<div class="table-wrap table-wrap--scroll-hint"><table class="data-table"><thead><tr><th>ID</th><th>Name</th>' + headCodes +
          '<th class="num">DAYS</th><th>Complete</th></tr></thead><tbody>' + body + '</tbody></table></div></details>';
      }).join('');
    }

    function paintNoRun_() {
      var m = document.getElementById('att-mount');
      if (!m) return;
      m.innerHTML =
        '<div class="card"><h2>' + esc_(fmtPeriod_(period_.year, period_.month)) + '</h2>' +
        '<p class="page-lede">No payroll run for this month and vertical. Payroll runs are shared for all HR/Admin users on the same HRMS sheet - pick the correct year/month, or start payroll if none exists yet.</p>' +
        '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Year</label><input class="form-input" id="att-year" type="number" value="' + period_.year + '"></div>' +
        '<div class="form-group"><label class="form-label">Month</label><input class="form-input" id="att-month" type="number" min="1" max="12" value="' + period_.month + '"></div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="att-start-run">Start payroll for this month</button></div>';
      document.getElementById('att-year').addEventListener('change', function () { period_.year = Number(this.value); });
      document.getElementById('att-month').addEventListener('change', function () { period_.month = Number(this.value); });
      document.getElementById('att-start-run').addEventListener('click', function () {
        var btn = this;
        callServer('apiCreatePayrollRunsAllVerticals', period_.year, period_.month, '', { button: btn, loadingText: 'Starting…' })
          .then(function () {
            if (App.invalidatePayrollRunsListCache) App.invalidatePayrollRunsListCache();
            showToast('Payroll started.', 'success');
            loadContext_();
          })
          .catch(function (err) { showToast(err.message || 'Failed', 'error'); });
      });
      if (App.markModuleViewLoaded) App.markModuleViewLoaded('attendance-bulk-upload');
    }

    function paintMain_(run, list) {
      var m = document.getElementById('att-mount');
      if (!m) return;
      var st = String(run.status || '').toUpperCase();
      var canEdit = st === 'DRAFT' || st === 'CALCULATED';
      var runVert = verticalFromRun_(run);
      if (runVert) bulkState_.vertical = runVert;
      var defaultVertical = runVert || bulkState_.vertical || (catalog_.length ? catalog_[0].vertical_name : '');

      m.innerHTML =
        '<div class="card bulk-upload-card"><div class="form-row" style="margin-bottom:12px">' +
        '<div class="form-group"><label class="form-label">Period</label><strong>' + esc_(fmtPeriod_(run.period_year, run.period_month)) +
        '</strong> <span class="hint">(' + esc_(run.payroll_run_id) + ' · ' + esc_(st) +
        (runVert ? ' · ' + esc_(runVert) : '') + ')</span></div>' +
        '<div class="form-group"><label class="form-label" for="att-vertical">Vertical</label>' +
        '<select class="form-select" id="att-vertical" ' + (canEdit ? '' : 'disabled') + '>' + verticalOptionsHtml_(defaultVertical) + '</select></div>' +
        '</div>' + paintRunPickerHtml_(run) +
        (canEdit ? '<ol class="bulk-steps"><li>Select vertical and download register template</li>' +
          '<li>Fill day columns on the Attendance sheet (from row 3)</li>' +
          '<li>Choose Excel file, <strong>Validate upload</strong>, then confirm import</li></ol>' : '') +
        '<div class="att-list-head bulk-action-bar">' +
        (canEdit ? '<button type="button" class="btn btn-secondary" id="att-dl-template">Download register template</button>' +
          '<button type="button" class="btn btn-secondary" id="att-choose-file">Choose Excel file</button>' +
          '<input type="file" id="att-file" class="hidden-file" tabindex="-1" aria-hidden="true" accept=".xlsx,.xls">' +
          '<button type="button" class="btn btn-primary" id="att-validate-upload" disabled>Validate upload</button>' +
          '<button type="button" class="btn btn-secondary" id="att-commit" disabled>Upload attendance</button>' : '') +
        '<button type="button" class="btn btn-secondary" id="att-goto-payroll">Continue to Payroll</button>' +
        '<button type="button" class="btn btn-secondary" id="att-goto-formt">Form T</button></div>' +
        (canEdit ? '<p id="att-file-name" class="form-hint">' + esc_(bulkState_.fileName || 'No file selected.') + '</p>' : '') +
        '<p class="att-codes-hint">Codes: <strong>P</strong> present · <strong>W/H</strong> Work from Home · ' +
        '<strong>L</strong> paid leave (L + ½ from 1/2P, capped by monthly pool) · <strong>A</strong> LOP (marked A + leave over pool) · ' +
        '<strong>1/2P</strong> = 0.5 P + 0.5 toward L or A once pool is used · <strong>WO</strong> weekly off · ' +
        '<strong>ML</strong> Maternity Leave (legacy S on import) · <strong>H</strong> holiday</p>' +
        '<div id="att-holidays-banner" class="hint" style="margin:8px 0"></div>' +
        '<p class="hint">Payroll run, vertical, and template must all match (e.g. PR-2026-10-AOPL with AOPL). ' +
        '<button type="button" class="btn btn-link" id="att-goto-holidays">Manage holiday calendar</button></p>' +
        '<div id="att-vertical-sections">' + renderVerticalSections_(filterListByVertical_(list, defaultVertical)) + '</div>' +
        '</div>' +
        '<div id="att-preview"></div><div id="att-feedback" class="action-feedback hidden"></div>';

      document.getElementById('att-goto-payroll').addEventListener('click', function () {
        navigate('payroll', { year: run.period_year, month: run.period_month, runId: run.payroll_run_id });
      });
      document.getElementById('att-goto-formt').addEventListener('click', function () {
        navigate('attendance-form-t', { year: run.period_year, month: run.period_month, runId: run.payroll_run_id });
      });
      var gotoHol = document.getElementById('att-goto-holidays');
      if (gotoHol) {
        gotoHol.addEventListener('click', function () { navigate('holiday-calendar'); });
      }
      paintHolidaysBanner_(run.period_year, run.period_month, defaultVertical);

      if (canEdit) bindBulk_(run.payroll_run_id);

      if (canEdit) {
        syncBulkActionButtons_();
        if (bulkState_.preview) {
          paintPreview_(bulkState_.preview, run.payroll_run_id, false);
        }
      }

      syncBulkViewCache_(run, list);
      if (App.markModuleViewLoaded) App.markModuleViewLoaded(MODULE_KEY_);
    }

    function selectedVertical_() {
      var sel = document.getElementById('att-vertical');
      return sel ? sel.value : '';
    }

    function syncBulkViewCache_(run, list) {
      viewCache_ = {
        periodKey: periodKey_(),
        run: run,
        list: list,
        catalog: (catalog_ || []).slice(),
        bulkState: {
          vertical: bulkState_.vertical || selectedVertical_(),
          fileMeta: bulkState_.fileMeta,
          fileName: bulkState_.fileName || '',
          uploadId: bulkState_.uploadId,
          preview: bulkState_.preview
        }
      };
    }

    function clearStagedUpload_() {
      bulkState_.uploadId = null;
      bulkState_.preview = null;
      var prev = document.getElementById('att-preview');
      if (prev) prev.innerHTML = '';
      syncBulkActionButtons_();
    }

    function syncBulkActionButtons_() {
      var validateBtn = document.getElementById('att-validate-upload');
      var commitBtn = document.getElementById('att-commit');
      var hasFile = !!(bulkState_.fileMeta && selectedVertical_());
      var ready = bulkState_.preview && Number(bulkState_.preview.readyCount) > 0 && bulkState_.uploadId;
      if (validateBtn) validateBtn.disabled = !hasFile;
      if (commitBtn) commitBtn.disabled = !ready;
    }

    function downloadBlob_(file) {
      if (!file || !file.base64) return;
      var binary = atob(file.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.fileName || 'HRMS_Attendance_Register.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function bindBulk_(runId) {
      var fileInput = document.getElementById('att-file');
      var validateBtn = document.getElementById('att-validate-upload');
      var commitBtn = document.getElementById('att-commit');
      var nameEl = document.getElementById('att-file-name');
      var verticalSel = document.getElementById('att-vertical');
      var runPicker = document.getElementById('att-run-picker');
      if (runPicker) {
        runPicker.addEventListener('change', function () {
          bulkState_.runId = runPicker.value;
          var picked = (runsCache_ || []).filter(function (r) { return r.payroll_run_id === bulkState_.runId; })[0];
          if (!picked) return;
          if (App.persistPayrollPeriodContext) {
            App.persistPayrollPeriodContext({
              year: picked.period_year,
              month: picked.period_month,
              runId: picked.payroll_run_id,
              vertical: verticalFromRun_(picked) || bulkState_.vertical
            });
          }
          clearStagedUpload_();
          reloadRunData_(picked).catch(function (err) {
            showToast((err && err.message) || 'Failed to switch payroll run', 'error');
          });
        });
      }

      if (verticalSel) {
        verticalSel.addEventListener('change', function () {
          bulkState_.vertical = verticalSel.value;
          clearStagedUpload_();
          var newRun = findRunForPeriod_(runsCache_, period_.year, period_.month, bulkState_.vertical);
          if (!newRun) {
            showToast('No payroll run for ' + bulkState_.vertical + ' in ' + fmtPeriod_(period_.year, period_.month) +
              '. Start that vertical from Payroll first.', 'error');
            var cur = (runsCache_ || []).filter(function (r) { return r.payroll_run_id === bulkState_.runId; })[0];
            var rv = verticalFromRun_(cur);
            if (verticalSel && rv) {
              verticalSel.value = rv;
              bulkState_.vertical = rv;
            }
            return;
          }
          var runV = verticalFromRun_(newRun);
          if (runV && runV !== String(bulkState_.vertical || '').trim().toUpperCase()) {
            showToast('Payroll run vertical does not match selection.', 'error');
            return;
          }
          if (newRun.payroll_run_id !== bulkState_.runId) {
            reloadRunData_(newRun).catch(function (err) {
              showToast((err && err.message) || 'Failed to switch payroll run', 'error');
            });
            return;
          }
          if (viewCache_ && viewCache_.list) refreshVerticalSections_(viewCache_.list);
          if (viewCache_ && viewCache_.run) {
            syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
            paintHolidaysBanner_(viewCache_.run.period_year, viewCache_.run.period_month, verticalSel.value);
          }
          syncBulkActionButtons_();
        });
        if (!bulkState_.vertical) bulkState_.vertical = verticalSel.value;
      }

      document.getElementById('att-dl-template').addEventListener('click', function () {
        var vertical = selectedVertical_();
        if (!vertical) {
          showToast('Select a vertical first.', 'error');
          return;
        }
        var activeRunId = resolveRunIdForVertical_(vertical, runId);
        var btn = this;
        callServer('apiDownloadAttendanceRegisterTemplate', activeRunId, vertical, { button: btn, loadingText: 'Downloading…' })
          .then(function (res) {
            if (!res || !res.base64) {
              showToast('Template download returned no file. Run clasp push and redeploy the web app.', 'error');
              return;
            }
            downloadBlob_(res);
            var n = res.employeeCount != null ? res.employeeCount : '';
            var extra = n !== '' ? ' - ' + n + ' employee' + (n === 1 ? '' : 's') : '';
            showToast('Register template downloaded' + extra + '.', 'success');
          })
          .catch(function (err) {
            showToast((err && err.message) || 'Download failed', 'error');
          });
      });

      var chooseBtn = document.getElementById('att-choose-file');
      if (chooseBtn && fileInput) {
        chooseBtn.addEventListener('click', function () {
          if (!selectedVertical_()) {
            showToast('Select a vertical first.', 'error');
            return;
          }
          fileInput.click();
        });
      }

      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        bulkState_.fileMeta = null;
        bulkState_.fileName = '';
        clearStagedUpload_();
        if (!f) {
          if (nameEl) nameEl.textContent = 'No file selected.';
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          syncBulkActionButtons_();
          return;
        }
        if (nameEl) nameEl.textContent = f.name;
        bulkState_.fileName = f.name;
        var reader = new FileReader();
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          var binary = '';
          for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          bulkState_.fileMeta = { fileName: f.name, mimeType: f.type, base64: btoa(binary) };
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          syncBulkActionButtons_();
        };
        reader.readAsArrayBuffer(f);
      });

      if (validateBtn) {
        validateBtn.addEventListener('click', function () {
          var vertical = selectedVertical_();
          if (!vertical || !bulkState_.fileMeta) return;
          var validateRunId = resolveRunIdForVertical_(vertical, runId);
          callServer('apiValidateAttendanceRegisterUpload', validateRunId, vertical, bulkState_.fileMeta,
            { button: validateBtn, loadingText: 'Validating…' })
            .then(function (preview) {
              bulkState_.uploadId = preview.uploadId;
              bulkState_.preview = preview;
              bulkState_.vertical = vertical;
              paintPreview_(preview, validateRunId, false);
              syncBulkActionButtons_();
              if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
              if (preview.readyCount > 0) {
                showToast(preview.readyCount + ' employee(s) ready to import' +
                  (preview.errorCount > 0 ? (' · ' + preview.errorCount + ' need attention') : '') + '.', 'success');
              } else {
                showToast(preview.errorCount ? 'No valid rows to import. See details below.' : 'Nothing to import.', 'error');
              }
            })
            .catch(function (err) { showToast(err.message || 'Validation failed', 'error'); });
        });
      }

      if (commitBtn) {
        commitBtn.addEventListener('click', function () {
          if (!bulkState_.preview || !bulkState_.uploadId || !bulkState_.preview.readyCount) return;
          var preview = bulkState_.preview;
          var commitRunId = resolveRunIdForVertical_(selectedVertical_(), runId);
          callServer('apiCommitAttendanceRegisterUpload', commitRunId, bulkState_.uploadId,
            { button: commitBtn, loadingText: 'Importing…' })
            .then(function () {
              bulkState_.uploadId = null;
              bulkState_.preview = null;
              bulkState_.fileMeta = null;
              bulkState_.fileName = '';
              if (fileInput) fileInput.value = '';
              if (nameEl) nameEl.textContent = 'No file selected.';
              if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
              clearStagedUpload_();
              invalidateListCache_(commitRunId);
              showToast('Attendance imported (' + preview.readyCount + '). Re-upload overwrites existing days.', 'success');
              if (preview.errorCount > 0) {
                showToast(preview.errorCount + ' row(s) skipped - fix the file and validate again.', 'warning');
              }
              loadContext_();
            })
            .catch(function (err) { showToast(err.message || 'Import failed', 'error'); });
        });
      }

    }

    function paintPreviewGrid_(validRows, dim) {
      if (!validRows || !validRows.length) return '';
      var codes = ['P', 'W/H', 'A', 'L', 'WO', 'ML', 'H'];
      var head = '<tr><th>ID</th><th>Name</th><th class="num">Grant</th><th class="num">Used</th><th class="num">Avail</th>';
      for (var d = 1; d <= dim; d++) {
        var key = (d < 10 ? '0' : '') + d;
        head += '<th>' + key + '</th>';
      }
      codes.forEach(function (c) { head += '<th>' + c + '</th>'; });
      head += '<th>DAYS</th></tr>';
      var body = validRows.map(function (row) {
        var reg = row.register || {};
        var cc = row.code_counts || {};
        var line = '<tr><td class="mono">' + esc_(row.employee_id) + '</td><td>' + esc_(row.display_name) + '</td>' +
          '<td class="num">' + esc_(row.monthly_grant != null ? row.monthly_grant : '') + '</td>' +
          '<td class="num">' + esc_(row.leave_used != null ? row.leave_used : row.days_leave) + '</td>' +
          '<td class="num">' + esc_(row.leave_balance != null ? row.leave_balance : '') + '</td>';
        for (var day = 1; day <= dim; day++) {
          var k = (day < 10 ? '0' : '') + day;
          line += '<td>' + esc_(reg[k] || '') + '</td>';
        }
        codes.forEach(function (c) {
          var val;
          if (c === 'P' && row.days_present != null) val = row.days_present;
          else if (c === 'L' && row.leave_days_l_column != null) val = row.leave_days_l_column;
          else if (c === 'L' && row.days_leave != null) val = row.days_leave - (Number(cc.ML) || 0);
          else if (c === 'A' && row.absent_a_column != null) val = row.absent_a_column;
          else if (c === 'ML' && row.medical_leave_l_column != null) val = row.medical_leave_l_column;
          else val = cc[c] != null ? cc[c] : 0;
          line += '<td class="num">' + esc_(val) + '</td>';
        });
        line += '<td class="num">' + esc_(row.days_total != null ? row.days_total : '') + '</td></tr>';
        return line;
      }).join('');
      return '<table class="data-table att-preview-grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
    }

    function paintPreview_(preview, runId, errorsOnly) {
      var el = document.getElementById('att-preview');
      if (!el || !preview) return;
      var ready = Number(preview.readyCount || preview.validCount || 0);
      var errN = Number(preview.errorCount || 0);
      var total = Number(preview.totalRows || preview.employeesFound || 0);
      var html = '<div class="card upload-preview"><h3>Validation result</h3>' +
        '<p><strong>' + esc_(total) + '</strong> row(s) in file · ' +
        '<strong>' + esc_(ready) + '</strong> ready to import · ' +
        '<strong>' + esc_(errN) + '</strong> need attention</p>';
      if (ready > 0 && !errorsOnly) {
        html += '<p class="hint">Click <strong>Upload attendance</strong> to import validated rows. Re-import overwrites daily codes for those employees.</p>';
      }
      if (ready > 0 && preview.valid && preview.valid.length && !errorsOnly) {
        var y = period_.year;
        var m = period_.month;
        if (viewCache_ && viewCache_.run) {
          y = Number(viewCache_.run.period_year) || y;
          m = Number(viewCache_.run.period_month) || m;
        }
        var dim = daysInMonth_(y, m);
        html += '<h4 class="section-title" style="margin-top:16px">Validated attendance (' + esc_(ready) + ')</h4>' +
          '<p class="hint">Daily codes and monthly leave (grant / used / available) from this file.</p>' +
          paintPreviewGrid_(preview.valid, dim);
      }
      if (preview.errors && preview.errors.length) {
        html += '<div class="' + (errN ? 'alert alert-warning' : '') + '" style="margin-top:12px">' +
          '<strong>Rows needing attention</strong><ul class="hint" style="margin:8px 0 0">';
        preview.errors.slice(0, 20).forEach(function (err) {
          var msgs = (err.messages || []).map(function (m) { return m.message || m; }).join('; ');
          html += '<li>Row ' + esc_(err.rowNumber) + (err.employee_id ? ' · ' + esc_(err.employee_id) : '') +
            (msgs ? ': ' + esc_(msgs) : '') + '</li>';
        });
        if (preview.errors.length > 20) html += '<li>…and ' + (preview.errors.length - 20) + ' more</li>';
        html += '</ul></div>';
      }
      if (ready > 0) {
        html += '<div class="primary-next" style="margin-top:12px">' +
          '<button type="button" class="btn btn-secondary" id="att-cancel-staged">Clear validation</button></div>';
      } else if (errN) {
        html += '<div class="primary-next" style="margin-top:12px">' +
          '<button type="button" class="btn btn-secondary" id="att-cancel-staged">Dismiss</button></div>';
      }
      html += '</div>';
      el.innerHTML = html;
      var cancelBtn = document.getElementById('att-cancel-staged');
      if (cancelBtn) {
        cancelBtn.onclick = function () {
          clearStagedUpload_();
          if (viewCache_ && viewCache_.run) syncBulkViewCache_(viewCache_.run, viewCache_.list || []);
          showToast('Validation cleared. Choose a file and validate again.', 'info');
        };
      }
      syncBulkActionButtons_();
    }

    function daysInMonth_(y, m) {
      return new Date(y, m, 0).getDate();
    }

    if (App.registerModuleDataCacheClear) {
      App.registerModuleDataCacheClear(function () {
        listCacheByRun_ = {};
        viewCache_ = null;
      });
    }

    App.registerRoute('attendance-bulk-upload', { title: 'Register', render: render_ });
  });
})();
</script>
