<style>
.att-page .att-list-head { display: flex; justify-content: flex-end; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
.att-page .data-table { width: 100%; }
.att-page .att-day-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-top: 12px; }
.att-page .att-day-cell label { font-size: 11px; color: var(--color-text-muted); display: block; }
.att-page .att-day-cell input { width: 100%; text-align: center; text-transform: uppercase; }
.att-page .att-codes-hint { font-size: 13px; color: var(--color-text-muted); margin: 8px 0; }
.att-page .hidden-file { display: none !important; }
</style>
<script>
(function () {
  'use strict';

  var initialized_ = false;
  var bulkState_ = { uploadId: null, preview: null, runId: null };
  var period_ = { year: new Date().getFullYear(), month: new Date().getMonth() + 1 };

  function whenAppReady(fn) {
    function run() {
      var App = window.HrmsApp;
      if (!App || !App.registerRoute || !App.callServer) return false;
      fn(App);
      return true;
    }
    if (run()) return;
    var tries = 0;
    var timer = setInterval(function () {
      if (run() || ++tries > 200) clearInterval(timer);
    }, 25);
  }

  whenAppReady(function initAttendanceUi(App) {
    if (initialized_) return;
    initialized_ = true;

    var callServer = App.callServer;
    var escapeHtml = App.escapeHtml;
    var showToast = App.showToast;
    var navigate = App.navigate;

    function esc_(v) {
      return escapeHtml(v == null ? '' : String(v));
    }

    function pageEl_() {
      var p = document.getElementById('page-content');
      if (p) p.classList.remove('hidden');
      return p;
    }

    function fmtPeriod_(y, m) {
      var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return (names[m - 1] || m) + ' ' + y;
    }

    function render_(params) {
      params = params || {};
      if (params.year) period_.year = Number(params.year);
      if (params.month) period_.month = Number(params.month);
      var page = pageEl_();
      if (!page) return;
      page.innerHTML =
        '<div class="att-page"><div class="page-header"><h2>Attendance</h2>' +
        '<p class="page-lede">Monthly register: one code per day (P, W/H, A, L, H, S). Bulk Excel matches the statutory grid layout. ' +
        'The roster refreshes from HRMS when you open this page or download the template—no redeploy needed.</p></div>' +
        '<div id="att-mount"><div class="hrms-loading-block" aria-busy="true">Loading…</div></div></div>';
      loadContext_();
    }

    function loadContext_() {
      callServer('apiListPayrollRuns').then(function (runs) {
        var run = findRunForPeriod_(runs || [], period_.year, period_.month);
        if (!run) {
          paintNoRun_();
          return;
        }
        bulkState_.runId = run.payroll_run_id;
        Promise.all([
          callServer('apiListAttendanceRegister', run.payroll_run_id),
          callServer('apiGetPayrollRun', run.payroll_run_id)
        ]).then(function (res) {
          paintMain_(run, res[0] || [], res[1] || {});
        }).catch(function (err) {
          var m = document.getElementById('att-mount');
          if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load attendance.') + '</div>';
        });
      }).catch(function (err) {
        var m = document.getElementById('att-mount');
        if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_(err.message || 'Failed to load payroll runs.') + '</div>';
      });
    }

    function findRunForPeriod_(runs, year, month) {
      var open = runs.filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month &&
          String(r.status || '').toUpperCase() !== 'LOCKED';
      });
      if (open.length) return open[0];
      return runs.filter(function (r) {
        return Number(r.period_year) === year && Number(r.period_month) === month;
      })[0] || null;
    }

    function paintNoRun_() {
      var m = document.getElementById('att-mount');
      if (!m) return;
      m.innerHTML =
        '<div class="card"><h2>' + esc_(fmtPeriod_(period_.year, period_.month)) + '</h2>' +
        '<p class="page-lede">Start payroll for this month first, then upload or enter attendance.</p>' +
        '<div class="form-row">' +
        '<div class="form-group"><label class="form-label">Year</label><input class="form-input" id="att-year" type="number" value="' + period_.year + '"></div>' +
        '<div class="form-group"><label class="form-label">Month</label><input class="form-input" id="att-month" type="number" min="1" max="12" value="' + period_.month + '"></div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="att-start-run">Start payroll for this month</button></div>';
      document.getElementById('att-year').addEventListener('change', function () { period_.year = Number(this.value); });
      document.getElementById('att-month').addEventListener('change', function () { period_.month = Number(this.value); });
      document.getElementById('att-start-run').addEventListener('click', function () {
        var btn = this;
        callServer('apiCreatePayrollRun', period_.year, period_.month, '', { button: btn, loadingText: 'Starting…' })
          .then(function () {
            showToast('Payroll started.', 'success');
            loadContext_();
          })
          .catch(function (err) { showToast(err.message || 'Failed', 'error'); });
      });
      if (App.markModuleViewLoaded) App.markModuleViewLoaded('attendance-bulk-upload');
    }

    function paintMain_(run, list, detail) {
      var m = document.getElementById('att-mount');
      if (!m) return;
      var st = String(run.status || '').toUpperCase();
      var canEdit = st === 'DRAFT' || st === 'CALCULATED';
      var rows = (list || []).map(function (r) {
        var complete = r.register_complete ? 'Yes' : 'No';
        return '<tr><td class="mono">' + esc_(r.employee_id) + '</td><td>' + esc_(r.vertical_name) + '</td><td>' +
          esc_(r.display_name) + '</td><td class="num">' + esc_(r.days_present) + '</td><td class="num">' +
          esc_(r.days_leave) + '</td><td>' + esc_(complete) + '</td><td class="col-actions">' +
          (canEdit && r.in_payroll_run ? '<button type="button" class="btn btn-secondary btn-sm" data-att-edit="' + esc_(r.employee_id) + '">Edit days</button>' :
            (!r.in_payroll_run ? '<span class="hint">Not in payroll month</span>' : '')) +
          '</td></tr>';
      }).join('');

      m.innerHTML =
        '<div class="card bulk-upload-card"><div class="form-row" style="margin-bottom:12px">' +
        '<div class="form-group"><label class="form-label">Period</label><strong>' + esc_(fmtPeriod_(run.period_year, run.period_month)) +
        '</strong> <span class="hint">(' + esc_(run.payroll_run_id) + ' · ' + esc_(st) + ')</span></div></div>' +
        '<div class="att-list-head bulk-action-bar">' +
        (canEdit ? '<button type="button" class="btn btn-secondary" id="att-dl-template">Download register template</button>' +
          '<button type="button" class="btn btn-secondary" id="att-choose-file">Choose Excel file</button>' +
          '<input type="file" id="att-file" class="hidden-file" tabindex="-1" aria-hidden="true" accept=".xlsx,.xls">' +
          '<button type="button" class="btn btn-primary" id="att-validate" disabled>Validate upload</button>' : '') +
        '<button type="button" class="btn btn-secondary" id="att-goto-payroll">Continue to Payroll</button></div>' +
        (canEdit ? '<p id="att-file-name" class="form-hint">No file selected.</p>' : '') +
        '<p class="att-codes-hint">Codes: <strong>P</strong> present · <strong>W/H</strong> week-off/holiday · <strong>A</strong> absent · <strong>L</strong> leave · <strong>H</strong> holiday · <strong>S</strong> sick</p>' +
        (rows
          ? '<table class="data-table"><thead><tr><th>Employee ID</th><th>Vertical</th><th>Name</th><th class="num">Days present</th><th class="num">Days leave</th><th>Complete</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
          : '<p class="hint">No employees in this payroll run yet.</p>') +
        '</div>' +
        '<div id="att-preview"></div><div id="att-feedback" class="action-feedback hidden"></div>';

      document.getElementById('att-goto-payroll').addEventListener('click', function () {
        navigate('payroll', { year: run.period_year, month: run.period_month, runId: run.payroll_run_id });
      });

      if (canEdit) {
        bindBulk_(run.payroll_run_id);
        m.querySelectorAll('[data-att-edit]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openEditor_(run, btn.getAttribute('data-att-edit'), list);
          });
        });
      }

      if (App.markModuleViewLoaded) App.markModuleViewLoaded('attendance-bulk-upload');
    }

    function downloadBlob_(file) {
      if (!file || !file.base64) return;
      var binary = atob(file.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.fileName || 'HRMS_Attendance_Register.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    }

    function bindBulk_(runId) {
      var fileInput = document.getElementById('att-file');
      var validateBtn = document.getElementById('att-validate');
      var nameEl = document.getElementById('att-file-name');
      var fileMeta = null;

      document.getElementById('att-dl-template').addEventListener('click', function () {
        var btn = this;
        callServer('apiDownloadAttendanceRegisterTemplate', runId, { button: btn, loadingText: 'Downloading…' })
          .then(function (res) {
            if (!res || !res.base64) {
              showToast('Template download returned no file. Run clasp push and redeploy the web app.', 'error');
              return;
            }
            downloadBlob_(res);
            var n = res.employeeCount != null ? res.employeeCount : '';
            var extra = n !== '' ? ' — ' + n + ' active employee' + (n === 1 ? '' : 's') : '';
            showToast('Attendance template downloaded' + extra + '.', 'success');
          })
          .catch(function (err) {
            showToast((err && err.message) || 'Download failed', 'error');
          });
      });

      var chooseBtn = document.getElementById('att-choose-file');
      if (chooseBtn && fileInput) {
        chooseBtn.addEventListener('click', function () { fileInput.click(); });
      }

      fileInput.addEventListener('change', function () {
        var f = fileInput.files && fileInput.files[0];
        fileMeta = null;
        if (!f) {
          if (validateBtn) validateBtn.disabled = true;
          if (nameEl) nameEl.textContent = 'No file selected.';
          return;
        }
        if (nameEl) nameEl.textContent = f.name;
        var reader = new FileReader();
        reader.onload = function () {
          var bytes = new Uint8Array(reader.result);
          var binary = '';
          for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          fileMeta = { fileName: f.name, mimeType: f.type, base64: btoa(binary) };
          if (validateBtn) validateBtn.disabled = false;
        };
        reader.readAsArrayBuffer(f);
      });

      validateBtn.addEventListener('click', function () {
        if (!fileMeta) return;
        callServer('apiValidateAttendanceRegisterUpload', runId, fileMeta, { button: validateBtn, loadingText: 'Validating…' })
          .then(function (preview) {
            bulkState_.uploadId = preview.uploadId;
            bulkState_.preview = preview;
            paintPreview_(preview, runId);
          })
          .catch(function (err) { showToast(err.message || 'Validation failed', 'error'); });
      });
    }

    function paintPreview_(preview, runId) {
      var el = document.getElementById('att-preview');
      if (!el) return;
      var html = '<div class="card upload-preview"><h3>Upload preview</h3><p><strong>' + preview.readyCount +
        '</strong> ready · <strong>' + preview.attentionCount + '</strong> need attention</p>';
      if (preview.readyCount > 0) {
        html += '<button type="button" class="btn btn-primary" id="att-commit">Confirm import (' + preview.readyCount + ')</button>';
      }
      html += '</div>';
      el.innerHTML = html;
      var commit = document.getElementById('att-commit');
      if (commit) {
        commit.addEventListener('click', function () {
          callServer('apiCommitAttendanceRegisterUpload', runId, bulkState_.uploadId, { button: commit, loadingText: 'Importing…' })
            .then(function () {
              showToast('Attendance imported.', 'success');
              bulkState_.uploadId = null;
              loadContext_();
            })
            .catch(function (err) { showToast(err.message || 'Import failed', 'error'); });
        });
      }
    }

    function daysInMonth_(y, m) {
      return new Date(y, m, 0).getDate();
    }

    function openEditor_(run, employeeId, list) {
      var row = (list || []).find(function (r) { return r.employee_id === employeeId; });
      var dim = daysInMonth_(Number(run.period_year), Number(run.period_month));
      var backdrop = document.createElement('div');
      backdrop.className = 'modal-backdrop';
      var cells = '';
      for (var d = 1; d <= dim; d++) {
        var key = (d < 10 ? '0' : '') + d;
        cells += '<div class="att-day-cell"><label>' + key + '</label><input class="form-input att-day-code" data-day="' + key + '" maxlength="3"></div>';
      }
      backdrop.innerHTML =
        '<div class="modal" style="max-width:720px"><div class="modal-header"><h3 class="modal-title">' +
        esc_(row ? row.display_name : employeeId) + '</h3><p class="modal-desc">Enter one code per day for ' +
        esc_(fmtPeriod_(run.period_year, run.period_month)) + '</p></div>' +
        '<div class="att-day-grid">' + cells + '</div>' +
        '<div class="modal-actions"><button type="button" class="btn btn-secondary" id="att-ed-cancel">Cancel</button>' +
        '<button type="button" class="btn btn-primary" id="att-ed-save">Save</button></div></div>';
      document.body.appendChild(backdrop);

      callServer('apiGetPayrollRun', run.payroll_run_id).then(function (detail) {
        var inp = null;
        (detail.rows || []).forEach(function (r) {
          if (r.employee && r.employee.employee_id === employeeId) inp = r.input;
        });
        var reg = {};
        if (inp && inp.daily_attendance_json) {
          try { reg = JSON.parse(inp.daily_attendance_json); } catch (ignore) {}
        }
        backdrop.querySelectorAll('.att-day-code').forEach(function (el) {
          var day = el.getAttribute('data-day');
          if (reg[day]) el.value = reg[day];
        });
      }).catch(function () {});

      backdrop.querySelector('#att-ed-cancel').addEventListener('click', function () { backdrop.remove(); });
      backdrop.querySelector('#att-ed-save').addEventListener('click', function () {
        var register = {};
        backdrop.querySelectorAll('.att-day-code').forEach(function (el) {
          var day = el.getAttribute('data-day');
          var v = el.value.trim();
          if (v) register[day] = v;
        });
        var saveBtn = backdrop.querySelector('#att-ed-save');
        callServer('apiSaveAttendanceRegister', run.payroll_run_id, employeeId, register,
          { button: saveBtn, loadingText: 'Saving…' })
          .then(function () {
            backdrop.remove();
            showToast('Attendance saved.', 'success');
            loadContext_();
          })
          .catch(function (err) { showToast(err.message || 'Save failed', 'error'); });
      });
    }

    App.registerRoute('attendance-bulk-upload', { title: 'Attendance', render: render_ });
  });
})();
</script>
