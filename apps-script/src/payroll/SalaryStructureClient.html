<style>
.sst-page .sst-list-head { display: flex; justify-content: flex-end; margin-bottom: 12px; }
.sst-page .data-table { width: 100%; }
.sst-page td.col-actions { white-space: nowrap; text-align: right; }
.sst-page .sst-status-active { color: var(--color-success); font-weight: 600; }
.sst-page .sst-status-inactive { color: var(--color-text-muted); }
.sst-page .sst-comp-value { max-width: 100px; }
.sst-page .sst-c-base { max-width: 130px; min-width: 90px; }
.sst-page .sst-c-cond { max-width: 90px; }
.sst-page .sst-section { margin-top: 20px; }
.sst-page .sst-section h3 { margin-bottom: 4px; }
.sst-page .sst-section .page-lede { margin-bottom: 8px; }
.sst-page .empty-state { color: var(--color-text-muted); padding: 12px 0; }
.sst-page .sst-rules-card { margin-top: 12px; padding: 12px; background: var(--color-surface-muted, #f6f7f9); border-radius: 6px; }
</style>
<script>
(function () {
  'use strict';

  var initialized_ = false;

  function whenAppReady(fn) {
    function run() {
      var App = window.HrmsApp;
      if (!App || !App.registerRoute || !App.callServer) return false;
      fn(App);
      return true;
    }
    if (run()) return;
    function wait() {
      if (run()) return;
      var tries = 0;
      var timer = setInterval(function () {
        if (run() || ++tries > 200) clearInterval(timer);
      }, 25);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', wait);
    } else {
      wait();
    }
  }

  whenAppReady(function initSalaryStructureUi(App) {
    if (initialized_) return;
    initialized_ = true;

    var callServer = App.callServer;
    var escapeHtml = App.escapeHtml;
    var showToast = App.showToast;

  var SECTION_RATE_ = 'RATE_OF_PAY';
  var SECTION_DED_ = 'DEDUCTION';
  var SECTION_MANUAL_ = 'MANUAL_DEDUCTION';

  var RATE_METHODS_ = [
    ['PERCENT', '% of base'],
    ['FIXED', 'Fixed amount'],
    ['BALANCE_OF_CTC', 'Remainder of CTC']
  ];
  var DED_METHODS_ = [
    ['PERCENT_CAPPED', '% with wage cap'],
    ['PERCENT_IF', '% if condition'],
    ['THRESHOLD_FEE', 'Fee above threshold'],
    ['PERCENT', '% of base'],
    ['FIXED', 'Fixed amount']
  ];
  var FORMULA_REFS_ = [
    ['CTC', 'Monthly CTC'],
    ['RATE_GROSS', 'Rate gross'],
    ['EARNED_GROSS', 'Earned gross']
  ];
  var COND_OPS_ = [['LT', '<'], ['LTE', '≤'], ['GT', '>'], ['GTE', '≥']];
  var ROUND_MODES_ = [['ROUND', 'Round'], ['ROUNDUP', 'Round up'], ['NONE', 'None']];

  function uiFromStoredRow_(c, section) {
    c = c || {};
    section = section || inferSection_(c);
    var m = String(c.calc_method || '').toUpperCase();
    if (section === SECTION_MANUAL_) return { method: 'MANUAL', base: '' };
    if (section === SECTION_DED_) {
      if (DED_METHODS_.some(function (x) { return x[0] === m; })) return { method: m, base: String(c.percent_base || c.cond_ref || '').toUpperCase() };
      return { method: 'PERCENT_CAPPED', base: 'BP' };
    }
    var base = String(c.percent_base || '').toUpperCase();
    if (m === 'PERCENT_OF_CTC') return { method: 'PERCENT', base: 'CTC' };
    if (m === 'PERCENT_OF_BASIC') return { method: 'PERCENT', base: base || 'BP' };
    if (m === 'PERCENT') return { method: 'PERCENT', base: base || 'CTC' };
    if (m === 'BALANCE_OF_CTC') return { method: 'BALANCE_OF_CTC', base: '' };
    return { method: 'FIXED', base: '' };
  }

  function inferSection_(c) {
    var sec = String(c.structure_section || '').toUpperCase();
    if (sec) return sec;
    var m = String(c.calc_method || '').toUpperCase();
    if (m === 'MANUAL') return SECTION_MANUAL_;
    var kind = String(c.component_kind || '').toUpperCase();
    if (kind === 'DEDUCTION' || kind === 'EMPLOYER') return SECTION_DED_;
    return SECTION_RATE_;
  }

  function splitComponents_(comps) {
    var rate = [];
    var ded = [];
    var manual = [];
    (comps || []).forEach(function (c) {
      var sec = inferSection_(c);
      if (sec === SECTION_MANUAL_) manual.push(c);
      else if (sec === SECTION_DED_) ded.push(c);
      else rate.push(c);
    });
    return { rate: rate, ded: ded, manual: manual };
  }

  function priorRateCodes_(allRate, index) {
    var prior = [];
    for (var j = 0; j < index; j++) {
      var cd = String((allRate[j] && allRate[j].component_code) || '').trim().toUpperCase();
      if (cd) prior.push(cd);
    }
    return prior;
  }

  function refOptionsHtml_(selected, priorCodes, includeFormulaRefs) {
    var sel = String(selected || 'CTC').toUpperCase();
    var html = '';
    if (includeFormulaRefs) {
      FORMULA_REFS_.forEach(function (r) {
        html += '<option value="' + r[0] + '"' + (sel === r[0] ? ' selected' : '') + '>' + esc_(r[1]) + '</option>';
      });
    } else {
      html += '<option value="CTC"' + (sel === 'CTC' ? ' selected' : '') + '>Monthly CTC</option>';
    }
    (priorCodes || []).forEach(function (code) {
      html += '<option value="' + esc_(code) + '"' + (sel === code ? ' selected' : '') + '>' + esc_(code) + '</option>';
    });
    return html;
  }

  function pageEl_() {
    var p = document.getElementById('page-content');
    if (p) p.classList.remove('hidden');
    return p;
  }

  function esc_(v) {
    return escapeHtml(v == null ? '' : String(v));
  }

  function spin_(label) {
    return App.sectionSkeleton
      ? App.sectionSkeleton({ label: label || 'Loading' })
      : '<div class="hrms-loading-block" aria-busy="true">' + esc_(label || 'Loading') + '…</div>';
  }

  function render_(params) {
    var page = pageEl_();
    if (!page) return;
    page.innerHTML =
      '<div class="sst-page"><div class="page-header"><h2>Salary structures</h2>' +
      '<p class="page-lede">Reusable payroll templates: monthly <strong>rate of pay</strong> from CTC, ' +
      '<strong>earned pay</strong> proration rules, statutory <strong>deduction formulas</strong>, and manual deduction lines.</p></div>' +
      '<div id="sst-mount">' + spin_('Loading salary structures\u2026') + '</div></div>';
    loadList_();
  }

  function loadList_() {
    var m = document.getElementById('sst-mount');
    var timedOut = false;
    var timer = setTimeout(function () {
      timedOut = true;
      if (!m) return;
      m.innerHTML =
        '<div class="alert alert-warning">Still loading salary structures. ' +
        '<button type="button" class="btn btn-secondary btn-sm" id="sst-retry">Retry</button></div>';
      var retry = document.getElementById('sst-retry');
      if (retry) retry.addEventListener('click', function () {
        if (m) m.innerHTML = spin_('Loading salary structures\u2026');
        loadList_();
      });
    }, 20000);
    try {
      callServer('apiListSalaryStructureTypes', true).then(function (list) {
        clearTimeout(timer);
        if (timedOut) return;
        paintList_(list || []);
      }).catch(function (err) {
        clearTimeout(timer);
        if (timedOut) return;
        if (m) {
          m.innerHTML = '<div class="alert alert-danger">' + esc_((err && err.message) || 'Failed to load salary structures.') +
            ' <button type="button" class="btn btn-secondary btn-sm" id="sst-retry-err">Retry</button></div>';
          var rb = document.getElementById('sst-retry-err');
          if (rb) rb.addEventListener('click', function () { loadList_(); });
        }
      });
    } catch (err) {
      clearTimeout(timer);
      if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_((err && err.message) || 'Failed to load salary structures.') + '</div>';
    }
  }

  function paintList_(list) {
    var m = document.getElementById('sst-mount');
    if (!m) return;
    var rows = list.map(function (s) {
      var active = String(s.status || 'ACTIVE').toUpperCase() !== 'INACTIVE';
      var statusHtml = active
        ? '<span class="sst-status-active">Active</span>'
        : '<span class="sst-status-inactive">Inactive</span>';
      return '<tr>' +
        '<td class="mono">' + esc_(s.salary_structure_id) + '</td>' +
        '<td>' + esc_(s.structure_name) + '</td>' +
        '<td>' + esc_(s.vertical_name) + '</td>' +
        '<td class="num">' + ((s.components || []).length) + '</td>' +
        '<td>' + statusHtml + '</td>' +
        '<td class="col-actions">' +
          '<button type="button" class="btn btn-secondary btn-sm" data-sst-edit="' + esc_(s.salary_structure_id) + '">Edit</button> ' +
          '<button type="button" class="btn btn-secondary btn-sm" data-sst-toggle="' + esc_(s.salary_structure_id) + '" data-next="' + (active ? 'INACTIVE' : 'ACTIVE') + '">' +
            (active ? 'Deactivate' : 'Activate') + '</button>' +
        '</td></tr>';
    }).join('');
    m.innerHTML =
      '<div class="card" style="margin-bottom:12px"><p class="hint">Create templates here first. To bulk-upload monthly CTC per employee for payroll, use ' +
      '<strong>Payroll → Employee salary</strong> (step 1 in the payroll flow).</p></div>' +
      '<div class="card"><div class="sst-list-head"><button type="button" class="btn btn-primary" id="sst-new">New salary structure</button></div>' +
      (rows
        ? '<table class="data-table"><thead><tr><th>ID</th><th>Name</th><th>Vertical</th><th class="num">Lines</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p class="empty-state">No salary structures yet. Click \u201cNew salary structure\u201d to create one.</p>') +
      '</div>';
    var nw = document.getElementById('sst-new');
    if (nw) nw.addEventListener('click', function () { openForm_(null); });
    m.querySelectorAll('[data-sst-edit]').forEach(function (b) {
      b.addEventListener('click', function () { openForm_(b.getAttribute('data-sst-edit')); });
    });
    m.querySelectorAll('[data-sst-toggle]').forEach(function (b) {
      b.addEventListener('click', function () { toggle_(b.getAttribute('data-sst-toggle'), b.getAttribute('data-next'), b); });
    });
    if (App.markModuleViewLoaded) App.markModuleViewLoaded('salary-structure');
  }

  function toggle_(id, next, btn) {
    callServer('apiSetSalaryStructureTypeStatus', id, next, { button: btn, loadingText: 'Saving\u2026' }).then(function () {
      showToast('Salary structure ' + (next === 'ACTIVE' ? 'activated' : 'deactivated') + '.', 'success');
      loadList_();
    }).catch(function (err) {
      showToast((err && err.message) || 'Update failed.', 'error');
    });
  }

  function loadVerticals_() {
    return callServer('apiGetEmployeeVerticals').then(function (list) {
      return (list && list.length) ? list : ['AOPL', 'SAPL', 'AOMS', 'OTHERS'];
    }).catch(function () {
      return ['AOPL', 'SAPL', 'AOMS', 'OTHERS'];
    });
  }

  function parseRulesJson_(raw) {
    var earned = 'ROUND_LINE';
    try {
      var o = typeof raw === 'string' ? JSON.parse(raw || '{}') : (raw || {});
      if (o && o.earned_prorate) earned = String(o.earned_prorate);
    } catch (ignore) {}
    return earned;
  }

  function rateRowHtml_(c, index, allRate) {
    c = c || {};
    var ui = uiFromStoredRow_(c, SECTION_RATE_);
    var methodOpts = RATE_METHODS_.map(function (k) {
      return '<option value="' + k[0] + '"' + (ui.method === k[0] ? ' selected' : '') + '>' + k[1] + '</option>';
    }).join('');
    var prior = priorRateCodes_(allRate, index);
    var isPercent = ui.method === 'PERCENT';
    var isBalance = ui.method === 'BALANCE_OF_CTC';
    var value = isBalance ? 'Auto'
      : ((c.percent != null && c.percent !== '' && isPercent) ? c.percent
        : ((c.amount != null && c.amount !== '' && ui.method === 'FIXED') ? c.amount : ''));
    return '<tr class="sst-comp-row" data-section="' + SECTION_RATE_ + '">' +
      '<td><input class="form-input sst-c-code" value="' + esc_(c.component_code || '') + '" placeholder="BP"></td>' +
      '<td><input class="form-input sst-c-name" value="' + esc_(c.component_name || '') + '" placeholder="Basic"></td>' +
      '<td><select class="form-select sst-c-method">' + methodOpts + '</select></td>' +
      '<td><select class="form-select sst-c-base"' + (isPercent ? '' : ' disabled') + '>' +
        refOptionsHtml_(ui.base || 'CTC', prior, false) + '</select></td>' +
      '<td><input class="form-input sst-comp-value sst-c-value" type="text" inputmode="decimal"' +
        (isBalance || !isPercent && ui.method !== 'FIXED' ? ' disabled' : '') +
        ' value="' + esc_(value) + '"></td>' +
      '<td class="col-actions"><button type="button" class="btn btn-secondary btn-sm sst-c-remove" title="Remove">\u2715</button></td>' +
      '</tr>';
  }

  function dedRowHtml_(c, index, allRate) {
    c = c || {};
    var ui = uiFromStoredRow_(c, SECTION_DED_);
    var methodOpts = DED_METHODS_.map(function (k) {
      return '<option value="' + k[0] + '"' + (ui.method === k[0] ? ' selected' : '') + '>' + k[1] + '</option>';
    }).join('');
    var prior = priorRateCodes_(allRate, allRate.length);
    var m = ui.method;
    var baseSel = (m === 'PERCENT_IF' || m === 'THRESHOLD_FEE') ? (c.cond_ref || 'EARNED_GROSS') : (c.percent_base || 'BP');
    var roundSel = String(c.round_mode || 'ROUND').toUpperCase();
    var roundOpts = ROUND_MODES_.map(function (r) {
      return '<option value="' + r[0] + '"' + (roundSel === r[0] ? ' selected' : '') + '>' + r[1] + '</option>';
    }).join('');
    var condOp = String(c.cond_op || (m === 'THRESHOLD_FEE' ? 'LTE' : 'LT')).toUpperCase();
    var condOpts = COND_OPS_.map(function (o) {
      return '<option value="' + o[0] + '"' + (condOp === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('');
    var showCap = m === 'PERCENT_CAPPED';
    var showPctBase = m === 'PERCENT_IF';
    var showCond = m === 'PERCENT_IF' || m === 'THRESHOLD_FEE';
    var showPct = m === 'PERCENT' || m === 'PERCENT_CAPPED' || m === 'PERCENT_IF';
    var showAmt = m === 'FIXED' || m === 'THRESHOLD_FEE';
    var pctBaseSel = String(c.percent_base || 'EARNED_GROSS').toUpperCase();
    var pctBaseOpts = refOptionsHtml_(pctBaseSel, prior, true);
    var valLabel = showAmt && m === 'THRESHOLD_FEE' ? (c.amount != null ? c.amount : '200') : (showPct ? (c.percent != null ? c.percent : '') : (c.amount != null ? c.amount : ''));
    return '<tr class="sst-comp-row" data-section="' + SECTION_DED_ + '">' +
      '<td><input class="form-input sst-c-code" value="' + esc_(c.component_code || '') + '" placeholder="PF"></td>' +
      '<td><input class="form-input sst-c-name" value="' + esc_(c.component_name || '') + '" placeholder="PF"></td>' +
      '<td><select class="form-select sst-c-method">' + methodOpts + '</select></td>' +
      '<td><select class="form-select sst-c-base">' + refOptionsHtml_(baseSel, prior, true) + '</select></td>' +
      '<td class="sst-ded-cond"' + (showCond ? '' : ' style="opacity:.35"') + '>' +
        '<select class="form-select sst-c-cond-op"' + (showCond ? '' : ' disabled') + '>' + condOpts + '</select> ' +
        '<input class="form-input sst-c-cond-val sst-c-cond" type="text" inputmode="decimal"' + (showCond ? '' : ' disabled') +
        ' value="' + esc_(showCond && c.cond_value != null ? c.cond_value : (m === 'THRESHOLD_FEE' ? '25000' : '21001')) + '">' +
      '</td>' +
      '<td><input class="form-input sst-comp-value sst-c-value" type="text" inputmode="decimal"' +
        ' value="' + esc_(valLabel) + '" placeholder="' + (showPct ? '%' : 'Amt') + '"></td>' +
      '<td class="sst-cap-cell">' +
        (showPctBase
          ? '<select class="form-select sst-c-pct-base">' + pctBaseOpts + '</select>'
          : '<input class="form-input sst-c-cap" type="text" inputmode="decimal"' + (showCap ? '' : ' disabled') +
            ' value="' + esc_(showCap && c.cap_amount != null ? c.cap_amount : (showCap ? '25000' : '')) + '" title="Wage cap">') +
      '</td>' +
      '<td><select class="form-select sst-c-round">' + roundOpts + '</select></td>' +
      '<td class="col-actions"><button type="button" class="btn btn-secondary btn-sm sst-c-remove" title="Remove">\u2715</button></td>' +
      '</tr>';
  }

  function manualRowHtml_(c) {
    c = c || {};
    return '<tr class="sst-comp-row" data-section="' + SECTION_MANUAL_ + '">' +
      '<td><input class="form-input sst-c-code" value="' + esc_(c.component_code || '') + '" placeholder="ADVANCE"></td>' +
      '<td><input class="form-input sst-c-name" value="' + esc_(c.component_name || '') + '" placeholder="Advance"></td>' +
      '<td class="col-actions"><button type="button" class="btn btn-secondary btn-sm sst-c-remove" title="Remove">\u2715</button></td>' +
      '</tr>';
  }

  function openForm_(id) {
    var page = pageEl_();
    if (!page) return;
    page.innerHTML =
      '<div class="sst-page"><div class="page-header"><h2>' + (id ? 'Edit' : 'New') + ' salary structure</h2></div>' +
      '<div id="sst-form-mount">' + spin_('Loading\u2026') + '</div></div>';
    Promise.all([
      loadVerticals_(),
      id ? callServer('apiGetSalaryStructureType', id) : callServer('apiGetSalaryStructureTypeDefaults')
    ]).then(function (res) {
      var existing = res[1];
      if (!id && existing && existing.components) {
        existing = { components: existing.components, payroll_rules_json: existing.payroll_rules_json, status: 'ACTIVE' };
      }
      paintForm_(res[0], existing);
    }).catch(function (err) {
      var m = document.getElementById('sst-form-mount');
      if (m) m.innerHTML = '<div class="alert alert-danger">' + esc_((err && err.message) || 'Failed to load.') + '</div>';
    });
  }

  function paintForm_(verticals, existing) {
    var m = document.getElementById('sst-form-mount');
    if (!m) return;
    existing = existing || {};
    var parts = splitComponents_(existing.components || []);
    var earnedProrate = parseRulesJson_(existing.payroll_rules_json);
    var currentVertical = String(existing.vertical_name || '').toUpperCase();
    var vertOpts = '<option value="">Select vertical</option>' + (verticals || []).map(function (v) {
      return '<option value="' + esc_(v) + '"' + (currentVertical === String(v).toUpperCase() ? ' selected' : '') + '>' + esc_(v) + '</option>';
    }).join('');
    var active = String(existing.status || 'ACTIVE').toUpperCase() !== 'INACTIVE';
    m.innerHTML =
      '<div class="card">' +
      '<input type="hidden" id="sst-id" value="' + esc_(existing.salary_structure_id || '') + '">' +
      '<div class="form-row">' +
        '<div class="form-group"><label class="form-label" for="sst-name">Structure name</label>' +
          '<input class="form-input" id="sst-name" value="' + esc_(existing.structure_name || '') + '" placeholder="e.g. SAPL Standard"></div>' +
        '<div class="form-group"><label class="form-label" for="sst-vertical">Vertical</label>' +
          '<select class="form-select" id="sst-vertical">' + vertOpts + '</select></div>' +
        '<div class="form-group"><label class="form-label">Status</label>' +
          '<label class="form-check"><input type="checkbox" id="sst-active"' + (active ? ' checked' : '') + '> Active</label></div>' +
      '</div>' +
      '<div class="sst-rules-card">' +
        '<label class="form-label" for="sst-earned-prorate">Earned pay proration</label>' +
        '<select class="form-select" id="sst-earned-prorate" style="max-width:320px">' +
          '<option value="ROUND_LINE"' + (earnedProrate === 'ROUND_LINE' ? ' selected' : '') + '>Round each earning line: (rate ÷ fixed days) × worked days</option>' +
          '<option value="FACTOR"' + (earnedProrate === 'FACTOR' ? ' selected' : '') + '>Prorate total rate by paid days ÷ working days</option>' +
        '</select>' +
        '<p class="hint" style="margin:6px 0 0">Statutory deductions use <strong>earned gross</strong> and component rates from the sections below.</p>' +
      '</div>' +
      '<div class="sst-section">' +
        '<h3>1. Rate of pay (monthly)</h3>' +
        '<p class="page-lede">Defines contractual monthly amounts from employee CTC. Use <strong>Remainder of CTC</strong> once for special allowance (balance after other earnings).</p>' +
        '<table class="data-table"><thead><tr><th>Code</th><th>Name</th><th>Method</th><th>Base</th><th>Value</th><th></th></tr></thead>' +
        '<tbody id="sst-rate-body">' + parts.rate.map(function (c, i) { return rateRowHtml_(c, i, parts.rate); }).join('') + '</tbody></table>' +
        '<button type="button" class="btn btn-secondary btn-sm" id="sst-add-rate">+ Add earning line</button>' +
      '</div>' +
      '<div class="sst-section">' +
        '<h3>2. Deduction formulas</h3>' +
        '<p class="page-lede">PF (capped %), ESIC (conditional %), PT (threshold fee), or custom percent/fixed rules evaluated at payroll.</p>' +
        '<table class="data-table"><thead><tr><th>Code</th><th>Name</th><th>Method</th><th>Base / If-ref</th><th>Condition</th><th>% or fee</th><th>Cap</th><th>Round</th><th></th></tr></thead>' +
        '<tbody id="sst-ded-body">' + parts.ded.map(function (c, i) { return dedRowHtml_(c, i, parts.rate); }).join('') + '</tbody></table>' +
        '<button type="button" class="btn btn-secondary btn-sm" id="sst-add-ded">+ Add deduction rule</button>' +
      '</div>' +
      '<div class="sst-section">' +
        '<h3>3. Manual deductions (payroll entry)</h3>' +
        '<p class="page-lede">Lines with amounts entered per employee each payroll run (advance, TDS, etc.).</p>' +
        '<table class="data-table"><thead><tr><th>Code</th><th>Name</th><th></th></tr></thead>' +
        '<tbody id="sst-manual-body">' + parts.manual.map(function (c) { return manualRowHtml_(c); }).join('') + '</tbody></table>' +
        '<button type="button" class="btn btn-secondary btn-sm" id="sst-add-manual">+ Add manual line</button>' +
      '</div>' +
      '<div class="form-actions" style="margin-top:16px;">' +
        '<button type="button" class="btn btn-primary" id="sst-save">Save structure</button> ' +
        '<button type="button" class="btn btn-secondary" id="sst-cancel">Cancel</button>' +
      '</div></div>';
    document.getElementById('sst-cancel').addEventListener('click', function () { render_({}); });
    document.getElementById('sst-add-rate').addEventListener('click', function () { addRow_(SECTION_RATE_); });
    document.getElementById('sst-add-ded').addEventListener('click', function () { addRow_(SECTION_DED_); });
    document.getElementById('sst-add-manual').addEventListener('click', function () { addRow_(SECTION_MANUAL_); });
    document.getElementById('sst-save').addEventListener('click', function () { save_(this); });
    bindAllRows_();
  }

  function allRateRows_() {
    return Array.prototype.slice.call(document.querySelectorAll('#sst-rate-body .sst-comp-row'));
  }

  function addRow_(section) {
    var rateList = collectRateOnly_();
    var bodyId = section === SECTION_RATE_ ? 'sst-rate-body' : (section === SECTION_DED_ ? 'sst-ded-body' : 'sst-manual-body');
    var body = document.getElementById(bodyId);
    var tmp = document.createElement('tbody');
    var idx = body.querySelectorAll('.sst-comp-row').length;
    if (section === SECTION_RATE_) tmp.innerHTML = rateRowHtml_({}, idx, rateList);
    else if (section === SECTION_DED_) tmp.innerHTML = dedRowHtml_({}, idx, rateList);
    else tmp.innerHTML = manualRowHtml_({});
    body.appendChild(tmp.firstChild);
    bindAllRows_();
  }

  function refreshRateBaseSelects_() {
    var rows = allRateRows_();
    var codes = [];
    rows.forEach(function (tr) {
      var baseSel = tr.querySelector('.sst-c-base');
      var methodSel = tr.querySelector('.sst-c-method');
      var prior = codes.slice();
      if (baseSel && methodSel && methodSel.value === 'PERCENT') {
        baseSel.innerHTML = refOptionsHtml_(baseSel.value, prior, false);
        baseSel.disabled = false;
      }
      var cd = tr.querySelector('.sst-c-code') ? String(tr.querySelector('.sst-c-code').value || '').trim().toUpperCase() : '';
      if (cd) codes.push(cd);
    });
    document.querySelectorAll('#sst-ded-body .sst-comp-row').forEach(function (tr) {
      var baseSel = tr.querySelector('.sst-c-base');
      if (baseSel) baseSel.innerHTML = refOptionsHtml_(baseSel.value, codes, true);
    });
  }

  function syncDedRowUi_(tr) {
    if (!tr || tr.getAttribute('data-section') !== SECTION_DED_) return;
    var m = tr.querySelector('.sst-c-method').value;
    var condWrap = tr.querySelector('.sst-ded-cond');
    var condOp = tr.querySelector('.sst-c-cond-op');
    var condVal = tr.querySelector('.sst-c-cond-val');
    var cap = tr.querySelector('.sst-c-cap');
    var showCond = m === 'PERCENT_IF' || m === 'THRESHOLD_FEE';
    var showCap = m === 'PERCENT_CAPPED';
    var pctBase = tr.querySelector('.sst-c-pct-base');
    if (condWrap) condWrap.style.opacity = showCond ? '1' : '0.35';
    if (condOp) condOp.disabled = !showCond;
    if (condVal) condVal.disabled = !showCond;
    if (cap) cap.disabled = !showCap;
    if (pctBase) pctBase.disabled = m !== 'PERCENT_IF';
  }

  function syncRateRowUi_(tr) {
    if (!tr || tr.getAttribute('data-section') !== SECTION_RATE_) return;
    var sel = tr.querySelector('.sst-c-method');
    var val = tr.querySelector('.sst-c-value');
    var base = tr.querySelector('.sst-c-base');
    var m = sel.value;
    if (m === 'BALANCE_OF_CTC') {
      if (val) { val.value = 'Auto'; val.disabled = true; }
      if (base) base.disabled = true;
    } else if (m === 'PERCENT') {
      if (val) { val.disabled = false; if (val.value === 'Auto') val.value = ''; }
      if (base) base.disabled = false;
      refreshRateBaseSelects_();
    } else {
      if (val) { val.disabled = false; if (val.value === 'Auto') val.value = ''; }
      if (base) base.disabled = true;
    }
  }

  function bindAllRows_() {
    document.querySelectorAll('.sst-c-remove').forEach(function (b) {
      b.onclick = function () {
        var tr = b.closest('tr');
        if (tr) tr.remove();
        refreshRateBaseSelects_();
      };
    });
    document.querySelectorAll('#sst-rate-body .sst-c-code').forEach(function (inp) {
      inp.oninput = refreshRateBaseSelects_;
    });
    document.querySelectorAll('#sst-rate-body .sst-c-method').forEach(function (sel) {
      sel.onchange = function () { syncRateRowUi_(sel.closest('tr')); };
    });
    document.querySelectorAll('#sst-ded-body .sst-c-method').forEach(function (sel) {
      sel.onchange = function () { syncDedRowUi_(sel.closest('tr')); };
    });
    document.querySelectorAll('#sst-rate-body .sst-comp-row').forEach(syncRateRowUi_);
    document.querySelectorAll('#sst-ded-body .sst-comp-row').forEach(syncDedRowUi_);
    refreshRateBaseSelects_();
  }

  function collectRateOnly_() {
    var out = [];
    document.querySelectorAll('#sst-rate-body .sst-comp-row').forEach(function (tr, i) {
      var code = tr.querySelector('.sst-c-code').value.trim();
      if (!code) return;
      out.push({ component_code: code, sort_order: i + 1 });
    });
    return out;
  }

  function collectComponents_() {
    var out = [];
    var order = 0;
    function pushRow(tr, section) {
      var code = tr.querySelector('.sst-c-code').value.trim();
      var name = tr.querySelector('.sst-c-name').value.trim();
      if (!code && !name) return;
      order += 1;
      var c = {
        component_code: code,
        component_name: name,
        structure_section: section,
        sort_order: order
      };
      if (section === SECTION_MANUAL_) {
        c.component_kind = 'DEDUCTION';
        c.calc_method = 'MANUAL';
        out.push(c);
        return;
      }
      if (section === SECTION_DED_) {
        c.component_kind = 'DEDUCTION';
        var method = tr.querySelector('.sst-c-method').value;
        c.calc_method = method;
        c.round_mode = tr.querySelector('.sst-c-round').value;
        var baseRef = tr.querySelector('.sst-c-base').value;
        var val = tr.querySelector('.sst-c-value').value;
        if (method === 'PERCENT_CAPPED' || method === 'PERCENT') {
          c.percent_base = baseRef;
          c.percent = val;
          if (method === 'PERCENT_CAPPED') c.cap_amount = tr.querySelector('.sst-c-cap').value;
        } else if (method === 'PERCENT_IF') {
          c.cond_ref = baseRef;
          c.cond_op = tr.querySelector('.sst-c-cond-op').value;
          c.cond_value = tr.querySelector('.sst-c-cond-val').value;
          var pctBaseEl = tr.querySelector('.sst-c-pct-base');
          c.percent_base = pctBaseEl ? pctBaseEl.value : 'EARNED_GROSS';
          c.percent = val;
        } else if (method === 'THRESHOLD_FEE') {
          c.cond_ref = baseRef;
          c.cond_op = tr.querySelector('.sst-c-cond-op').value;
          c.cond_value = tr.querySelector('.sst-c-cond-val').value;
          c.amount = val;
        } else if (method === 'FIXED') {
          c.amount = val;
        }
        out.push(c);
        return;
      }
      c.component_kind = 'EARNING';
      var method = tr.querySelector('.sst-c-method').value;
      c.calc_method = method;
      var base = tr.querySelector('.sst-c-base') ? tr.querySelector('.sst-c-base').value : 'CTC';
      var value = tr.querySelector('.sst-c-value').value;
      if (method === 'BALANCE_OF_CTC') {
        /* balance */
      } else if (method === 'FIXED') {
        c.amount = value;
      } else if (method === 'PERCENT') {
        c.percent = value;
        c.percent_base = base || 'CTC';
      }
      out.push(c);
    }
    document.querySelectorAll('#sst-rate-body .sst-comp-row').forEach(function (tr) { pushRow(tr, SECTION_RATE_); });
    document.querySelectorAll('#sst-ded-body .sst-comp-row').forEach(function (tr) { pushRow(tr, SECTION_DED_); });
    document.querySelectorAll('#sst-manual-body .sst-comp-row').forEach(function (tr) { pushRow(tr, SECTION_MANUAL_); });
    return out;
  }

  function save_(btn) {
    var prorate = document.getElementById('sst-earned-prorate').value;
    var payload = {
      salary_structure_id: document.getElementById('sst-id').value,
      structure_name: document.getElementById('sst-name').value.trim(),
      vertical_name: document.getElementById('sst-vertical').value,
      status: document.getElementById('sst-active').checked ? 'ACTIVE' : 'INACTIVE',
      payroll_rules_json: JSON.stringify({ earned_prorate: prorate, arrears_add_codes: ['ARREARS'] }),
      components: collectComponents_()
    };
    callServer('apiSaveSalaryStructureType', payload, { button: btn, loadingText: 'Saving\u2026' }).then(function (res) {
      if (res && res.warning) showToast(res.warning, 'warning');
      showToast('Salary structure saved.', 'success');
      render_({});
    }).catch(function (err) {
      showToast((err && err.message) || 'Save failed.', 'error');
    });
  }

  App.registerRoute('salary-structure', { title: 'Salary structures', render: render_ });
  App.registerRoute('compensation', { title: 'Salary structures', render: render_ });
  });
})();
</script>
