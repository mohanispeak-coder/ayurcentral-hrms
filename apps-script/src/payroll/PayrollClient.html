<style>
/* Payroll-local extras. Page header, badges, tables, and buttons use Styles.html. */
.payroll-page .status-badge { margin-left: 8px; vertical-align: middle; }
.payroll-page .data-table { width: 100%; }
.payroll-page .primary-next { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.payroll-page .advanced-actions { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--color-border); }
.payroll-page .row-warn td { background: var(--color-warning-bg); }
.payroll-page .row-block td { background: var(--color-danger-bg); }
.payroll-page .alert-warning { background: var(--color-warning-bg); border: 1px solid var(--color-warning-border); color: var(--color-warning); }
.payroll-page .alert-success { background: var(--color-success-bg); border: 1px solid var(--color-success-border); color: var(--color-success); }
.payroll-page .unsaved-hint { font-size: 0.8rem; color: var(--color-warning); }
.payroll-page .phase-chip {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600;
  background: var(--color-primary-muted); color: var(--color-primary); margin-right: 6px;
}
.payroll-page .input-invalid { border-color: var(--color-danger) !important; }
.payroll-page .kpi-hint { font-size: 0.75rem; color: var(--color-text-muted); margin-top: 4px; }
.payroll-page .period-selects { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.payroll-page th.num, .payroll-page td.num { text-align: right; }
</style>
<script>
(function () {
  'use strict';

  function ready(fn) {
    if (window.HrmsApp) fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  ready(function initPayrollUi() {
    var App = window.HrmsApp;
    if (!App) return;
    var $ = App.$;
    var escapeHtml = App.escapeHtml;
    var callServer = App.callServer;
    var showToast = App.showToast;
    var setActionFeedback = App.setActionFeedback;
    var setFlash = App.setFlash;
    var consumeFlash = App.consumeFlash;
    var flashBannerHtml = App.flashBannerHtml;

    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];
    var PAGE_SIZE = 25;

    var payrollState = {
      detail: null,
      showAdvanced: false,
      tableQuery: '',
      tableFilter: 'all',
      tablePage: 1,
      dirty: false,
      inputDraft: {}
    };
    var homeState = { runs: [], year: 0, month: 0, overview: null };
    var compState = { employeeId: '', bundle: null, employees: [] };

    function shellInv_(keys) {
      if (App.invalidateModuleViewCache) App.invalidateModuleViewCache(keys);
    }

    function invalidatePayrollHome_() {
      homeState.runs = [];
      homeState.overview = null;
      shellInv_('payroll');
      if (App.invalidateDashboardView) App.invalidateDashboardView();
    }

    function invalidatePayrollRunPeers_(runId) {
      invalidatePayrollHome_();
      if (runId) shellInv_('payroll-run:' + runId);
    }

    function invalidateCompensation_() {
      compState.bundle = null;
      compState.employees = [];
      shellInv_('compensation');
    }

    function invalidatePayslipViews_() {
      payslipCache = null;
      shellInv_('my-payslips');
      if (App.invalidateModuleViewCachePrefix) App.invalidateModuleViewCachePrefix('employee-profile:');
      shellInv_('my-profile');
      if (App.invalidateDashboardView) App.invalidateDashboardView();
    }

    if (App.registerModuleDataCacheClear) {
      App.registerModuleDataCacheClear(function () {
        homeState.runs = [];
        homeState.overview = null;
        homeState.year = 0;
        homeState.month = 0;
        homeState.search = '';
        homeState.statusFilter = 'all';
        compState.bundle = null;
        compState.employees = [];
        compState._loaded = false;
        compState.employeeId = '';
        payrollState.detail = null;
        payrollState.dirty = false;
        payrollState.inputDraft = {};
        payslipCache = null;
      });
    }

    App.registerRoute('payroll', { title: 'Payroll', render: renderPayrollHome });
    App.registerRoute('payroll-run', { title: 'Payroll', render: function (params) { renderPayrollRun(params && params.runId); } });
    App.registerRoute('compensation', { title: 'Compensation', render: renderCompensation });
    App.registerRoute('my-payslips', { title: 'My Payslips', render: renderMyPayslips });

    function pageEl() {
      var page = $('page-content');
      if (!page) return null;
      page.classList.remove('hidden');
      return page;
    }

    function stillOn(seq, route) {
      if (App.routeStill) return App.routeStill(seq, route);
      var s = App.getState();
      return seq === s.navSeq && s.currentRoute === route;
    }

    function sessionRole() {
      var s = App.getState() && App.getState().session;
      return s && s.role ? String(s.role).toUpperCase() : '';
    }

    function isAdmin() {
      return sessionRole() === 'ADMIN';
    }

    function fmtMoney(n) {
      var x = Number(n);
      if (!isFinite(x)) return '—';
      return x.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtWhen(v) {
      if (!v) return '—';
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function fmtPeriod(year, month) {
      var name = MONTHS[Number(month) - 1] || String(month);
      return name + ' ' + year;
    }

    function statusKey(status) {
      return String(status || '').toUpperCase();
    }

    function phaseLabel(status) {
      var s = statusKey(status);
      if (s === 'DRAFT') return 'Draft';
      if (s === 'LOCKED') return 'Completed';
      return 'Processing';
    }

    function statusLabel(status) {
      var s = statusKey(status);
      if (s === 'UNDER_REVIEW') return 'In review';
      if (s === 'CALCULATED') return 'Calculated';
      if (s === 'APPROVED') return 'Approved';
      if (s === 'LOCKED') return 'Locked';
      if (s === 'DRAFT') return 'Draft';
      return s || '—';
    }

    function badgePayroll(status) {
      var s = statusKey(status);
      var cls = 'badge status-badge badge-' + s.toLowerCase();
      return '<span class="' + cls + '">' + escapeHtml(statusLabel(s)) + '</span>';
    }

    function stepper(status) {
      var steps = [
        { key: 'DRAFT', label: 'Draft' },
        { key: 'CALCULATED', label: 'Calculate' },
        { key: 'UNDER_REVIEW', label: 'Review' },
        { key: 'APPROVED', label: 'Approve' },
        { key: 'LOCKED', label: 'Lock' }
      ];
      var idx = -1;
      var s = statusKey(status);
      for (var i = 0; i < steps.length; i++) {
        if (steps[i].key === s) idx = i;
      }
      return '<div class="stepper" aria-label="Payroll workflow">' + steps.map(function (st, i) {
        var cls = 'step';
        if (i < idx) cls += ' done';
        if (i === idx) cls += ' current';
        return '<span class="' + cls + '">' + escapeHtml(st.label) + '</span>';
      }).join('') + '</div>';
    }

    function downloadBlob(file) {
      var binary = atob(file.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.fileName || file.title || 'payslip.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function paintErr(el, message, retry) {
      if (App.paintSectionError) App.paintSectionError(el, message, retry);
      else if (el) el.innerHTML = '<div class="alert alert-danger">' + escapeHtml(message || 'Failed') + '</div>';
    }

    function skRows(cols, rows) {
      return App.skeletonTableRows ? App.skeletonTableRows(cols, rows) : '';
    }

    function spinner(label) {
      return App.sectionSkeleton
        ? App.sectionSkeleton({ label: label || 'Loading' })
        : (App.sectionSpinner ? App.sectionSpinner(label) : '<div class="hrms-loading-block" aria-busy="true"><div class="skeleton skeleton-line w80" aria-hidden="true"></div></div>');
    }

    function setButtonLoading(btn, loadingLabel) {
      if (!btn) return false;
      if (App.isButtonLoading && App.isButtonLoading(btn)) return false;
      if (App.setButtonLoading) return App.setButtonLoading(btn, loadingLabel);
      if (!btn.getAttribute('data-prev-html')) btn.setAttribute('data-prev-html', btn.innerHTML);
      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.innerHTML = '<span class="spinner-sm" aria-hidden="true"></span> ' + escapeHtml(loadingLabel || 'Working…');
      return true;
    }

    function restoreButton(btn) {
      if (!btn) return;
      try {
        if (App.restoreButton) {
          App.restoreButton(btn);
          return;
        }
        var prev = btn.getAttribute('data-prev-html');
        if (prev != null) btn.innerHTML = prev;
        btn.removeAttribute('data-prev-html');
        btn.disabled = false;
        btn.classList.remove('is-loading');
      } catch (e) {
        try { btn.disabled = false; } catch (e2) {}
      }
    }

    function rpc(fnName, args, btn, loadingText, feedback) {
      var opts = { loadingText: loadingText || 'Working…' };
      if (btn) opts.button = btn;
      if (feedback) opts.feedback = feedback;
      return callServer.apply(null, [fnName].concat(args || []).concat([opts]));
    }

    function confirmModal(opts) {
      opts = opts || {};
      return new Promise(function (resolve) {
        var wrap = document.createElement('div');
        wrap.className = 'modal-backdrop';
        wrap.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
          '<h3>' + escapeHtml(opts.title || 'Confirm') + '</h3>' +
          '<p>' + escapeHtml(opts.body || 'Are you sure?') + '</p>' +
          '<div class="modal-actions">' +
          '<button type="button" class="btn btn-secondary" id="payroll-modal-cancel">Cancel</button>' +
          '<button type="button" class="btn ' + (opts.danger ? 'btn-danger-solid' : 'btn-primary') + '" id="payroll-modal-ok">' +
          escapeHtml(opts.okLabel || 'Confirm') + '</button></div></div>';
        document.body.appendChild(wrap);
        function close(ok) {
          wrap.remove();
          resolve(!!ok);
        }
        wrap.querySelector('#payroll-modal-cancel').addEventListener('click', function () { close(false); });
        wrap.querySelector('#payroll-modal-ok').addEventListener('click', function () { close(true); });
        wrap.addEventListener('click', function (ev) { if (ev.target === wrap) close(false); });
      });
    }

    function monthOptions(selected) {
      return MONTHS.map(function (name, i) {
        var v = i + 1;
        return '<option value="' + v + '"' + (Number(selected) === v ? ' selected' : '') + '>' +
          escapeHtml(name) + '</option>';
      }).join('');
    }

    function kpiCard(label, value, hint) {
      return '<div class="card kpi-card"><div class="kpi-label">' + escapeHtml(label) + '</div>' +
        '<div class="kpi-value">' + value + '</div>' +
        (hint ? '<div class="kpi-hint">' + escapeHtml(hint) + '</div>' : '') + '</div>';
    }

    function summaryKpis(summary, status) {
      summary = summary || {};
      var has = !!summary.has_totals;
      var st = statusKey(status);
      return '<div class="kpi-row">' +
        kpiCard('Employees', String(summary.employee_count || 0),
          (summary.calculated_count || 0) + ' calculated' +
          (summary.skipped_count ? ', ' + summary.skipped_count + ' skipped' : '')) +
        kpiCard('Gross', has ? fmtMoney(summary.gross_earnings) : '—', st === 'DRAFT' ? 'After calculate' : '') +
        kpiCard('Deductions', has ? fmtMoney(summary.total_deductions) : '—', '') +
        kpiCard('Net pay', has ? fmtMoney(summary.net_pay) : '—', '') +
        kpiCard('LOP impact', (summary.lop_days || 0) + ' days',
          (summary.lop_employees || 0) + ' employee' + ((summary.lop_employees || 0) === 1 ? '' : 's') +
          (summary.lop_mismatch_count ? ' · ' + summary.lop_mismatch_count + ' differ from leave' : '')) +
        '</div>';
    }

    function displayLockBlocks(detail, status) {
      var blocks = (detail && detail.lockBlocks) || [];
      var st = statusKey(status);
      if (!blocks.length) return '';
      if (st === 'DRAFT' && blocks.length === 1 && blocks[0] === 'No calculated records') return '';
      return '<div class="alert alert-danger">Cannot approve or lock until these are resolved: ' +
        escapeHtml(blocks.join('; ')) + '</div>';
    }

    function hasApproveLockBlocks(detail) {
      var blocks = (detail && detail.lockBlocks) || [];
      if (!blocks.length) return false;
      var st = detail.run ? statusKey(detail.run.status) : '';
      if (st === 'DRAFT' && blocks.length === 1 && blocks[0] === 'No calculated records') return false;
      return true;
    }

    function runsForPeriod(runs, year, month) {
      return (runs || []).filter(function (r) {
        return Number(r.period_year) === Number(year) && Number(r.period_month) === Number(month);
      });
    }

    function latestRunForPeriod(runs, year, month) {
      var list = runsForPeriod(runs, year, month);
      if (!list.length) return null;
      var open = null;
      var locked = null;
      list.forEach(function (r) {
        if (statusKey(r.status) !== 'LOCKED') open = r;
        else if (!locked) locked = r;
      });
      return open || locked;
    }

    function renderPayrollHome() {
      var page = pageEl();
      if (!page) return;
      var now = new Date();
      var year = homeState.year || now.getFullYear();
      var month = homeState.month || (now.getMonth() + 1);
      var seq = App.getState().navSeq;
      if (App.consumeModuleViewRestore && App.consumeModuleViewRestore('payroll') && homeState.runs && homeState.runs.length >= 0 && homeState.year) {
        paintPayrollHome_(page, seq);
        return;
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh('payroll') && homeState.runs)) {
        page.innerHTML = '<div class="payroll-page">' +
          '<div class="page-header"><h2>Payroll</h2>' +
          '<p class="page-lede">Process one month at a time: enter days, calculate on the server, review, then lock. Locked amounts never change.</p></div>' +
          '<div class="kpi-row">' +
          '<div class="card kpi-card"><div class="kpi-label">Period</div><div class="skeleton skeleton-xl"></div></div>' +
          '<div class="card kpi-card"><div class="kpi-label">Status</div><div class="skeleton skeleton-xl"></div></div>' +
          '<div class="card kpi-card"><div class="kpi-label">Employees</div><div class="skeleton skeleton-xl"></div></div>' +
          '<div class="card kpi-card"><div class="kpi-label">Net pay</div><div class="skeleton skeleton-xl"></div></div>' +
          '</div>' +
          '<div class="card"><h2>Payroll period</h2>' + spinner('Loading runs…') + '</div></div>';
      }

      callServer('apiListPayrollRuns').then(function (runs) {
        if (!stillOn(seq, 'payroll')) return;
        homeState.runs = runs || [];
        homeState.year = year;
        homeState.month = month;
        if (App.markModuleViewLoaded) App.markModuleViewLoaded('payroll');
        paintPayrollHome_(page, seq);
      }).catch(function (err) {
        if (!stillOn(seq, 'payroll')) return;
        if (App.finishModuleRefresh) App.finishModuleRefresh(true);
        paintErr(page, err.message || 'Failed to load payroll', function () { renderPayrollHome(); });
      });
    }

    function paintPayrollHome_(page, seq) {
      var runs = homeState.runs || [];
      var year = homeState.year;
      var month = homeState.month;
      var current = latestRunForPeriod(runs, year, month);
      var periodRuns = runsForPeriod(runs, year, month);
      var overview = homeState.overview && current && homeState.overview.run &&
        homeState.overview.run.payroll_run_id === current.payroll_run_id ? homeState.overview : null;

      var html = '<div class="payroll-page">';
      var homeFlash = consumeFlash ? consumeFlash('payroll') : null;
      if (flashBannerHtml && homeFlash) html += flashBannerHtml(homeFlash);
      html += '<div class="page-header"><h2>Payroll</h2>' +
        '<p class="page-lede">Process one month at a time: enter days, calculate on the server, review, then lock. Locked amounts never change.</p></div>';

      var summary = overview && overview.summary ? overview.summary : {};
      var st = current ? statusKey(current.status) : '';
      html += '<div class="kpi-row">' +
        kpiCard('Period', escapeHtml(fmtPeriod(year, month)), current ? escapeHtml(current.payroll_run_id) : 'No run yet') +
        kpiCard('Status', current ? ('<span class="phase-chip">' + escapeHtml(phaseLabel(st)) + '</span>' + badgePayroll(st)) : '—',
          current && current.correction_of_run_id ? 'Correction of ' + current.correction_of_run_id : '') +
        kpiCard('Employees', overview ? String(summary.employee_count || 0) : (current ? '…' : '0'), '') +
        kpiCard('Gross', overview && summary.has_totals ? fmtMoney(summary.gross_earnings) : '—', '') +
        kpiCard('Deductions', overview && summary.has_totals ? fmtMoney(summary.total_deductions) : '—', '') +
        kpiCard('Net pay', overview && summary.has_totals ? fmtMoney(summary.net_pay) : '—', '') +
        kpiCard('LOP impact', overview ? ((summary.lop_days || 0) + ' days') : '—',
          overview ? ((summary.lop_employees || 0) + ' employees') : '') +
        '</div>';

      html += '<div class="card"><h2>Payroll period</h2>' +
        '<p class="page-lede">Select the month to work on. Only one open run is allowed per month.</p>' +
        '<div class="page-toolbar" style="margin-top:12px"><div class="period-selects">' +
        '<label class="form-label" style="margin:0">Month <select class="form-select" id="pr-month" style="max-width:180px">' + monthOptions(month) + '</select></label>' +
        '<label class="form-label" style="margin:0">Year <input class="form-input narrow" id="pr-year" type="number" min="2000" max="2100" value="' + escapeHtml(year) + '"></label>' +
        '</div>';

      var openRun = periodRuns.filter(function (r) { return statusKey(r.status) !== 'LOCKED'; })[0];
      var lockedRun = periodRuns.filter(function (r) { return statusKey(r.status) === 'LOCKED'; })[0];
      html += '<div class="primary-next">';
      if (openRun) {
        html += '<button type="button" class="btn btn-primary" id="btn-open-period">Continue ' + escapeHtml(statusLabel(openRun.status)) + ' run</button>';
      } else if (!lockedRun) {
        html += '<button type="button" class="btn btn-primary" id="btn-create-run">Start payroll for ' + escapeHtml(fmtPeriod(year, month)) + '</button>';
      } else {
        html += '<button type="button" class="btn btn-primary" id="btn-open-period">Open locked payroll</button>';
        html += '<button type="button" class="btn btn-secondary" id="btn-create-correction">Create correction run</button>';
      }
      html += '</div><div id="pr-home-feedback" class="action-feedback hidden" role="status"></div></div></div>';

      var q = (homeState.search || '').toLowerCase();
      var statusFilter = homeState.statusFilter || 'all';
      var filtered = runs.filter(function (r) {
        if (statusFilter !== 'all' && statusKey(r.status) !== statusFilter) return false;
        if (!q) return true;
        var hay = (r.payroll_run_id + ' ' + r.period_year + '-' + r.period_month + ' ' + statusLabel(r.status)).toLowerCase();
        return hay.indexOf(q) >= 0;
      });

      html += '<div class="card"><h2>All payroll runs</h2>' +
        '<div class="page-toolbar"><div class="filters">' +
        '<label class="form-label" style="margin:0">Search <input class="form-input search-input" id="pr-search" placeholder="Run ID or period" value="' + escapeHtml(homeState.search || '') + '"></label>' +
        '<label class="form-label" style="margin:0">Status <select class="form-select" id="pr-status-filter" style="max-width:160px">' +
        optFilter_('all', statusFilter, 'All') +
        optFilter_('DRAFT', statusFilter, 'Draft') +
        optFilter_('CALCULATED', statusFilter, 'Calculated') +
        optFilter_('UNDER_REVIEW', statusFilter, 'In review') +
        optFilter_('APPROVED', statusFilter, 'Approved') +
        optFilter_('LOCKED', statusFilter, 'Locked') +
        '</select></label></div></div>';

      if (!filtered.length) {
        html += '<div class="empty-state"><h2>' + (runs.length ? 'No matching runs' : 'No payroll runs yet') + '</h2>' +
          '<p>' + (runs.length ? 'Try a different search or status filter.' : 'Start payroll for this month to begin.') + '</p></div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
          '<th>Period</th><th>Run</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>' +
          filtered.map(function (r) {
            return '<tr class="table-row-click js-open-run" data-id="' + escapeHtml(r.payroll_run_id) + '">' +
              '<td>' + escapeHtml(fmtPeriod(r.period_year, r.period_month)) +
              (r.correction_of_run_id ? ' <span class="hint">correction</span>' : '') + '</td>' +
              '<td class="mono">' + escapeHtml(r.payroll_run_id) + '</td>' +
              '<td><span class="phase-chip">' + escapeHtml(phaseLabel(r.status)) + '</span>' + badgePayroll(r.status) + '</td>' +
              '<td>' + escapeHtml(fmtWhen(r.created_at)) + '</td>' +
              '<td><button type="button" class="btn btn-secondary btn-sm js-open-run" data-id="' + escapeHtml(r.payroll_run_id) + '">Open</button></td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      html += '</div></div>';
      page.innerHTML = html;

      bindHome_(page, seq, current, openRun, lockedRun);

      if (current && (!overview || overview.run.payroll_run_id !== current.payroll_run_id)) {
        var wantId = current.payroll_run_id;
        callServer('apiGetPayrollRun', wantId).then(function (detail) {
          if (!stillOn(seq, 'payroll')) return;
          var latest = latestRunForPeriod(homeState.runs, homeState.year, homeState.month);
          if (!latest || latest.payroll_run_id !== wantId) return;
          homeState.overview = detail;
          paintPayrollHome_(page, seq);
        }).catch(function () {
          /* Overview is optional; the run list still works. */
        });
      }
    }

    function optFilter_(val, cur, label) {
      return '<option value="' + val + '"' + (String(cur) === val ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
    }

    function readPeriodInputs_() {
      var y = Number($('pr-year') && $('pr-year').value);
      var m = Number($('pr-month') && $('pr-month').value);
      if (!y || y < 2000 || y > 2100) {
        showToast('Enter a valid year.', 'error');
        return null;
      }
      if (!m || m < 1 || m > 12) {
        showToast('Choose a month.', 'error');
        return null;
      }
      return { year: y, month: m };
    }

    function bindHome_(page, seq, current, openRun, lockedRun) {
      function syncPeriodFromInputs() {
        var p = readPeriodInputs_();
        if (!p) return;
        if (p.year === homeState.year && p.month === homeState.month) return;
        homeState.year = p.year;
        homeState.month = p.month;
        homeState.overview = null;
        paintPayrollHome_(page, seq);
      }
      if ($('pr-month')) $('pr-month').addEventListener('change', syncPeriodFromInputs);
      if ($('pr-year')) $('pr-year').addEventListener('change', syncPeriodFromInputs);

      if ($('pr-search')) $('pr-search').addEventListener('input', function () {
        homeState.search = this.value;
        paintPayrollHome_(page, seq);
        var el = $('pr-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      if ($('pr-status-filter')) $('pr-status-filter').addEventListener('change', function () {
        homeState.statusFilter = this.value;
        paintPayrollHome_(page, seq);
      });

      var createBtn = $('btn-create-run');
      if (createBtn) createBtn.addEventListener('click', function () {
        var p = readPeriodInputs_();
        if (!p) return;
        if (!setButtonLoading(createBtn, 'Creating run...')) return;
        rpc('apiCreatePayrollRun', [p.year, p.month, ''], createBtn, 'Creating run...', $('pr-home-feedback'))
          .then(function (detail) {
            invalidatePayrollHome_();
            if (setFlash) setFlash('Draft payroll created for ' + fmtPeriod(p.year, p.month), 'success', 'payroll-run');
            App.navigate('payroll-run', { runId: detail.run.payroll_run_id });
          })
          .catch(function () { /* inline error on #pr-home-feedback */ });
      });

      var openBtn = $('btn-open-period');
      if (openBtn) openBtn.addEventListener('click', function () {
        var id = (openRun || lockedRun || current);
        if (id) App.navigate('payroll-run', { runId: id.payroll_run_id });
      });

      var corrBtn = $('btn-create-correction');
      if (corrBtn) corrBtn.addEventListener('click', function () {
        if (!lockedRun) return;
        confirmModal({
          title: 'Create a correction run?',
          body: 'The locked run stays unchanged. A new draft is created for the same month so you can fix amounts and lock again.',
          okLabel: 'Create correction'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(corrBtn, 'Creating...')) return;
          rpc('apiCreatePayrollCorrection', [lockedRun.payroll_run_id, ''], corrBtn, 'Creating...', $('pr-home-feedback'))
            .then(function (detail) {
              invalidatePayrollHome_();
              if (setFlash) setFlash('Correction draft created.', 'success', 'payroll-run');
              App.navigate('payroll-run', { runId: detail.run.payroll_run_id });
            })
            .catch(function () { /* inline error on #pr-home-feedback */ });
        });
      });

      var openers = page.querySelectorAll('.js-open-run');
      for (var i = 0; i < openers.length; i++) {
        openers[i].addEventListener('click', function (ev) {
          ev.preventDefault();
          var id = this.getAttribute('data-id');
          if (id) App.navigate('payroll-run', { runId: id });
        });
      }
    }

    function renderPayrollRun(runId) {
      var page = pageEl();
      if (!page) return;
      if (!runId) {
        page.innerHTML = '<div class="payroll-page"><div class="alert alert-danger">Missing payroll run. Go back to Payroll and open a period.</div></div>';
        return;
      }
      var runKey = 'payroll-run:' + String(runId);
      var seq = App.getState().navSeq;
      var cached = payrollState.detail && payrollState.detail.run &&
        payrollState.detail.run.payroll_run_id === runId ? payrollState.detail : null;
      if (App.consumeModuleViewRestore && App.consumeModuleViewRestore(runKey) && cached) {
        paintRun_(page, cached);
        return;
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh(runKey))) {
        payrollState.tablePage = 1;
        payrollState.dirty = false;
        payrollState.inputDraft = {};
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh(runKey) && cached)) {
        page.innerHTML = '<div class="payroll-page"><div class="card"><h2>Payroll</h2>' + spinner('Loading run…') +
          '<div class="skeleton skeleton-block"></div></div></div>';
      }
      callServer('apiGetPayrollRun', runId).then(function (detail) {
        if (!stillOn(seq, 'payroll-run')) return;
        payrollState.detail = detail;
        if (App.markModuleViewLoaded) App.markModuleViewLoaded(runKey);
        paintRun_(page, detail);
      }).catch(function (err) {
        if (!stillOn(seq, 'payroll-run')) return;
        if (App.finishModuleRefresh) App.finishModuleRefresh(true);
        paintErr(page, err.message || 'Failed to load payroll run', function () { renderPayrollRun(runId); });
      });
    }

    function nextAction_(st) {
      if (st === 'DRAFT') return { id: 'btn-calc', label: 'Calculate payroll', kind: 'calc' };
      if (st === 'CALCULATED') return { id: 'btn-review', label: 'Submit for review', kind: 'review' };
      if (st === 'UNDER_REVIEW') return { id: 'btn-approve', label: 'Approve payroll', kind: 'approve' };
      if (st === 'APPROVED') return { id: 'btn-lock', label: 'Lock payroll', kind: 'lock', danger: true };
      if (st === 'LOCKED') return { id: 'btn-jump-payslips', label: 'View payslips', kind: 'payslips' };
      return null;
    }

    function paintRun_(page, detail) {
      var run = detail.run;
      var st = statusKey(run.status);
      var editable = st === 'DRAFT' || st === 'CALCULATED';
      var rows = detail.rows || [];
      var summary = detail.summary || {};
      var next = nextAction_(st);
      var blocksApprove = hasApproveLockBlocks(detail);

      var html = '<div class="payroll-page">';
      var runFlash = consumeFlash ? consumeFlash('payroll-run') : null;
      if (flashBannerHtml && runFlash) html += flashBannerHtml(runFlash);
      html += '<div class="page-toolbar"><button type="button" class="btn btn-secondary" id="btn-back-runs">All payroll</button></div>';
      html += '<div class="page-header"><h2>' + escapeHtml(fmtPeriod(run.period_year, run.period_month)) +
        ' <span class="phase-chip">' + escapeHtml(phaseLabel(st)) + '</span>' + badgePayroll(st) + '</h2>' +
        '<p class="page-lede">' + escapeHtml(run.payroll_run_id) +
        (run.correction_of_run_id ? ' · Correction of ' + escapeHtml(run.correction_of_run_id) : '') +
        ' · Amounts are calculated on the server. Locking cannot be undone.</p></div>';
      html += summaryKpis(summary, st);
      html += displayLockBlocks(detail, st);
      if (summary.skipped_count && st !== 'DRAFT') {
        html += '<div class="alert alert-warning">' + summary.skipped_count +
          ' employee(s) were skipped because working days must be greater than 0. They will not be paid in this run.</div>';
      }
      if (summary.lop_mismatch_count) {
        html += '<div class="alert alert-warning">LOP days differ from approved leave for ' +
          summary.lop_mismatch_count + ' employee(s). Refresh leave LOP, or apply it to payroll days, then recalculate.</div>';
      }

      html += '<div class="card" id="payroll-period-card"><h2>Payroll actions</h2>' +
        stepper(st) +
        '<p class="page-lede">' + escapeHtml(actionHint_(st, editable)) + '</p>' +
        '<div class="primary-next">';
      if (next) {
        var disabled = ((next.kind === 'approve' || next.kind === 'lock') && blocksApprove) ? ' disabled' : '';
        html += '<button type="button" class="btn ' + (next.danger ? 'btn-danger-solid' : 'btn-primary') + '" id="' + next.id + '"' + disabled + '>' +
          escapeHtml(next.label) + '</button>';
      }
      if (editable) {
        html += '<button type="button" class="btn btn-secondary" id="btn-save-inputs">Save days & extras</button>';
        html += '<span class="unsaved-hint' + (payrollState.dirty ? '' : ' hidden') + '" id="pr-unsaved">Unsaved changes</span>';
      }
      if (st === 'CALCULATED') {
        html += '<button type="button" class="btn btn-secondary" id="btn-calc">Recalculate</button>';
      }
      html += '<button type="button" class="btn btn-secondary btn-sm" id="btn-toggle-advanced">' +
        (payrollState.showAdvanced ? 'Hide more actions' : 'More actions') + '</button>';
      html += '</div>';
      html += '<div id="pr-action-feedback" class="action-feedback hidden" role="status"></div>';

      html += '<div class="advanced-actions' + (payrollState.showAdvanced ? '' : ' hidden') + '" id="payroll-advanced">';
      if (editable) {
        html += '<button type="button" class="btn btn-secondary" id="btn-refresh-lop">Refresh leave LOP</button> ';
        html += '<button type="button" class="btn btn-secondary" id="btn-apply-lop">Apply leave LOP to days</button> ';
      }
      if (st === 'UNDER_REVIEW' || st === 'CALCULATED' || (st === 'APPROVED' && isAdmin())) {
        html += '<button type="button" class="btn btn-secondary" id="btn-draft">Return to draft</button> ';
      }
      if (st === 'LOCKED') {
        html += '<button type="button" class="btn btn-secondary" id="btn-regen-payslips">Regenerate payslips</button> ';
        html += '<button type="button" class="btn btn-secondary" id="btn-correct">Create correction run</button>';
      }
      html += '<p class="hint" style="margin-top:8px">Leave LOP is a suggestion from approved leave. Applying it overwrites LOP days and paid days (working − LOP). Recalculate afterwards.</p>';
      html += '</div></div>';

      html += paintEmployeeTable_(detail, editable);

      if (detail.exceptions && detail.exceptions.length) {
        html += '<div class="card"><h2>Exceptions</h2><p class="page-lede">Resolve these before approve or lock.</p><ul>' +
          detail.exceptions.map(function (e) {
            return '<li><span class="mono">' + escapeHtml(e.employee_id) + '</span>: ' + escapeHtml((e.flags || []).join(', ')) + '</li>';
          }).join('') + '</ul></div>';
      }
      if (detail.departmentTotals && detail.departmentTotals.length) {
        html += '<div class="card"><h2>Department totals</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Department</th><th>Count</th><th class="num">Gross</th><th class="num">Deductions</th><th class="num">Net</th></tr></thead><tbody>' +
          detail.departmentTotals.map(function (t) {
            return '<tr><td>' + escapeHtml(t.department) + '</td><td>' + t.count + '</td><td class="num">' + fmtMoney(t.gross_earnings) +
              '</td><td class="num">' + fmtMoney(t.total_deductions) + '</td><td class="num">' + fmtMoney(t.net_pay) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
      }

      html += paintPayslipsCard_(detail);
      html += '</div>';

      page.innerHTML = html;
      if ($('btn-back-runs')) $('btn-back-runs').addEventListener('click', function () { App.navigate('payroll'); });
      bindRunTable_(page, detail, editable);
      bindRunActions_(run.payroll_run_id, page, detail);
    }

    function actionHint_(st, editable) {
      if (st === 'DRAFT') return 'Enter working, paid, and LOP days, then calculate. Calculation always runs on the server.';
      if (st === 'CALCULATED') return 'Review amounts and exceptions. Recalculate if you change days. Then submit for review.';
      if (st === 'UNDER_REVIEW') return 'Inputs are frozen. Approve when exceptions are clear, or return to draft to edit.';
      if (st === 'APPROVED') return 'Ready to lock. Locking generates payslips and freezes amounts permanently.';
      if (st === 'LOCKED') return 'Completed. Amounts cannot change. Regenerate payslip files if a file failed; use a correction run to change pay.';
      return '';
    }

    function paintEmployeeTable_(detail, editable) {
      var rows = filterRows_(detail.rows || []);
      var total = rows.length;
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (payrollState.tablePage > pages) payrollState.tablePage = pages;
      var start = (payrollState.tablePage - 1) * PAGE_SIZE;
      var pageRows = rows.slice(start, start + PAGE_SIZE);

      var html = '<div class="card" id="employee-payroll-card"><h2>Employee payroll</h2>' +
        '<p class="page-lede">Basic, allowances, deductions, and net come from the last server calculation. Days and extras are this month only.</p>' +
        '<div class="page-toolbar"><div class="filters">' +
        '<label class="form-label" style="margin:0">Search <input class="form-input search-input" id="pr-emp-search" placeholder="Name or employee ID" value="' + escapeHtml(payrollState.tableQuery) + '"></label>' +
        '<label class="form-label" style="margin:0">Show <select class="form-select" id="pr-emp-filter" style="max-width:200px">' +
        optFilter_('all', payrollState.tableFilter, 'All employees') +
        optFilter_('exceptions', payrollState.tableFilter, 'Exceptions') +
        optFilter_('lop', payrollState.tableFilter, 'Has LOP') +
        optFilter_('mismatch', payrollState.tableFilter, 'LOP differs from leave') +
        '</select></label></div></div>';

      if (!(detail.rows || []).length) {
        html += '<div class="empty-state"><h2>No employees in this run</h2><p>No ACTIVE employees had joined by the end of this month.</p></div></div>';
        return html;
      }
      if (!pageRows.length) {
        html += '<div class="empty-state"><h2>No matching employees</h2><p>Try a different search or filter.</p></div></div>';
        return html;
      }

      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Employee</th><th class="num">Basic</th><th class="num">Allowances</th><th class="num">Deductions</th>' +
        '<th class="num">Working</th><th class="num">Paid</th><th class="num">LOP</th><th class="num">Leave LOP</th>' +
        '<th class="num">Net pay</th><th>Flags</th></tr></thead><tbody>';
      pageRows.forEach(function (row) {
        var inp = row.input;
        var rec = row.record;
        var emp = row.employee;
        var amt = row.amounts || {};
        var warnings = row.warnings || [];
        var cls = '';
        if (warnings.indexOf('EXCEPTION') >= 0) cls = 'row-block';
        else if (warnings.indexOf('LOP_MISMATCH') >= 0 || warnings.indexOf('DAYS_INCONSISTENT') >= 0) cls = 'row-warn';
        function cell(name, val, step) {
          if (!editable) return '<td class="num">' + escapeHtml(val) + '</td>';
          return '<td><input class="form-input js-inp" type="number" step="' + (step || '0.01') + '" min="0" data-id="' +
            escapeHtml(inp.payroll_input_id) + '" data-field="' + name + '" value="' + escapeHtml(val) + '"></td>';
        }
        html += '<tr class="' + cls + '">' +
          '<td><div>' + escapeHtml(emp.display_name) + '</div><div class="hint mono">' + escapeHtml(emp.employee_id) + '</div></td>' +
          '<td class="num">' + (rec ? fmtMoney(amt.basic) : '—') + '</td>' +
          '<td class="num">' + (rec ? fmtMoney(amt.allowances) : '—') + '</td>' +
          '<td class="num">' + (rec ? fmtMoney(amt.deductions) : '—') + '</td>' +
          cell('working_days', inputValue_(inp, 'working_days'), '0.5') +
          cell('paid_days', inputValue_(inp, 'paid_days'), '0.5') +
          cell('lop_days', inputValue_(inp, 'lop_days'), '0.5') +
          '<td class="num">' + escapeHtml(inp.lop_from_leave || 0) + '</td>' +
          '<td class="num">' + (rec ? fmtMoney(rec.net_pay) : '—') + '</td>' +
          '<td>' + escapeHtml((rec && rec.exception_flags) || (warnings.length ? warnings.join(', ') : '')) + extrasHint_(inp) + '</td></tr>';
      });
      html += '</tbody></table></div>';
      html += extrasEditorNote_();
      html += '<div class="pagination"><span>Showing ' + (start + 1) + '–' + Math.min(start + PAGE_SIZE, total) + ' of ' + total + '</span>';
      if (pages > 1) {
        html += '<span><button type="button" class="btn btn-secondary btn-sm" id="pr-page-prev"' + (payrollState.tablePage <= 1 ? ' disabled' : '') + '>Previous</button> ' +
          '<button type="button" class="btn btn-secondary btn-sm" id="pr-page-next"' + (payrollState.tablePage >= pages ? ' disabled' : '') + '>Next</button></span>';
      }
      html += '</div></div>';
      return html;
    }

    function extrasHint_(inp) {
      var bits = [];
      if (Number(inputValue_(inp, 'bonus')) > 0) bits.push('bonus');
      if (Number(inputValue_(inp, 'incentive')) > 0) bits.push('incentive');
      if (Number(inputValue_(inp, 'other_earnings')) > 0) bits.push('other earn');
      if (Number(inputValue_(inp, 'other_deductions')) > 0) bits.push('other ded');
      if (Number(inputValue_(inp, 'tds_amount')) > 0) bits.push('TDS');
      return bits.length ? '<div class="hint">' + escapeHtml(bits.join(', ')) + '</div>' : '';
    }

    function extrasEditorNote_() {
      return '<details style="margin-top:12px" id="pr-extras-details"><summary>Bonus, incentive, TDS &amp; other amounts</summary>' +
        '<p class="hint">These amounts are not prorated. They are included the next time you calculate. Edits on hidden pages are kept until you save or calculate.</p>' +
        '<div id="pr-extras-mount"></div></details>';
    }

    function pageRows_(detail) {
      var rows = filterRows_(detail.rows || []);
      var total = rows.length;
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (payrollState.tablePage > pages) payrollState.tablePage = pages;
      var start = (payrollState.tablePage - 1) * PAGE_SIZE;
      return rows.slice(start, start + PAGE_SIZE);
    }

    function inputValue_(inp, field) {
      var id = inp && inp.payroll_input_id;
      var draft = id && payrollState.inputDraft ? payrollState.inputDraft[id] : null;
      if (draft && Object.prototype.hasOwnProperty.call(draft, field)) return draft[field];
      return inp ? inp[field] : '';
    }

    function rememberInputs_(page) {
      if (!page) return;
      var inputs = page.querySelectorAll('.js-inp');
      for (var i = 0; i < inputs.length; i++) {
        var el = inputs[i];
        var id = el.getAttribute('data-id');
        if (!id) continue;
        if (!payrollState.inputDraft[id]) payrollState.inputDraft[id] = { payroll_input_id: id };
        payrollState.inputDraft[id][el.getAttribute('data-field')] = el.value;
      }
    }

    function mountExtras_(page, detail, editable) {
      var mount = $('pr-extras-mount');
      if (!mount) return;
      var rows = pageRows_(detail);
      if (!rows.length) {
        mount.innerHTML = '';
        return;
      }
      var html = '<div class="table-wrap" style="margin-top:8px"><table class="data-table"><thead><tr>' +
        '<th>Employee</th><th>Bonus</th><th>Incentive</th><th>Other earn</th><th>Other ded</th><th>TDS</th></tr></thead><tbody>';
      rows.forEach(function (row) {
        var inp = row.input;
        var emp = row.employee;
        function cell(name) {
          var val = inputValue_(inp, name);
          if (!editable) return '<td class="num">' + fmtMoney(val) + '</td>';
          return '<td><input class="form-input js-inp" type="number" min="0" step="0.01" data-id="' +
            escapeHtml(inp.payroll_input_id) + '" data-field="' + name + '" value="' + escapeHtml(val) + '"></td>';
        }
        html += '<tr><td>' + escapeHtml(emp.display_name) + '</td>' +
          cell('bonus') + cell('incentive') +
          cell('other_earnings') + cell('other_deductions') +
          cell('tds_amount') + '</tr>';
      });
      html += '</tbody></table></div>';
      mount.innerHTML = html;
    }

    function filterRows_(rows) {
      var q = String(payrollState.tableQuery || '').toLowerCase().trim();
      var f = payrollState.tableFilter || 'all';
      return (rows || []).filter(function (row) {
        var emp = row.employee || {};
        var inp = row.input || {};
        var rec = row.record;
        var warnings = row.warnings || [];
        if (q) {
          var hay = (emp.display_name + ' ' + emp.employee_id).toLowerCase();
          if (hay.indexOf(q) < 0) return false;
        }
        if (f === 'exceptions' && !(rec && rec.exception_flags)) return false;
        if (f === 'lop' && !(Number(inp.lop_days) > 0)) return false;
        if (f === 'mismatch' && warnings.indexOf('LOP_MISMATCH') < 0) return false;
        return true;
      });
    }

    function paintPayslipsCard_(detail) {
      var st = statusKey(detail.run.status);
      var ps = detail.payslipStatus || {};
      var html = '<div class="card" id="payslips-card"><h2>Payslips</h2>';
      if (st !== 'LOCKED') {
        html += '<div class="empty-state"><h2>Payslips generate after lock</h2>' +
          '<p>When payroll is locked, HTML payslips are stored on Drive. Employees can download their own from My Payslips.</p></div></div>';
        return html;
      }
      if (ps.complete) {
        html += '<div class="alert alert-success">Payslips generated for ' + ps.generated + ' of ' + ps.expected + ' employees.</div>';
      } else {
        html += '<div class="alert alert-warning">Payslips ready for ' + (ps.generated || 0) + ' of ' + (ps.expected || 0) +
          '. Use Regenerate payslips if files are missing. Amounts stay frozen.</div>';
      }
      var rows = (detail.rows || []).filter(function (r) { return r.record; });
      if (!rows.length) {
        html += '<div class="empty-state"><h2>No calculated employees</h2></div></div>';
        return html;
      }
      html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Employee</th><th>Net pay</th><th>Payslip</th><th></th></tr></thead><tbody>';
      rows.forEach(function (row) {
        var rec = row.record;
        var ready = !!(rec && rec.payslip_document_id);
        html += '<tr><td>' + escapeHtml(row.employee.display_name) +
          '<div class="hint mono">' + escapeHtml(row.employee.employee_id) + '</div></td>' +
          '<td class="num">' + fmtMoney(rec.net_pay) + '</td>' +
          '<td>' + (ready ? '<span class="badge badge-approved">Ready</span>' : '<span class="badge badge-draft">Missing</span>') + '</td>' +
          '<td>' + (ready ? '<button type="button" class="btn btn-secondary btn-sm js-pay-dl" data-id="' +
            escapeHtml(rec.payslip_document_id) + '">Download</button>' : '—') + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
      return html;
    }

    function bindRunTable_(page, detail, editable) {
      mountExtras_(page, detail, editable);
      var search = $('pr-emp-search');
      if (search) search.addEventListener('input', function () {
        rememberInputs_(page);
        payrollState.tableQuery = this.value;
        payrollState.tablePage = 1;
        paintRun_(page, payrollState.detail);
        var el = $('pr-emp-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      var filter = $('pr-emp-filter');
      if (filter) filter.addEventListener('change', function () {
        rememberInputs_(page);
        payrollState.tableFilter = this.value;
        payrollState.tablePage = 1;
        paintRun_(page, payrollState.detail);
      });
      if ($('pr-page-prev')) $('pr-page-prev').addEventListener('click', function () {
        rememberInputs_(page);
        payrollState.tablePage = Math.max(1, payrollState.tablePage - 1);
        paintRun_(page, payrollState.detail);
      });
      if ($('pr-page-next')) $('pr-page-next').addEventListener('click', function () {
        rememberInputs_(page);
        payrollState.tablePage += 1;
        paintRun_(page, payrollState.detail);
      });
      var inputs = page.querySelectorAll('.js-inp');
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener('input', function () {
          payrollState.dirty = true;
          rememberInputs_(page);
          var hint = $('pr-unsaved');
          if (hint) hint.classList.remove('hidden');
          validateInputEl_(this);
        });
      }
    }

    function validateInputEl_(el) {
      var n = Number(el.value);
      var field = el.getAttribute('data-field');
      var invalid = el.value === '' || !isFinite(n) || n < 0 || (field === 'working_days' && n <= 0);
      if (invalid) el.classList.add('input-invalid');
      else el.classList.remove('input-invalid');
      return !invalid;
    }

    function collectInputs_(page) {
      rememberInputs_(page);
      var rows = (payrollState.detail && payrollState.detail.rows) || [];
      var fields = ['working_days', 'paid_days', 'lop_days', 'bonus', 'incentive', 'other_earnings', 'other_deductions', 'tds_amount'];
      return rows.map(function (row) {
        var inp = row.input || {};
        var out = { payroll_input_id: inp.payroll_input_id };
        fields.forEach(function (f) { out[f] = inputValue_(inp, f); });
        return out;
      });
    }

    function clientValidateInputs_(page) {
      rememberInputs_(page);
      var rows = collectInputs_(page);
      var ok = true;
      rows.forEach(function (row) {
        var w = Number(row.working_days);
        var p = Number(row.paid_days);
        var l = Number(row.lop_days);
        if (!isFinite(w) || w <= 0 || !isFinite(p) || p < 0 || !isFinite(l) || l < 0) ok = false;
      });
      var inputs = page.querySelectorAll('.js-inp');
      for (var i = 0; i < inputs.length; i++) {
        if (!validateInputEl_(inputs[i])) ok = false;
      }
      if (!ok) showToast('Fix invalid days before saving. Working days must be greater than 0.', 'error');
      return ok;
    }

    function bindRunActions_(runId, page, detail) {
      function afterUpdate(nextDetail, message) {
        payrollState.detail = nextDetail;
        payrollState.dirty = false;
        payrollState.inputDraft = {};
        invalidatePayrollRunPeers_(runId);
        paintRun_(page, nextDetail);
        if (message && setActionFeedback && $('pr-action-feedback')) {
          setActionFeedback($('pr-action-feedback'), message, 'success');
        } else if (message) {
          showToast(message, 'success');
        }
      }

      function saveIfNeeded() {
        var st = statusKey(detail.run.status);
        var editable = st === 'DRAFT' || st === 'CALCULATED';
        if (!editable) return Promise.resolve(detail);
        if (!clientValidateInputs_(page)) return Promise.reject({ message: 'Invalid payroll inputs.' });
        return callServer('apiSavePayrollInputs', runId, collectInputs_(page));
      }

      function runAction(btn, fnName, extra, successMsg, loadingText) {
        if (!setButtonLoading(btn, loadingText || 'Working…')) return Promise.resolve();
        var args = extra !== undefined ? [runId, extra] : [runId];
        return rpc(fnName, args, btn, loadingText || 'Working…', $('pr-action-feedback'))
          .then(function (next) { afterUpdate(next, successMsg); })
          .catch(function (err) {
            if (!(setActionFeedback && $('pr-action-feedback'))) {
              showToast(err.message || 'Failed', 'error');
            }
          });
      }

      var adv = $('btn-toggle-advanced');
      if (adv) adv.addEventListener('click', function () {
        payrollState.showAdvanced = !payrollState.showAdvanced;
        paintRun_(page, payrollState.detail);
      });

      var save = $('btn-save-inputs');
      if (save) save.addEventListener('click', function () {
        if (!clientValidateInputs_(page)) return;
        if (!setButtonLoading(save, 'Saving...')) return;
        rpc('apiSavePayrollInputs', [runId, collectInputs_(page)], save, 'Saving...', $('pr-action-feedback'))
          .then(function (next) { afterUpdate(next, 'Days and extras saved'); })
          .catch(function (err) {
            if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Save failed', 'error');
          });
      });

      var calc = $('btn-calc');
      if (calc) calc.addEventListener('click', function () {
        if (!setButtonLoading(calc, 'Calculating payroll...')) return;
        saveIfNeeded()
          .then(function () {
            return rpc('apiCalculatePayroll', [runId, {}], calc, 'Calculating payroll...', $('pr-action-feedback'));
          })
          .then(function (next) { afterUpdate(next, 'Payroll calculated.'); })
          .catch(function (err) {
            restoreButton(calc);
            if (setActionFeedback && $('pr-action-feedback')) {
              setActionFeedback($('pr-action-feedback'), err.message || 'Calculate failed', 'error');
            } else {
              showToast(err.message || 'Calculate failed', 'error');
            }
          });
      });

      var review = $('btn-review');
      if (review) review.addEventListener('click', function () {
          runAction(review, 'apiSubmitPayrollReview', undefined, 'Submitted for review', 'Submitting...');
      });

      var draft = $('btn-draft');
      if (draft) draft.addEventListener('click', function () {
        confirmModal({
          title: 'Return to draft?',
          body: 'This unfreezes days and extras so you can edit and calculate again. Approval is cleared.',
          okLabel: 'Return to draft'
        }).then(function (ok) {
          if (!ok) return;
          runAction(draft, 'apiReturnPayrollDraft', undefined, 'Returned to draft', 'Updating...');
        });
      });

      var appr = $('btn-approve');
      if (appr) appr.addEventListener('click', function () {
        if (hasApproveLockBlocks(detail)) {
          showToast('Resolve exceptions before approving.', 'error');
          return;
        }
        confirmModal({
          title: 'Approve this payroll?',
          body: 'Approve only after reviewing amounts and exceptions. You can still return to draft (Admin after approve) before lock.',
          okLabel: 'Approve'
        }).then(function (ok) {
          if (!ok) return;
          runAction(appr, 'apiApprovePayroll', undefined, 'Payroll approved', 'Approving...');
        });
      });

      var lock = $('btn-lock');
      if (lock) lock.addEventListener('click', function () {
        if (hasApproveLockBlocks(detail)) {
          showToast('Cannot lock until exceptions are resolved.', 'error');
          return;
        }
        confirmModal({
          title: 'Lock payroll? This cannot be undone.',
          body: 'Amounts freeze permanently and payslips are generated. To change pay later, create a correction run. The locked run stays as paid history.',
          okLabel: 'Lock payroll',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(lock, 'Locking...')) return;
          rpc('apiLockPayroll', [runId, {}], lock, 'Locking...', $('pr-action-feedback'))
            .then(function (next) {
              invalidatePayslipViews_();
              afterUpdate(next, 'Payroll locked. Payslips generated.');
            })
            .catch(function (err) {
              if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Lock failed', 'error');
            });
        });
      });

      var jump = $('btn-jump-payslips');
      if (jump) jump.addEventListener('click', function () {
        var el = $('payslips-card');
        if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      var lop = $('btn-refresh-lop');
      if (lop) lop.addEventListener('click', function () {
        if (!setButtonLoading(lop, 'Refreshing...')) return;
        saveIfNeeded()
          .then(function () {
            return rpc('apiRefreshPayrollLop', [runId], lop, 'Refreshing...', $('pr-action-feedback'));
          })
          .then(function (next) { afterUpdate(next, 'Leave LOP refreshed. Recalculate if you also apply it to days.'); })
          .catch(function (err) {
            restoreButton(lop);
            if (setActionFeedback && $('pr-action-feedback')) {
              setActionFeedback($('pr-action-feedback'), err.message || 'Refresh failed', 'error');
            } else {
              showToast(err.message || 'Refresh failed', 'error');
            }
          });
      });

      var applyLop = $('btn-apply-lop');
      if (applyLop) applyLop.addEventListener('click', function () {
        confirmModal({
          title: 'Apply leave LOP to payroll days?',
          body: 'This copies approved leave LOP into LOP days and sets paid days to working days minus LOP. Recalculate after this.',
          okLabel: 'Apply leave LOP'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(applyLop, 'Applying...')) return;
          rpc('apiApplyPayrollLeaveLop', [runId], applyLop, 'Applying...', $('pr-action-feedback'))
            .then(function (next) { afterUpdate(next, 'Leave LOP applied to days. Calculate to update net pay.'); })
            .catch(function (err) {
              if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Apply LOP failed', 'error');
            });
        });
      });

      var regen = $('btn-regen-payslips');
      if (regen) regen.addEventListener('click', function () {
        confirmModal({
          title: 'Regenerate payslip files?',
          body: 'Payroll amounts stay frozen. Existing files for this run are replaced. Employees will still see one payslip per run.',
          okLabel: 'Regenerate'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(regen, 'Generating...')) return;
          rpc('apiRegeneratePayslips', [runId], regen, 'Generating...', $('pr-action-feedback'))
            .then(function (next) {
              invalidatePayslipViews_();
              afterUpdate(next, 'Payslips regenerated');
            })
            .catch(function (err) {
              if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Regenerate failed', 'error');
            });
        });
      });

      var corr = $('btn-correct');
      if (corr) corr.addEventListener('click', function () {
        confirmModal({
          title: 'Create a correction run?',
          body: 'This locked run will not change. A new draft for the same month is created so you can fix pay and lock again.',
          okLabel: 'Create correction'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(corr, 'Creating...')) return;
          rpc('apiCreatePayrollCorrection', [runId, ''], corr, 'Creating...', $('pr-action-feedback'))
            .then(function (next) {
              invalidatePayrollHome_();
              if (setFlash) setFlash('Correction draft created.', 'success', 'payroll-run');
              App.navigate('payroll-run', { runId: next.run.payroll_run_id });
            })
            .catch(function (err) {
              if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Correction failed', 'error');
            });
        });
      });

      var dls = page.querySelectorAll('.js-pay-dl');
      for (var i = 0; i < dls.length; i++) {
        dls[i].addEventListener('click', function () {
          var btn = this;
          if (!setButtonLoading(btn, 'Downloading...')) return;
          rpc('apiGetPayslipDownload', [btn.getAttribute('data-id')], btn, 'Downloading...')
            .then(function (file) { downloadBlob(file); })
            .catch(function (err) { showToast(err.message || 'Download denied', 'error'); });
        });
      }
    }

    function defaultComponents() {
      return [
        { component_code: 'BASIC', component_name: 'Basic', component_kind: 'EARNING', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 1 },
        { component_code: 'HRA', component_name: 'HRA', component_kind: 'EARNING', calc_method: 'PERCENT_OF_BASIC', amount: '', percent: 40, sort_order: 2 },
        { component_code: 'SA', component_name: 'Special allowance', component_kind: 'EARNING', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 3 },
        { component_code: 'PF', component_name: 'PF', component_kind: 'DEDUCTION', calc_method: 'PERCENT_OF_BASIC', amount: '', percent: 12, sort_order: 4 },
        { component_code: 'ESI', component_name: 'ESI', component_kind: 'DEDUCTION', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 5 },
        { component_code: 'PT', component_name: 'Professional tax', component_kind: 'DEDUCTION', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 6 },
        { component_code: 'EMPLOYER_PF', component_name: 'Employer PF', component_kind: 'EMPLOYER', calc_method: 'PERCENT_OF_BASIC', amount: '', percent: 12, sort_order: 7 }
      ];
    }

    function renderCompensation() {
      var page = pageEl();
      if (!page) return;
      var seq = App.getState().navSeq;
      if (App.consumeModuleViewRestore && App.consumeModuleViewRestore('compensation') && compState.employees && compState.employees.length >= 0 && compState._loaded) {
        paintCompensationShell_(page);
        return;
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh('compensation') && compState._loaded)) {
        page.innerHTML = '<div class="payroll-page"><div class="page-header"><h2>Compensation</h2>' +
          '<p class="page-lede">Salary structures are contractual. Revisions create history; superseded amounts are never edited.</p></div>' +
          '<div class="card">' + spinner('Loading employees…') + '</div><div id="comp-editor"></div></div>';
      }
      callServer('apiListCompensationEmployees').then(function (emps) {
        if (!stillOn(seq, 'compensation')) return;
        compState.employees = emps || [];
        compState._loaded = true;
        if (App.markModuleViewLoaded) App.markModuleViewLoaded('compensation');
        paintCompensationShell_(page);
      }).catch(function (err) {
        if (!stillOn(seq, 'compensation')) return;
        if (App.finishModuleRefresh) App.finishModuleRefresh(true);
        paintErr(page, err.message || 'Failed to load compensation', function () { renderCompensation(); });
      });
    }

    function paintCompensationShell_(page) {
      var emps = compState.employees || [];
      var q = String(compState.empQuery || '').toLowerCase();
      var onlyActive = compState.onlyActive !== false;
      var onlyMissing = !!compState.onlyMissing;
      var filtered = emps.filter(function (e) {
        if (onlyActive && String(e.status || '').toUpperCase() === 'INACTIVE') return false;
        if (onlyMissing && e.has_current_structure) return false;
        if (!q) return true;
        var hay = (e.employee_id + ' ' + e.display_name + ' ' + (e.department || '')).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
      var selected = compState.employeeId;
      if (selected && !filtered.some(function (e) { return e.employee_id === selected; })) {
        selected = filtered.length ? filtered[0].employee_id : '';
      }
      if (!selected && filtered.length) selected = filtered[0].employee_id;

      var opts = filtered.map(function (e) {
        var miss = e.has_current_structure ? '' : ' — no structure';
        return '<option value="' + escapeHtml(e.employee_id) + '"' + (e.employee_id === selected ? ' selected' : '') + '>' +
          escapeHtml(e.employee_id + ' — ' + e.display_name) + escapeHtml(miss) + '</option>';
      }).join('');

      page.innerHTML = '<div class="payroll-page"><div class="page-header"><h2>Compensation</h2>' +
        '<p class="page-lede">Save a first structure in place. After payroll is locked against it, create a revision so history stays intact.</p></div>' +
        '<div class="card"><h2>Employee</h2>' +
        '<div class="page-toolbar"><div class="filters">' +
        '<label class="form-label" style="margin:0">Search <input class="form-input search-input" id="comp-search" placeholder="Name or ID" value="' + escapeHtml(compState.empQuery || '') + '"></label>' +
        '<label class="form-check"><input type="checkbox" id="comp-active"' + (onlyActive ? ' checked' : '') + '> Active only</label>' +
        '<label class="form-check"><input type="checkbox" id="comp-missing"' + (onlyMissing ? ' checked' : '') + '> Missing structure</label>' +
        '</div></div>' +
        (filtered.length
          ? ('<label class="form-label">Employee <select class="form-select" id="comp-emp" style="max-width:420px">' + opts + '</select></label>')
          : '<div class="empty-state"><h2>No matching employees</h2><p>Adjust search or filters.</p></div>') +
        '</div><div id="comp-editor"></div></div>';

      if ($('comp-search')) $('comp-search').addEventListener('input', function () {
        compState.empQuery = this.value;
        paintCompensationShell_(page);
        var el = $('comp-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      if ($('comp-active')) $('comp-active').addEventListener('change', function () {
        compState.onlyActive = this.checked;
        paintCompensationShell_(page);
      });
      if ($('comp-missing')) $('comp-missing').addEventListener('change', function () {
        compState.onlyMissing = this.checked;
        paintCompensationShell_(page);
      });
      if ($('comp-emp')) {
        $('comp-emp').addEventListener('change', function () {
          loadCompEditor_(this.value);
        });
      }
      if (selected) loadCompEditor_(selected);
    }

    function loadCompEditor_(employeeId, notice) {
      compState.employeeId = employeeId;
      var editor = $('comp-editor');
      if (!editor) return;
      editor.innerHTML = '<div class="card">' + spinner('Loading structure…') + '</div>';
      var seq = App.getState().navSeq;
      Promise.all([
        callServer('apiGetCurrentSalaryStructure', employeeId),
        callServer('apiListSalaryStructures', employeeId)
      ]).then(function (parts) {
        if (!stillOn(seq, 'compensation')) return;
        editor = $('comp-editor');
        if (!editor) return;
        var bundle = parts[0];
        var history = parts[1] || [];
        var comps = bundle && bundle.components && bundle.components.length ? bundle.components : defaultComponents();
        var fromVal = '';
        if (bundle && bundle.structure && bundle.structure.effective_from) {
          fromVal = String(bundle.structure.effective_from).substring(0, 10);
        }
        var ctc = bundle && bundle.structure ? (bundle.structure.ctc_monthly || '') : '';
        var canEdit = !bundle || bundle.can_edit_in_place !== false;
        var html = '<div class="card"><h2>' + (bundle ? 'Current structure' : 'New structure') + '</h2>';
        if (bundle && !canEdit) {
          html += '<div class="alert alert-info">This structure was used in locked payroll. Do not overwrite it — create a revision with a new effective date and reason.</div>';
        }
        html += '<div class="form-row">' +
          '<label class="form-label">Effective from <input class="form-input" id="comp-from" type="date" value="' + escapeHtml(fromVal) + '"></label>' +
          '<label class="form-label">Monthly CTC <input class="form-input" id="comp-ctc" type="number" min="0" step="0.01" value="' + escapeHtml(ctc) + '"></label>' +
          '<label class="form-label">Revision reason <input class="form-input" id="comp-reason" placeholder="Required when creating a revision"></label>' +
          '</div>' +
          '<p id="comp-inline-error" class="field-error"></p>' +
          '<div id="comp-action-feedback" class="action-feedback hidden" role="status"></div>' +
          '<div class="table-wrap"><table class="data-table"><thead><tr><th>Code</th><th>Name</th><th>Kind</th><th>Method</th><th>Amount</th><th>%</th></tr></thead><tbody id="comp-rows">';
        comps.forEach(function (c, i) {
          html += componentRow_(c, i);
        });
        html += '</tbody></table></div>' +
          '<div class="primary-next" style="margin-top:12px">' +
          '<button type="button" class="btn btn-secondary" id="btn-add-comp-row">Add component</button>';
        if (!bundle) {
          html += '<button type="button" class="btn btn-primary" id="btn-save-comp">Save structure</button>';
        } else {
          html += '<button type="button" class="btn btn-primary" id="btn-revise-comp">Create revision</button>';
          if (canEdit) {
            html += '<button type="button" class="btn btn-secondary" id="btn-save-comp">Update current (no history)</button>';
          }
        }
        html += '</div>' +
          '<p class="hint">A BASIC earning line is required. Percent of basic is calculated from BASIC. TDS is not a structure line — enter it on the payroll run.</p></div>';

        html += '<div class="card"><h2>History</h2>';
        if (!history.length) {
          html += '<div class="empty-state"><h2>No history yet</h2><p>Revisions appear here with superseded dates.</p></div>';
        } else {
          html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Status</th><th>From</th><th>To</th><th>Reason</th></tr></thead><tbody>' +
            history.map(function (h) {
              var hs = String(h.status || '').toUpperCase();
              return '<tr><td class="mono">' + escapeHtml(h.salary_structure_id) + '</td><td>' +
                '<span class="badge ' + (hs === 'CURRENT' ? 'badge-approved' : 'badge-draft') + '">' + escapeHtml(hs) + '</span></td><td>' +
                escapeHtml(String(h.effective_from || '').substring(0, 10)) + '</td><td>' +
                escapeHtml(String(h.effective_to || '').substring(0, 10) || '—') +
                '</td><td>' + escapeHtml(h.revision_reason || '') + '</td></tr>';
            }).join('') + '</tbody></table></div>';
        }
        html += '</div>';
        editor.innerHTML = html;
        if (notice && setActionFeedback) setActionFeedback($('comp-action-feedback'), notice, 'success');

        if ($('btn-add-comp-row')) $('btn-add-comp-row').addEventListener('click', function () {
          var tbody = $('comp-rows');
          if (!tbody) return;
          tbody.insertAdjacentHTML('beforeend', componentRow_({
            component_code: '', component_name: '', component_kind: 'EARNING',
            calc_method: 'FIXED', amount: 0, percent: '', sort_order: tbody.children.length + 1
          }, tbody.children.length));
        });
        if ($('btn-save-comp')) $('btn-save-comp').addEventListener('click', function () {
          var payload = collectStructurePayload_();
          var err = validateStructureClient_(payload, false);
          if (err) { setCompError_(err); return; }
          var btn = $('btn-save-comp');
          var go = bundle
            ? confirmModal({
              title: 'Update current structure?',
              body: 'This overwrites the current package without keeping a superseded row. Use Create revision if payroll has already used this structure.',
              okLabel: 'Update current'
            })
            : Promise.resolve(true);
          go.then(function (ok) {
            if (!ok) return;
            if (!setButtonLoading(btn, 'Saving...')) return;
            rpc('apiSaveSalaryStructure', [payload], btn, 'Saving...')
              .then(function () {
                invalidateCompensation_();
                setCompError_('');
                loadCompEditor_(employeeId, 'Structure saved.');
              })
              .catch(function (e) { setCompError_(e.message || 'Save failed'); });
          });
        });
        if ($('btn-revise-comp')) $('btn-revise-comp').addEventListener('click', function () {
          var payload = collectStructurePayload_();
          var err = validateStructureClient_(payload, true);
          if (err) { setCompError_(err); return; }
          var btn = $('btn-revise-comp');
          confirmModal({
            title: 'Create a salary revision?',
            body: 'The current structure becomes superseded the day before the new effective date. Locked payroll that used the old structure will not change.',
            okLabel: 'Create revision'
          }).then(function (ok) {
            if (!ok) return;
            if (!setButtonLoading(btn, 'Saving...')) return;
            rpc('apiReviseSalaryStructure', [payload], btn, 'Saving...')
              .then(function () {
                invalidateCompensation_();
                setCompError_('');
                loadCompEditor_(employeeId, 'Revision created.');
              })
              .catch(function (e) { setCompError_(e.message || 'Revise failed'); });
          });
        });
      }).catch(function (err) {
        var el = $('comp-editor');
        if (!el) return;
        paintErr(el, err.message || 'Failed', function () { loadCompEditor_(employeeId); });
      });
    }

    function setCompError_(msg) {
      var el = $('comp-inline-error');
      if (el) el.textContent = msg || '';
    }

    function validateStructureClient_(payload, isRevise) {
      if (!payload.employee_id) return 'Select an employee.';
      if (!payload.components.length) return 'Add at least one component.';
      var hasBasic = payload.components.some(function (c) {
        return String(c.component_code || '').toUpperCase() === 'BASIC';
      });
      if (!hasBasic) return 'A BASIC earning component is required.';
      if (payload.ctc_monthly !== '' && payload.ctc_monthly != null && Number(payload.ctc_monthly) < 0) {
        return 'Monthly CTC cannot be negative.';
      }
      if (isRevise) {
        if (!String(payload.revision_reason || '').trim()) return 'Revision reason is required.';
        if (!payload.effective_from) return 'Effective from is required for a revision.';
      }
      return '';
    }

    function componentRow_(c, i) {
      return '<tr class="js-comp-row">' +
        '<td><input class="form-input" data-k="component_code" value="' + escapeHtml(c.component_code || '') + '"></td>' +
        '<td><input class="form-input" data-k="component_name" value="' + escapeHtml(c.component_name || '') + '"></td>' +
        '<td><select class="form-input" data-k="component_kind">' +
        opt_('EARNING', c.component_kind) + opt_('DEDUCTION', c.component_kind) + opt_('EMPLOYER', c.component_kind) + '</select></td>' +
        '<td><select class="form-input" data-k="calc_method">' +
        opt_('FIXED', c.calc_method) + opt_('PERCENT_OF_BASIC', c.calc_method) + '</select></td>' +
        '<td><input class="form-input" data-k="amount" type="number" step="0.01" value="' + escapeHtml(c.amount) + '"></td>' +
        '<td><input class="form-input" data-k="percent" type="number" step="0.01" value="' + escapeHtml(c.percent) + '"></td></tr>';
    }

    function opt_(val, cur) {
      return '<option value="' + val + '"' + (String(cur).toUpperCase() === val ? ' selected' : '') + '>' + val + '</option>';
    }

    function collectStructurePayload_() {
      var rows = document.querySelectorAll('#comp-rows .js-comp-row');
      var components = [];
      for (var i = 0; i < rows.length; i++) {
        var obj = { sort_order: i + 1 };
        var fields = rows[i].querySelectorAll('[data-k]');
        for (var j = 0; j < fields.length; j++) {
          obj[fields[j].getAttribute('data-k')] = fields[j].value;
        }
        if (obj.component_code) components.push(obj);
      }
      var emp = $('comp-emp');
      return {
        employee_id: emp ? emp.value : compState.employeeId,
        effective_from: $('comp-from') ? $('comp-from').value : '',
        ctc_monthly: $('comp-ctc') ? $('comp-ctc').value : '',
        revision_reason: $('comp-reason') ? $('comp-reason').value : '',
        components: components
      };
    }

    var payslipCache = null;

    function renderMyPayslips() {
      var page = pageEl();
      if (!page) return;
      var seq = App.getState().navSeq;
      if (App.consumeModuleViewRestore && App.consumeModuleViewRestore('my-payslips') && payslipCache) {
        paintMyPayslips_(page, payslipCache.slips, payslipCache.own);
        return;
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh('my-payslips') && payslipCache)) {
        page.innerHTML = '<div class="payroll-page"><div class="page-header"><h2>My payslips</h2>' +
          '<p class="page-lede">Only your locked payslips. Amounts come from the payroll snapshot, not live salary.</p></div>' +
          '<div class="card" id="payslip-data">' + spinner('Loading payslips…') +
          '<div class="table-wrap"><table><thead><tr><th>Title</th><th>Run</th><th>Date</th><th></th></tr></thead>' +
          '<tbody>' + skRows(4, 4) + '</tbody></table></div></div></div>';
      }
      Promise.all([
        callServer('apiListOwnPayslips'),
        callServer('apiGetOwnSalaryStructure')
      ]).then(function (parts) {
        if (!stillOn(seq, 'my-payslips')) return;
        var slips = parts[0] || [];
        var own = parts[1];
        payslipCache = { slips: slips, own: own };
        if (App.markModuleViewLoaded) App.markModuleViewLoaded('my-payslips');
        paintMyPayslips_(page, slips, own);
      }).catch(function (err) {
        if (!stillOn(seq, 'my-payslips')) return;
        if (App.finishModuleRefresh) App.finishModuleRefresh(true);
        paintErr(page, err.message || 'Failed', function () { renderMyPayslips(); });
      });
    }

    function paintMyPayslips_(page, slips, own) {
        var html = '<div class="payroll-page"><div class="page-header"><h2>My payslips</h2>' +
          '<p class="page-lede">Only your locked payslips. Amounts come from the payroll snapshot, not live salary.</p></div>';
        if (own && own.components) {
          html += '<div class="card"><h2>Current structure (read-only)</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Component</th><th>Kind</th><th class="num">Amount / %</th></tr></thead><tbody>' +
            own.components.map(function (c) {
              var val = String(c.calc_method) === 'PERCENT_OF_BASIC' ? (c.percent + '%') : fmtMoney(c.amount);
              return '<tr><td>' + escapeHtml(c.component_name) + '</td><td>' + escapeHtml(c.component_kind) +
                '</td><td class="num">' + escapeHtml(val) + '</td></tr>';
            }).join('') + '</tbody></table></div></div>';
        }
        if (!slips.length) {
          html += '<div class="card empty-state"><h2>No payslips yet</h2><p>Payslips appear after HR locks a payroll run for a month you were paid.</p></div>';
        } else {
          html += '<div class="card"><h2>Downloads</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Title</th><th>Run</th><th>Date</th><th></th></tr></thead><tbody>' +
            slips.map(function (d) {
              return '<tr><td>' + escapeHtml(d.title) + '</td><td class="mono">' + escapeHtml(d.payroll_run_id || '') +
                '</td><td>' + escapeHtml(fmtWhen(d.uploaded_at)) +
                '</td><td><button type="button" class="btn btn-secondary js-pay-dl" data-id="' + escapeHtml(d.document_id) + '">Download</button></td></tr>';
            }).join('') + '</tbody></table></div></div>';
        }
        html += '</div>';
        page.innerHTML = html;
        var dls = page.querySelectorAll('.js-pay-dl');
        for (var i = 0; i < dls.length; i++) {
          dls[i].addEventListener('click', function () {
            var btn = this;
            if (!setButtonLoading(btn, 'Downloading...')) return;
            rpc('apiGetPayslipDownload', [btn.getAttribute('data-id')], btn, 'Downloading...')
              .then(function (file) { downloadBlob(file); })
              .catch(function (err) { showToast(err.message || 'Download denied', 'error'); });
          });
        }
    }
  });
})();
</script>
