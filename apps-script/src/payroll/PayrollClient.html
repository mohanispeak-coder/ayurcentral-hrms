    function payslipActionHtml_(row, runId) {
      var rec = row.record;
      if (!rec) return '<td>—</td>';
      var ready = !!(rec.payslip_document_id);
      var html = '<td class="payslip-actions">';
      if (ready) {
        html += '<button type="button" class="btn btn-secondary btn-sm js-pay-dl" data-id="' +
          escapeHtml(rec.payslip_document_id) + '">Download</button> ';
      }
      html += '<button type="button" class="btn btn-primary btn-sm js-gen-payslip" data-emp="' +
        escapeHtml(row.employee.employee_id) + '" data-run="' + escapeHtml(runId) + '" data-name="' +
        escapeHtml(row.employee.display_name || row.employee.employee_id) + '">' +
        (ready ? 'Regenerate & notify' : 'Generate & notify') + '</button></td>';
      return html;
    }

    function paintEmployeeTable_(detail, editable) {
      var rows = filterRows_(detail.rows || []);
      var total = rows.length;
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (payrollState.tablePage > pages) payrollState.tablePage = pages;
      var start = (payrollState.tablePage - 1) * PAGE_SIZE;
      var pageRows = rows.slice(start, start + PAGE_SIZE);
      var st = detail && detail.run ? statusKey(detail.run.status) : '';
      var isLocked = st === 'LOCKED';
      var runId = detail && detail.run ? detail.run.payroll_run_id : '';

      var html = '<div id="employee-payroll-section">' +
        '<p class="page-lede">Basic, allowances, deductions, and net come from the last server calculation. Days and extras are this month only.</p>' +
        '<div class="page-toolbar"><div class="filters">' +
        '<label class="form-label" style="margin:0">Search <input class="form-input search-input" id="pr-emp-search" placeholder="Name or employee ID" value="' + escapeHtml(payrollState.tableQuery) + '"></label>' +
        '<label class="form-label" style="margin:0">Show <select class="form-select" id="pr-emp-filter" style="max-width:200px">' +
        optFilter_('all', payrollState.tableFilter, 'All employees') +
        optFilter_('exceptions', payrollState.tableFilter, 'Exceptions') +
        optFilter_('lop', payrollState.tableFilter, 'Has LOP') +
        optFilter_('mismatch', payrollState.tableFilter, 'LOP differs from leave') +
        '</select></label></div></div>';

      if (!(detail.rows || []).length) {
        html += '<div class="empty-state"><h2>No employees in this run</h2><p>No ACTIVE employees had joined by the end of this month.</p></div></div>';
        return html;
      }
      if (!pageRows.length) {
        html += '<div class="empty-state"><h2>No matching employees</h2><p>Try a different search or filter.</p></div></div>';
        return html;
      }

      html += '<div class="table-wrap"><table class="data-table"><thead><tr>' +
        '<th>Employee</th><th class="num">Basic</th><th class="num">Allowances</th><th class="num">Deductions</th>' +
        '<th class="num">Working</th><th class="num">Paid</th><th class="num">LOP</th><th class="num">Leave LOP</th>' +
        '<th class="num">Net pay</th><th>Flags</th>' + (isLocked ? '<th>Payslip</th>' : '') + '</tr></thead><tbody>';
      pageRows.forEach(function (row) {
        var inp = row.input;
        var rec = row.record;
        var emp = row.employee;
        var amt = row.amounts || {};
        var warnings = row.warnings || [];
        var cls = '';
        if (warnings.indexOf('EXCEPTION') >= 0) cls = 'row-block';
        else if (warnings.indexOf('LOP_MISMATCH') >= 0 || warnings.indexOf('DAYS_INCONSISTENT') >= 0) cls = 'row-warn';
        function cell(name, val, step) {
          if (!editable) return '<td class="num">' + escapeHtml(val) + '</td>';
          return '<td><input class="form-input js-inp" type="number" step="' + (step || '0.01') + '" min="0" data-id="' +
            escapeHtml(inp.payroll_input_id) + '" data-field="' + name + '" value="' + escapeHtml(val) + '"></td>';
        }
        html += '<tr class="' + cls + '">' +
          '<td><div>' + escapeHtml(emp.display_name) + '</div><div class="hint mono">' + escapeHtml(emp.employee_id) + '</div></td>' +
          '<td class="num">' + (rec ? fmtMoney(amt.basic) : '—') + '</td>' +
          '<td class="num">' + (rec ? fmtMoney(amt.allowances) : '—') + '</td>' +
          '<td class="num">' + (rec ? fmtMoney(amt.deductions) : '—') + '</td>' +
          cell('working_days', inputValue_(inp, 'working_days'), '0.5') +
          cell('paid_days', inputValue_(inp, 'paid_days'), '0.5') +
          cell('lop_days', inputValue_(inp, 'lop_days'), '0.5') +
          '<td class="num">' + escapeHtml(inp.lop_from_leave || 0) + '</td>' +
          '<td class="num">' + (rec ? fmtMoney(rec.net_pay) : '—') + '</td>' +
          '<td>' + escapeHtml(exceptionMessagesForRow_(detail, row)) + extrasHint_(inp) + '</td>' +
          (isLocked ? payslipActionHtml_(row, runId) : '') + '</tr>';
      });
      html += '</tbody></table></div>';
      html += extrasEditorNote_();
      html += '<div class="pagination"><span>Showing ' + (start + 1) + '–' + Math.min(start + PAGE_SIZE, total) + ' of ' + total + '</span>';
      if (pages > 1) {
        html += '<span><button type="button" class="btn btn-secondary btn-sm" id="pr-page-prev"' + (payrollState.tablePage <= 1 ? ' disabled' : '') + '>Previous</button> ' +
          '<button type="button" class="btn btn-secondary btn-sm" id="pr-page-next"' + (payrollState.tablePage >= pages ? ' disabled' : '') + '>Next</button></span>';
      }
      html += '</div></div>';
      return html;
    }

    function extrasHint_(inp) {
      var bits = [];
      if (Number(inputValue_(inp, 'bonus')) > 0) bits.push('bonus');
      if (Number(inputValue_(inp, 'incentive')) > 0) bits.push('incentive');
      if (Number(inputValue_(inp, 'other_earnings')) > 0) bits.push('other earn');
      if (Number(inputValue_(inp, 'other_deductions')) > 0) bits.push('other ded');
      if (Number(inputValue_(inp, 'tds_amount')) > 0) bits.push('TDS');
      return bits.length ? '<div class="hint">' + escapeHtml(bits.join(', ')) + '</div>' : '';
    }

    function extrasEditorNote_() {
      return '<details style="margin-top:12px" id="pr-extras-details"><summary>Bonus, incentive, TDS &amp; other amounts</summary>' +
        '<p class="hint">These amounts are not prorated. They are included the next time you calculate. Edits on hidden pages are kept until you save or calculate.</p>' +
        '<div id="pr-extras-mount"></div></details>';
    }

    function pageRows_(detail) {
      var rows = filterRows_(detail.rows || []);
      var total = rows.length;
      var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (payrollState.tablePage > pages) payrollState.tablePage = pages;
      var start = (payrollState.tablePage - 1) * PAGE_SIZE;
      return rows.slice(start, start + PAGE_SIZE);
    }

    function inputValue_(inp, field) {
      var id = inp && inp.payroll_input_id;
      var draft = id && payrollState.inputDraft ? payrollState.inputDraft[id] : null;
      if (draft && Object.prototype.hasOwnProperty.call(draft, field)) return draft[field];
      return inp ? inp[field] : '';
    }

    function rememberInputs_(page) {
      if (!page) return;
      var inputs = page.querySelectorAll('.js-inp');
      for (var i = 0; i < inputs.length; i++) {
        var el = inputs[i];
        var id = el.getAttribute('data-id');
        if (!id) continue;
        if (!payrollState.inputDraft[id]) payrollState.inputDraft[id] = { payroll_input_id: id };
        payrollState.inputDraft[id][el.getAttribute('data-field')] = el.value;
      }
    }

    function mountExtras_(page, detail, editable) {
      var mount = $('pr-extras-mount');
      if (!mount) return;
      var rows = pageRows_(detail);
      if (!rows.length) {
        mount.innerHTML = '';
        return;
      }
      var html = '<div class="table-wrap" style="margin-top:8px"><table class="data-table"><thead><tr>' +
        '<th>Employee</th><th>Bonus</th><th>Incentive</th><th>Other earn</th><th>Other ded</th><th>TDS</th></tr></thead><tbody>';
      rows.forEach(function (row) {
        var inp = row.input;
        var emp = row.employee;
        function cell(name) {
          var val = inputValue_(inp, name);
          if (!editable) return '<td class="num">' + fmtMoney(val) + '</td>';
          return '<td><input class="form-input js-inp" type="number" min="0" step="0.01" data-id="' +
            escapeHtml(inp.payroll_input_id) + '" data-field="' + name + '" value="' + escapeHtml(val) + '"></td>';
        }
        html += '<tr><td>' + escapeHtml(emp.display_name) + '</td>' +
          cell('bonus') + cell('incentive') +
          cell('other_earnings') + cell('other_deductions') +
          cell('tds_amount') + '</tr>';
      });
      html += '</tbody></table></div>';
      mount.innerHTML = html;
    }

    function filterRows_(rows) {
      var q = String(payrollState.tableQuery || '').toLowerCase().trim();
      var f = payrollState.tableFilter || 'all';
      return (rows || []).filter(function (row) {
        var emp = row.employee || {};
        var inp = row.input || {};
        var rec = row.record;
        var warnings = row.warnings || [];
        if (q && !matchesEmployeeSearch_(emp, q)) return false;
        if (f === 'exceptions' && !(rec && rec.exception_flags)) return false;
        if (f === 'lop' && !(Number(inp.lop_days) > 0)) return false;
        if (f === 'mismatch' && warnings.indexOf('LOP_MISMATCH') < 0) return false;
        return true;
      });
    }

    function paintPayslipsCard_(detail) {
      var st = statusKey(detail.run.status);
      var ps = detail.payslipStatus || {};
      var html = '<div class="card" id="payslips-card"><h2>Payslips</h2>';
      if (st !== 'LOCKED') {
        html += '<div class="empty-state"><h2>Payslips available after finalizing</h2>' +
          '<p>Finalize payroll first, then generate payslip files for all employees.</p></div></div>';
        return html;
      }
      html += '<p class="page-lede">Use <strong>Generate for one employee</strong> below to email only that person, or <strong>Generate all payslips</strong> to notify everyone.</p>';
      var rows = payslipRows_(detail);
      var runId = detail.run.payroll_run_id;
      if (!rows.length) {
        html += '<div class="empty-state"><h2>No calculated employees</h2></div></div>';
        return html;
      }
      html += paintPayslipOneEmployeeBox_(rows, runId);
      html += '<div class="primary-next" style="margin-top:12px"><button type="button" class="btn btn-secondary" id="btn-regen-payslips">Generate all payslips</button></div>';
      if (ps.complete) {
        html += '<div class="alert alert-success" style="margin-top:12px">Payslips generated for ' + ps.generated + ' of ' + ps.expected + ' employees.</div>';
      } else if (ps.expected) {
        html += '<div class="alert alert-warning" style="margin-top:12px">Payslips ready for ' + (ps.generated || 0) + ' of ' + (ps.expected || 0) +
          ' employees. Use Generate all payslips if files are missing.</div>';
      }
      html += '<div class="table-wrap" style="margin-top:12px"><table class="data-table"><thead><tr><th>Employee</th><th>Net pay</th><th>Status</th><th>Payslip</th></tr></thead><tbody>';
      rows.forEach(function (row) {
        var rec = row.record;
        var ready = !!(rec && rec.payslip_document_id);
        html += '<tr><td>' + escapeHtml(row.employee.display_name) +
          '<div class="hint">' + escapeHtml(row.employee.employee_id) + '</div></td>' +
          '<td class="num">' + fmtMoney(rec.net_pay) + '</td>' +
          '<td>' + (ready ? 'Ready to download' : 'Not generated yet') + '</td>' +
          payslipActionHtml_(row, runId) + '</tr>';
      });
      html += '</tbody></table></div></div>';
      return html;
    }

    function updateEmployeeTableDom_(page, detail, editable) {
      if (!detail) return;
      var card = $('payroll-data-card');
      if (!card) return;
      rememberInputs_(page);
      var wrap = document.createElement('div');
      wrap.innerHTML = paintEmployeeTable_(detail, editable);
      var nextSection = wrap.querySelector('#employee-payroll-section');
      var prevSection = $('employee-payroll-section');
      if (nextSection && prevSection) {
        prevSection.replaceWith(nextSection);
        mountExtras_(page, detail, editable);
        bindPayrollInputFields_(page);
      }
    }

    function repaintPayrollTable_(page) {
      var detail = payrollState.detail;
      if (!detail || !detail.run) {
        paintUnifiedPayroll_(page, App.getState().navSeq, detail);
        return;
      }
      var editable = statusKey(detail.run.status) === 'DRAFT' || statusKey(detail.run.status) === 'CALCULATED';
      if ($('employee-payroll-section')) {
        updateEmployeeTableDom_(page, detail, editable);
        return;
      }
      paintUnifiedPayroll_(page, App.getState().navSeq, detail);
    }

    function bindPayrollInputFields_(page) {
      var inputs = page.querySelectorAll('.js-inp');
      for (var i = 0; i < inputs.length; i++) {
        inputs[i].addEventListener('input', function () {
          payrollState.dirty = true;
          rememberInputs_(page);
          var hint = $('pr-unsaved');
          if (hint) hint.classList.remove('hidden');
          validateInputEl_(this);
        });
      }
    }

    function bindRunTable_(page, detail, editable) {
      var card = $('payroll-data-card');
      if (!card) return;
      mountExtras_(page, detail, editable);
      bindPayrollInputFields_(page);

      if (card.getAttribute('data-table-bound') === '1') return;
      card.setAttribute('data-table-bound', '1');

      card.addEventListener('input', function (ev) {
        if (ev.target && ev.target.id === 'pr-emp-search') {
          payrollState.tableQuery = ev.target.value;
          payrollState.tablePage = 1;
          repaintPayrollTable_(page);
          var el = $('pr-emp-search');
          if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }
      });
      card.addEventListener('change', function (ev) {
        if (ev.target && ev.target.id === 'pr-emp-filter') {
          payrollState.tableFilter = ev.target.value;
          payrollState.tablePage = 1;
          repaintPayrollTable_(page);
        }
      });
      card.addEventListener('click', function (ev) {
        var btn = ev.target && ev.target.closest ? ev.target.closest('#pr-page-prev, #pr-page-next') : null;
        if (!btn) return;
        rememberInputs_(page);
        if (btn.id === 'pr-page-prev') {
          payrollState.tablePage = Math.max(1, payrollState.tablePage - 1);
        } else {
          payrollState.tablePage += 1;
        }
        repaintPayrollTable_(page);
      });
    }

    function validateInputEl_(el) {
      var n = Number(el.value);
      var field = el.getAttribute('data-field');
      var invalid = el.value === '' || !isFinite(n) || n < 0 || (field === 'working_days' && n <= 0);
      if (invalid) el.classList.add('input-invalid');
      else el.classList.remove('input-invalid');
      return !invalid;
    }

    function collectInputs_(page) {
      rememberInputs_(page);
      var rows = (payrollState.detail && payrollState.detail.rows) || [];
      var fields = ['working_days', 'paid_days', 'lop_days', 'bonus', 'incentive', 'other_earnings', 'other_deductions', 'tds_amount'];
      return rows.map(function (row) {
        var inp = row.input || {};
        var out = { payroll_input_id: inp.payroll_input_id };
        fields.forEach(function (f) { out[f] = inputValue_(inp, f); });
        return out;
      });
    }

    function clientValidateInputs_(page) {
      rememberInputs_(page);
      var rows = collectInputs_(page);
      var ok = true;
      rows.forEach(function (row) {
        var w = Number(row.working_days);
        var p = Number(row.paid_days);
        var l = Number(row.lop_days);
        if (!isFinite(w) || w <= 0 || !isFinite(p) || p < 0 || !isFinite(l) || l < 0) ok = false;
      });
      var inputs = page.querySelectorAll('.js-inp');
      for (var i = 0; i < inputs.length; i++) {
        if (!validateInputEl_(inputs[i])) ok = false;
      }
      if (!ok) showToast('Fix invalid days before saving. Working days must be greater than 0.', 'error');
      return ok;
    }

    function defaultComponents() {
      return [
        { component_code: 'BASIC', component_name: 'Basic', component_kind: 'EARNING', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 1 },
        { component_code: 'HRA', component_name: 'HRA', component_kind: 'EARNING', calc_method: 'PERCENT_OF_BASIC', amount: '', percent: 40, sort_order: 2 },
        { component_code: 'SA', component_name: 'Special allowance', component_kind: 'EARNING', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 3 },
        { component_code: 'PF', component_name: 'PF', component_kind: 'DEDUCTION', calc_method: 'PERCENT_OF_BASIC', amount: '', percent: 12, sort_order: 4 },
        { component_code: 'ESI', component_name: 'ESI', component_kind: 'DEDUCTION', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 5 },
        { component_code: 'PT', component_name: 'Professional tax', component_kind: 'DEDUCTION', calc_method: 'FIXED', amount: 0, percent: '', sort_order: 6 },
        { component_code: 'EMPLOYER_PF', component_name: 'Employer PF', component_kind: 'EMPLOYER', calc_method: 'PERCENT_OF_BASIC', amount: '', percent: 12, sort_order: 7 }
      ];
    }

    function renderCompEditor_(employeeId, bundle, notice) {
      employeeId = String(employeeId || '').trim();
      var editor = $('comp-editor');
      if (!editor) return;
      bundle = bundle || { employee_id: employeeId, current: null, history: [] };
      var current = bundle.current;
      var history = bundle.history || [];
      var comps = current && current.components && current.components.length ? current.components : defaultComponents();
      var fromVal = '';
      if (current && current.structure && current.structure.effective_from) {
        fromVal = String(current.structure.effective_from).substring(0, 10);
      } else if (!current && payrollState.detail && payrollState.detail.run) {
        var run = payrollState.detail.run;
        var m = String(Number(run.period_month));
        if (m.length < 2) m = '0' + m;
        fromVal = run.period_year + '-' + m + '-01';
      }
      var ctc = current && current.structure ? (current.structure.ctc_monthly || '') : '';
      var canEdit = !current || current.can_edit_in_place !== false;
      var html = '';
      if (bundle.loadWarning) {
        html += '<div class="alert alert-warning">' + escapeHtml(bundle.loadWarning) +
          ' You can still create or update a structure below.</div>';
      }
      html += '<div class="card"><h2>' + (current ? 'Current structure' : 'New structure') + '</h2>';
      if (current && !canEdit) {
        html += '<div class="alert alert-info">This structure was used in locked payroll. Do not overwrite it — create a revision with a new effective date and reason.</div>';
      }
      html += '<div class="form-row">' +
        '<label class="form-label">Effective from <input class="form-input" id="comp-from" type="date" value="' + escapeHtml(fromVal) + '"></label>' +
        '<label class="form-label">Monthly CTC <input class="form-input" id="comp-ctc" type="number" min="0" step="0.01" value="' + escapeHtml(ctc) + '"></label>' +
        '<label class="form-label">Revision reason <input class="form-input" id="comp-reason" placeholder="Required when creating a revision"></label>' +
        '</div>' +
        '<p id="comp-inline-error" class="field-error"></p>' +
        '<div id="comp-action-feedback" class="action-feedback hidden" role="status"></div>' +
        '<div class="table-wrap"><table class="data-table"><thead><tr><th>Code</th><th>Name</th><th>Kind</th><th>Method</th><th>Amount</th><th>%</th></tr></thead><tbody id="comp-rows">';
      comps.forEach(function (c, i) {
        html += componentRow_(c, i);
      });
      html += '</tbody></table></div>' +
        '<div class="primary-next" style="margin-top:12px">' +
        '<button type="button" class="btn btn-secondary" id="btn-add-comp-row">Add component</button>';
      if (!current) {
        html += '<button type="button" class="btn btn-primary" id="btn-save-comp">Save structure</button>';
      } else {
        html += '<button type="button" class="btn btn-primary" id="btn-revise-comp">Create revision</button>';
        if (canEdit) {
          html += '<button type="button" class="btn btn-secondary" id="btn-save-comp">Update current (no history)</button>';
        }
      }
      html += '</div>' +
        '<p class="hint">All standard components (Basic, HRA, SA, PF, ESI, PT, Employer PF) are required — use 0 where not applicable. TDS is entered on the payroll run. After saving, recalculate payroll to clear finalize blockers.</p></div>';

      html += '<div class="card"><h2>History</h2>';
      if (!history.length) {
        html += '<div class="empty-state"><h2>No history yet</h2><p>Revisions appear here with superseded dates.</p></div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Status</th><th>From</th><th>To</th><th>Reason</th></tr></thead><tbody>' +
          history.map(function (h) {
            var hs = String(h.status || '').toUpperCase();
            return '<tr><td class="mono">' + escapeHtml(h.salary_structure_id) + '</td><td>' +
              '<span class="badge ' + (hs === 'CURRENT' ? 'badge-approved' : 'badge-draft') + '">' + escapeHtml(hs) + '</span></td><td>' +
              escapeHtml(String(h.effective_from || '').substring(0, 10)) + '</td><td>' +
              escapeHtml(String(h.effective_to || '').substring(0, 10) || '—') +
              '</td><td>' + escapeHtml(h.revision_reason || '') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }
      html += '</div>';
      editor.innerHTML = html;
      if (notice && setActionFeedback) setActionFeedback($('comp-action-feedback'), notice, 'success');

      if ($('btn-add-comp-row')) $('btn-add-comp-row').addEventListener('click', function () {
        var tbody = $('comp-rows');
        if (!tbody) return;
        tbody.insertAdjacentHTML('beforeend', componentRow_({
          component_code: '', component_name: '', component_kind: 'EARNING',
          calc_method: 'FIXED', amount: 0, percent: '', sort_order: tbody.children.length + 1
        }, tbody.children.length));
      });
      if ($('btn-save-comp')) $('btn-save-comp').addEventListener('click', function () {
        var payload = collectStructurePayload_();
        var err = validateStructureClient_(payload, false);
        if (err) { setCompError_(err); return; }
        var btn = $('btn-save-comp');
        var go = current
          ? confirmModal({
            title: 'Update current structure?',
            body: 'This overwrites the current package without keeping a superseded row. Use Create revision if payroll has already used this structure.',
            okLabel: 'Update current'
          })
          : Promise.resolve(true);
        go.then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(btn, 'Saving...')) return;
          rpc('apiSaveSalaryStructure', [payload], btn, 'Saving...')
            .then(function () {
              invalidateCompensation_();
              invalidatePayrollRunPeers_(payrollState.detail && payrollState.detail.run
                ? payrollState.detail.run.payroll_run_id : '');
              setCompError_('');
              loadCompEditor_(employeeId, 'Structure saved.');
              showToast('Salary structure saved. Recalculate payroll to refresh finalize checks.', 'success');
            })
            .catch(function (e) { setCompError_(e.message || 'Save failed'); });
        });
      });
      if ($('btn-revise-comp')) $('btn-revise-comp').addEventListener('click', function () {
        var payload = collectStructurePayload_();
        var err = validateStructureClient_(payload, true);
        if (err) { setCompError_(err); return; }
        var btn = $('btn-revise-comp');
        confirmModal({
          title: 'Create a salary revision?',
          body: 'The current structure becomes superseded the day before the new effective date. Locked payroll that used the old structure will not change.',
          okLabel: 'Create revision'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(btn, 'Saving...')) return;
          rpc('apiReviseSalaryStructure', [payload], btn, 'Saving...')
            .then(function () {
              invalidateCompensation_();
              invalidatePayrollRunPeers_(payrollState.detail && payrollState.detail.run
                ? payrollState.detail.run.payroll_run_id : '');
              setCompError_('');
              loadCompEditor_(employeeId, 'Revision created.');
              showToast('Salary revision saved. Recalculate payroll to refresh finalize checks.', 'success');
            })
            .catch(function (e) { setCompError_(e.message || 'Revise failed'); });
        });
      });
    }

    function loadCompEditor_(employeeId, notice) {
      employeeId = String(employeeId || '').trim();
      compState.employeeId = employeeId;
      var editor = $('comp-editor');
      if (!editor) return;
      if (!employeeId) {
        editor.innerHTML = '<div class="empty-state"><p>Select an employee to view or edit salary structure.</p></div>';
        return;
      }
      editor.innerHTML = '<div class="card">' + spinner('Loading structure…') + '</div>';
      var seq = App.getState().navSeq;
      callServer('apiGetCompensationEditorBundle', employeeId).then(function (bundle) {
        if (!stillOnPayrollModule_(seq)) return;
        renderCompEditor_(employeeId, bundle, notice);
      }).catch(function (err) {
        if (!stillOnPayrollModule_(seq)) return;
        callServer('apiGetCurrentSalaryStructure', employeeId).then(function (current) {
          if (!stillOnPayrollModule_(seq)) return;
          renderCompEditor_(employeeId, {
            employee_id: employeeId,
            current: current,
            history: [],
            loadWarning: (err && err.message) || 'Could not load full salary history.'
          }, notice);
        }).catch(function () {
          renderCompEditor_(employeeId, {
            employee_id: employeeId,
            current: null,
            history: [],
            loadWarning: (err && err.message) || 'Could not load saved salary structure from server.'
          }, notice);
        });
      });
    }

    function setCompError_(msg) {
      var el = $('comp-inline-error');
      if (el) el.textContent = msg || '';
    }

    function validateStructureClient_(payload, isRevise) {
      if (!payload.employee_id) return 'Select an employee.';
      if (!payload.components.length) return 'Add at least one component.';
      var hasBasic = payload.components.some(function (c) {
        return String(c.component_code || '').toUpperCase() === 'BASIC';
      });
      if (!hasBasic) return 'A BASIC earning component is required.';
      if (payload.ctc_monthly !== '' && payload.ctc_monthly != null && Number(payload.ctc_monthly) < 0) {
        return 'Monthly CTC cannot be negative.';
      }
      if (isRevise) {
        if (!String(payload.revision_reason || '').trim()) return 'Revision reason is required.';
        if (!payload.effective_from) return 'Effective from is required for a revision.';
      }
      return '';
    }

    function componentRow_(c, i) {
      return '<tr class="js-comp-row">' +
        '<td><input class="form-input" data-k="component_code" value="' + escapeHtml(c.component_code || '') + '"></td>' +
        '<td><input class="form-input" data-k="component_name" value="' + escapeHtml(c.component_name || '') + '"></td>' +
        '<td><select class="form-input" data-k="component_kind">' +
        opt_('EARNING', c.component_kind) + opt_('DEDUCTION', c.component_kind) + opt_('EMPLOYER', c.component_kind) + '</select></td>' +
        '<td><select class="form-input" data-k="calc_method">' +
        opt_('FIXED', c.calc_method) + opt_('PERCENT_OF_BASIC', c.calc_method) + '</select></td>' +
        '<td><input class="form-input" data-k="amount" type="number" step="0.01" value="' + escapeHtml(c.amount) + '"></td>' +
        '<td><input class="form-input" data-k="percent" type="number" step="0.01" value="' + escapeHtml(c.percent) + '"></td></tr>';
    }

    function opt_(val, cur) {
      return '<option value="' + val + '"' + (String(cur).toUpperCase() === val ? ' selected' : '') + '>' + val + '</option>';
    }

    function collectStructurePayload_() {
      var rows = document.querySelectorAll('#comp-rows .js-comp-row');
      var components = [];
      for (var i = 0; i < rows.length; i++) {
        var obj = { sort_order: i + 1 };
        var fields = rows[i].querySelectorAll('[data-k]');
        for (var j = 0; j < fields.length; j++) {
          obj[fields[j].getAttribute('data-k')] = fields[j].value;
        }
        if (obj.component_code) components.push(obj);
      }
      var emp = $('comp-emp');
      return {
        employee_id: emp ? emp.value : compState.employeeId,
        effective_from: $('comp-from') ? $('comp-from').value : '',
        ctc_monthly: $('comp-ctc') ? $('comp-ctc').value : '',
        revision_reason: $('comp-reason') ? $('comp-reason').value : '',
        components: components
      };
    }

    var payslipCache = null;

    function renderMyPayslips() {
      var page = pageEl();
      if (!page) return;
      var seq = App.getState().navSeq;
      if (App.consumeModuleViewRestore && App.consumeModuleViewRestore('my-payslips') && payslipCache) {
        paintMyPayslips_(page, payslipCache.slips, payslipCache.own);
        return;
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh('my-payslips') && payslipCache)) {
        page.innerHTML = '<div class="payroll-page"><div class="page-header"><h2>My payslips</h2>' +
          '<p class="page-lede">Only your locked payslips. Amounts come from the payroll snapshot, not live salary.</p></div>' +
          '<div class="card" id="payslip-data">' + spinner('Loading payslips…') +
          '<div class="table-wrap"><table><thead><tr><th>Title</th><th>Run</th><th>Date</th><th></th></tr></thead>' +
          '<tbody>' + skRows(4, 4) + '</tbody></table></div></div></div>';
      }
      Promise.all([
        callServer('apiListOwnPayslips'),
        callServer('apiGetOwnSalaryStructure')
      ]).then(function (parts) {
        if (!stillOn(seq, 'my-payslips')) return;
        var slips = parts[0] || [];
        var own = parts[1];
        payslipCache = { slips: slips, own: own };
        if (App.markModuleViewLoaded) App.markModuleViewLoaded('my-payslips');
        paintMyPayslips_(page, slips, own);
      }).catch(function (err) {
        if (!stillOn(seq, 'my-payslips')) return;
        if (App.finishModuleRefresh) App.finishModuleRefresh(true);
        paintErr(page, err.message || 'Failed', function () { renderMyPayslips(); });
      });
    }

    function paintMyPayslips_(page, slips, own) {
        var html = '<div class="payroll-page"><div class="page-header"><h2>My payslips</h2>' +
          '<p class="page-lede">Your generated payslips. Amounts come from the payroll snapshot, not live salary.</p></div>';
        if (own && own.components) {
          html += '<div class="card"><h2>Current structure (read-only)</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Component</th><th>Kind</th><th class="num">Amount / %</th></tr></thead><tbody>' +
            own.components.map(function (c) {
              var val = String(c.calc_method) === 'PERCENT_OF_BASIC' ? (c.percent + '%') : fmtMoney(c.amount);
              return '<tr><td>' + escapeHtml(c.component_name) + '</td><td>' + escapeHtml(c.component_kind) +
                '</td><td class="num">' + escapeHtml(val) + '</td></tr>';
            }).join('') + '</tbody></table></div></div>';
        }
        if (!slips.length) {
          html += '<div class="card empty-state"><h2>No payslips available yet.</h2></div>';
        } else {
          html += '<div class="card"><h2>Payslips</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Period</th><th>Net pay</th><th></th></tr></thead><tbody>' +
            slips.map(function (d) {
              var period = d.period_label || d.title || 'Payslip';
              var net = d.net_pay != null && d.net_pay !== '' ? fmtMoneyInr(d.net_pay) : '—';
              return '<tr><td>' + escapeHtml(period) + '</td><td class="num">' + escapeHtml(net) + '</td><td>' +
                '<button type="button" class="btn btn-secondary js-pay-dl" data-id="' + escapeHtml(d.document_id) + '">View payslip</button> ' +
                '<button type="button" class="btn btn-secondary js-pay-dl" data-id="' + escapeHtml(d.document_id) + '">Download PDF</button></td></tr>';
            }).join('') + '</tbody></table></div></div>';
        }
        html += '</div>';
        page.innerHTML = html;
        var dls = page.querySelectorAll('.js-pay-dl');
        for (var i = 0; i < dls.length; i++) {
          dls[i].addEventListener('click', function () {
            var btn = this;
            if (!setButtonLoading(btn, 'Downloading...')) return;
            rpc('apiGetPayslipDownload', [btn.getAttribute('data-id')], btn, 'Downloading...')
              .then(function (file) { downloadBlob(file); })
              .catch(function (err) { showToast(err.message || 'Download denied', 'error'); });
          });
        }
    }
  });
})();
</script>
