<style>
/* Payroll-local extras. Page header, badges, tables, and buttons use Styles.html. */
.payroll-page .status-badge { margin-left: 8px; vertical-align: middle; }
.payroll-page .data-table { width: 100%; }
.payroll-page .primary-next { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.payroll-page .advanced-actions { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--color-border); }
.payroll-page .row-warn td { background: var(--color-warning-bg); }
.payroll-page .row-block td { background: var(--color-danger-bg); }
.payroll-page .alert-warning { background: var(--color-warning-bg); border: 1px solid var(--color-warning-border); color: var(--color-warning); }
.payroll-page .alert-success { background: var(--color-success-bg); border: 1px solid var(--color-success-border); color: var(--color-success); }
.payroll-page .unsaved-hint { font-size: 0.8rem; color: var(--color-warning); }
.payroll-page .phase-chip {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 600;
  background: var(--color-primary-muted); color: var(--color-primary); margin-right: 6px;
}
.payroll-page .input-invalid { border-color: var(--color-danger) !important; }
.payroll-page .kpi-hint { font-size: 0.75rem; color: var(--color-text-muted); margin-top: 4px; }
.payroll-page .period-selects { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.payroll-page th.num, .payroll-page td.num { text-align: right; }
.payroll-page .section-details { margin-top: 12px; }
.payroll-page .section-details > summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
.payroll-page .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
@media (max-width: 640px) { .payroll-page .check-grid { grid-template-columns: 1fr; } }
.payroll-page .check-box { padding: 12px; border-radius: 8px; border: 1px solid var(--color-border); }
.payroll-page .check-box.ready { background: var(--color-success-bg); border-color: var(--color-success-border); }
.payroll-page .check-box.attention { background: var(--color-warning-bg); border-color: var(--color-warning-border); }
.payroll-page .check-count { font-size: 1.5rem; font-weight: 700; }
.payroll-page .problem-list { margin: 8px 0 0; padding-left: 18px; }
.payroll-page .problem-list li { margin-bottom: 4px; }
.payroll-page .upload-preview { margin-top: 12px; padding: 12px; border: 1px solid var(--color-border); border-radius: 8px; }
.payroll-page .finalize-summary dt { font-weight: 600; margin-top: 8px; }
.payroll-page .finalize-summary dd { margin: 2px 0 0; }
.payroll-page .hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.payroll-page .bulk-upload-card { margin-top: 12px; margin-bottom: 16px; border: 1px solid var(--color-primary); background: var(--color-bg-elevated); }
.payroll-page .bulk-upload-card h2 { margin-top: 0; }
.payroll-page .bulk-steps { margin: 8px 0 12px 20px; color: var(--color-text-muted); font-size: 0.875rem; }
</style>
<script>
(function () {
  'use strict';

  function ready(fn) {
    if (window.HrmsApp) fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  ready(function initPayrollUi() {
    var App = window.HrmsApp;
    if (!App) return;
    var $ = App.$;
    var escapeHtml = App.escapeHtml;
    var callServer = App.callServer;
    var showToast = App.showToast;
    var setActionFeedback = App.setActionFeedback;
    var setFlash = App.setFlash;
    var consumeFlash = App.consumeFlash;
    var flashBannerHtml = App.flashBannerHtml;

    var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
      'July', 'August', 'September', 'October', 'November', 'December'];
    var PAGE_SIZE = 25;

    var payrollState = {
      detail: null,
      showAdvanced: false,
      tableQuery: '',
      tableFilter: 'all',
      tablePage: 1,
      dirty: false,
      inputDraft: {}
    };
    var homeState = { runs: [], year: 0, month: 0, overview: null, salaryStructureOpen: false, prevPayrollsOpen: false };
    var compState = { employeeId: '', bundle: null, employees: [], _loaded: false, _editorLoadedFor: '' };
    var bulkState = { preview: null };
    var compBulkState = { preview: null, selectedFile: null };

    function shellInv_(keys) {
      if (App.invalidateModuleViewCache) App.invalidateModuleViewCache(keys);
    }

    function invalidatePayrollHome_() {
      homeState.runs = [];
      homeState.overview = null;
      shellInv_('payroll');
      if (App.invalidateDashboardView) App.invalidateDashboardView();
    }

    function invalidatePayrollRunPeers_(runId) {
      invalidatePayrollHome_();
      if (runId) shellInv_('payroll-run:' + runId);
    }

    function invalidateCompensation_() {
      compState.bundle = null;
      compState.employees = [];
      compState._loaded = false;
      compState._editorLoadedFor = '';
      shellInv_('compensation');
    }

    function invalidatePayslipViews_() {
      payslipCache = null;
      shellInv_('my-payslips');
      if (App.invalidateModuleViewCachePrefix) App.invalidateModuleViewCachePrefix('employee-profile:');
      shellInv_('my-profile');
      if (App.invalidateDashboardView) App.invalidateDashboardView();
    }

    if (App.registerModuleDataCacheClear) {
      App.registerModuleDataCacheClear(function () {
        homeState.runs = [];
        homeState.overview = null;
        homeState.year = 0;
        homeState.month = 0;
        homeState.search = '';
        homeState.statusFilter = 'all';
        compState.bundle = null;
        compState.employees = [];
        compState._loaded = false;
        compState.employeeId = '';
        payrollState.detail = null;
        payrollState.dirty = false;
        payrollState.inputDraft = {};
        bulkState.preview = null;
        homeState.salaryStructureOpen = false;
        payslipCache = null;
      });
    }

    App.registerRoute('payroll', { title: 'Payroll', render: renderPayrollHome });
    App.registerRoute('payroll-run', { title: 'Payroll', render: function (params) { renderPayrollHome({ runId: params && params.runId }); } });
    App.registerRoute('compensation', { title: 'Compensation', render: renderCompensation });
    App.registerRoute('my-payslips', { title: 'My Payslips', render: renderMyPayslips });

    function pageEl() {
      var page = $('page-content');
      if (!page) return null;
      page.classList.remove('hidden');
      return page;
    }

    function stillOn(seq, route) {
      if (App.routeStill) return App.routeStill(seq, route);
      var s = App.getState();
      return seq === s.navSeq && s.currentRoute === route;
    }

    function sessionRole() {
      var s = App.getState() && App.getState().session;
      return s && s.role ? String(s.role).toUpperCase() : '';
    }

    function isAdmin() {
      return sessionRole() === 'ADMIN';
    }

    function stillOnPayrollModule_(seq) {
      var s = App.getState();
      var route = s.currentRoute;
      return seq === s.navSeq && (route === 'payroll' || route === 'payroll-run' || route === 'compensation');
    }

    function refreshPayrollPage_(opts) {
      opts = opts || {};
      invalidatePayrollHome_();
      payrollState.detail = null;
      homeState.overview = null;
      bulkState.preview = null;
      renderPayrollHome({
        year: opts.year != null ? opts.year : homeState.year,
        month: opts.month != null ? opts.month : homeState.month,
        runId: opts.runId,
        openSalaryStructure: !!opts.openSalaryStructure
      });
    }

    function fmtMoneyInr(n) {
      var m = fmtMoney(n);
      return m === '—' ? m : ('₹ ' + m);
    }

    function employeeSearchHay_(emp) {
      emp = emp || {};
      return [
        emp.display_name, emp.employee_id, emp.first_name, emp.last_name,
        emp.work_email, emp.department, emp.designation
      ].map(function (v) { return String(v || '').trim(); }).filter(Boolean).join(' ').toLowerCase();
    }

    function matchesEmployeeSearch_(emp, q) {
      q = String(q || '').trim().toLowerCase();
      if (!q) return true;
      var hay = employeeSearchHay_(emp);
      if (hay.indexOf(q) >= 0) return true;
      var terms = q.split(/\s+/).filter(Boolean);
      if (terms.length <= 1) return false;
      for (var i = 0; i < terms.length; i++) {
        if (hay.indexOf(terms[i]) < 0) return false;
      }
      return true;
    }

    function fmtWhen(v) {
      if (!v) return '—';
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function fmtPeriod(year, month) {
      var name = MONTHS[Number(month) - 1] || String(month);
      return name + ' ' + year;
    }

    function statusKey(status) {
      return String(status || '').toUpperCase();
    }

    function fmtMoney(n) {
      var x = Number(n);
      if (!isFinite(x)) return '—';
      return x.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function hrStepIndex(st) {
      if (st === 'LOCKED') return 3;
      if (st === 'CALCULATED' || st === 'UNDER_REVIEW' || st === 'APPROVED') return 2;
      return 0;
    }

    function hrPhaseStepper(detail) {
      var steps = ['Prepare', 'Calculate', 'Review', 'Finalize'];
      var st = detail && detail.run ? statusKey(detail.run.status) : '';
      var idx = hrStepIndex(st);
      return '<div class="stepper" aria-label="Payroll workflow">' + steps.map(function (label, i) {
        var cls = 'step';
        if (i < idx) cls += ' done';
        if (i === idx) cls += ' current';
        return '<span class="' + cls + '">' + escapeHtml(label) + '</span>';
      }).join('') + '</div>';
    }

    function uiPhaseDisplay_(detail) {
      if (detail && detail.uiPhaseLabel) return detail.uiPhaseLabel;
      if (!detail || !detail.run) return 'Prepare';
      var st = statusKey(detail.run.status);
      if (st === 'LOCKED') return 'Finalized';
      if (st === 'DRAFT') return 'Prepare';
      return 'Review';
    }

    function exceptionMap_(detail) {
      var map = {};
      (detail.exceptions || []).forEach(function (e) {
        map[e.employee_id] = e;
      });
      return map;
    }

    function exceptionMessagesForRow_(detail, row) {
      var empId = row.employee && row.employee.employee_id;
      var exc = empId ? exceptionMap_(detail)[empId] : null;
      if (exc && exc.messages && exc.messages.length) return exc.messages.join('; ');
      if (exc && exc.flags && exc.flags.length) return exc.flags.join('; ');
      var warnings = row.warnings || [];
      if (warnings.indexOf('LOP_MISMATCH') >= 0) return 'LOP days differ from approved leave';
      if (warnings.indexOf('DAYS_INCONSISTENT') >= 0) return 'Paid days and LOP do not match working days';
      return '';
    }

    function statusLabel(status) {
      var s = statusKey(status);
      if (s === 'UNDER_REVIEW') return 'In review';
      if (s === 'CALCULATED') return 'Calculated';
      if (s === 'APPROVED') return 'Approved';
      if (s === 'LOCKED') return 'Locked';
      if (s === 'DRAFT') return 'Draft';
      return s || '—';
    }

    function badgePayroll(status) {
      var s = statusKey(status);
      var cls = 'badge status-badge badge-' + s.toLowerCase();
      return '<span class="' + cls + '">' + escapeHtml(statusLabel(s)) + '</span>';
    }

    function stepper(status) {
      var steps = [
        { key: 'DRAFT', label: 'Draft' },
        { key: 'CALCULATED', label: 'Calculate' },
        { key: 'UNDER_REVIEW', label: 'Review' },
        { key: 'APPROVED', label: 'Approve' },
        { key: 'LOCKED', label: 'Lock' }
      ];
      var idx = -1;
      var s = statusKey(status);
      for (var i = 0; i < steps.length; i++) {
        if (steps[i].key === s) idx = i;
      }
      return '<div class="stepper" aria-label="Payroll workflow">' + steps.map(function (st, i) {
        var cls = 'step';
        if (i < idx) cls += ' done';
        if (i === idx) cls += ' current';
        return '<span class="' + cls + '">' + escapeHtml(st.label) + '</span>';
      }).join('') + '</div>';
    }

    function downloadBlob(file) {
      var binary = atob(file.base64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      var blob = new Blob([bytes], { type: file.mimeType || 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = file.fileName || file.title || 'payslip.html';
      a.click();
      URL.revokeObjectURL(url);
    }

    function paintErr(el, message, retry) {
      if (App.paintSectionError) App.paintSectionError(el, message, retry);
      else if (el) el.innerHTML = '<div class="alert alert-danger">' + escapeHtml(message || 'Failed') + '</div>';
    }

    function skRows(cols, rows) {
      return App.skeletonTableRows ? App.skeletonTableRows(cols, rows) : '';
    }

    function spinner(label) {
      return App.sectionSkeleton
        ? App.sectionSkeleton({ label: label || 'Loading' })
        : (App.sectionSpinner ? App.sectionSpinner(label) : '<div class="hrms-loading-block" aria-busy="true"><div class="skeleton skeleton-line w80" aria-hidden="true"></div></div>');
    }

    function setButtonLoading(btn, loadingLabel) {
      if (!btn) return false;
      if (App.isButtonLoading && App.isButtonLoading(btn)) return false;
      if (App.setButtonLoading) return App.setButtonLoading(btn, loadingLabel);
      if (!btn.getAttribute('data-prev-html')) btn.setAttribute('data-prev-html', btn.innerHTML);
      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.innerHTML = '<span class="spinner-sm" aria-hidden="true"></span> ' + escapeHtml(loadingLabel || 'Working…');
      return true;
    }

    function restoreButton(btn) {
      if (!btn) return;
      try {
        if (App.restoreButton) {
          App.restoreButton(btn);
          return;
        }
        var prev = btn.getAttribute('data-prev-html');
        if (prev != null) btn.innerHTML = prev;
        btn.removeAttribute('data-prev-html');
        btn.disabled = false;
        btn.classList.remove('is-loading');
      } catch (e) {
        try { btn.disabled = false; } catch (e2) {}
      }
    }

    function rpc(fnName, args, btn, loadingText, feedback) {
      var opts = { loadingText: loadingText || 'Working…' };
      if (btn) opts.button = btn;
      if (feedback) opts.feedback = feedback;
      return callServer.apply(null, [fnName].concat(args || []).concat([opts]));
    }

    function confirmModal(opts) {
      opts = opts || {};
      return new Promise(function (resolve) {
        var wrap = document.createElement('div');
        wrap.className = 'modal-backdrop';
        var bodyContent = opts.htmlBody
          ? opts.htmlBody
          : '<p>' + escapeHtml(opts.body || 'Are you sure?') + '</p>';
        wrap.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' +
          '<h3>' + escapeHtml(opts.title || 'Confirm') + '</h3>' +
          bodyContent +
          '<div class="modal-actions">' +
          '<button type="button" class="btn btn-secondary" id="payroll-modal-cancel">Cancel</button>' +
          '<button type="button" class="btn ' + (opts.danger ? 'btn-danger-solid' : 'btn-primary') + '" id="payroll-modal-ok">' +
          escapeHtml(opts.okLabel || 'Confirm') + '</button></div></div>';
        document.body.appendChild(wrap);
        function close(ok) {
          wrap.remove();
          resolve(!!ok);
        }
        wrap.querySelector('#payroll-modal-cancel').addEventListener('click', function () { close(false); });
        wrap.querySelector('#payroll-modal-ok').addEventListener('click', function () { close(true); });
        wrap.addEventListener('click', function (ev) { if (ev.target === wrap) close(false); });
      });
    }

    function monthOptions(selected) {
      return MONTHS.map(function (name, i) {
        var v = i + 1;
        return '<option value="' + v + '"' + (Number(selected) === v ? ' selected' : '') + '>' +
          escapeHtml(name) + '</option>';
      }).join('');
    }

    function kpiCard(label, value, hint) {
      return '<div class="card kpi-card"><div class="kpi-label">' + escapeHtml(label) + '</div>' +
        '<div class="kpi-value">' + value + '</div>' +
        (hint ? '<div class="kpi-hint">' + escapeHtml(hint) + '</div>' : '') + '</div>';
    }

    function summaryKpis(summary, status) {
      summary = summary || {};
      var has = !!summary.has_totals;
      var st = statusKey(status);
      return '<div class="kpi-row">' +
        kpiCard('Employees', String(summary.employee_count || 0),
          (summary.calculated_count || 0) + ' calculated' +
          (summary.skipped_count ? ', ' + summary.skipped_count + ' skipped' : '')) +
        kpiCard('Gross', has ? fmtMoney(summary.gross_earnings) : '—', st === 'DRAFT' ? 'After calculate' : '') +
        kpiCard('Deductions', has ? fmtMoney(summary.total_deductions) : '—', '') +
        kpiCard('Net pay', has ? fmtMoney(summary.net_pay) : '—', '') +
        kpiCard('LOP impact', (summary.lop_days || 0) + ' days',
          (summary.lop_employees || 0) + ' employee' + ((summary.lop_employees || 0) === 1 ? '' : 's') +
          (summary.lop_mismatch_count ? ' · ' + summary.lop_mismatch_count + ' differ from leave' : '')) +
        '</div>';
    }

    function displayLockBlocks(detail, status) {
      var blocks = (detail && detail.lockBlocks) || [];
      var st = statusKey(status);
      if (!blocks.length) return '';
      if (st === 'DRAFT' && blocks.length === 1 &&
          (blocks[0] === 'No calculated records' || blocks[0] === 'Payroll has not been calculated yet.')) return '';
      return '<div class="alert alert-danger">Cannot approve or lock until these are resolved: ' +
        escapeHtml(blocks.join('; ')) + '</div>';
    }

    function hasApproveLockBlocks(detail) {
      if (detail && detail.finalizeBlockers && detail.finalizeBlockers.length) return true;
      var blocks = (detail && detail.lockBlocks) || [];
      if (!blocks.length) return false;
      var st = detail.run ? statusKey(detail.run.status) : '';
      if (st === 'DRAFT' && blocks.length === 1 &&
          (blocks[0] === 'No calculated records' || blocks[0] === 'Payroll has not been calculated yet.')) return false;
      return true;
    }

    function runsForPeriod(runs, year, month) {
      return (runs || []).filter(function (r) {
        return Number(r.period_year) === Number(year) && Number(r.period_month) === Number(month);
      });
    }

    function latestRunForPeriod(runs, year, month) {
      var list = runsForPeriod(runs, year, month);
      if (!list.length) return null;
      var open = null;
      var locked = null;
      list.forEach(function (r) {
        if (statusKey(r.status) !== 'LOCKED') open = r;
        else if (!locked) locked = r;
      });
      return open || locked;
    }

    function renderPayrollHome(params) {
      params = params || {};
      var page = pageEl();
      if (!page) return;
      var now = new Date();
      if (params.year) homeState.year = Number(params.year);
      if (params.month) homeState.month = Number(params.month);
      if (params.openSalaryStructure) homeState.salaryStructureOpen = true;
      var year = homeState.year || now.getFullYear();
      var month = homeState.month || (now.getMonth() + 1);
      homeState.year = year;
      homeState.month = month;
      var seq = App.getState().navSeq;
      var cachedDetail = payrollState.detail;
      if (App.consumeModuleViewRestore && App.consumeModuleViewRestore('payroll') &&
          cachedDetail && cachedDetail.run &&
          Number(cachedDetail.run.period_year) === year &&
          Number(cachedDetail.run.period_month) === month) {
        paintUnifiedPayroll_(page, seq, cachedDetail);
        return;
      }
      if (!(App.isModuleRefresh && App.isModuleRefresh('payroll') && homeState.runs && homeState.runs.length)) {
        page.innerHTML = '<div class="payroll-page"><div class="page-header"><h2>Payroll</h2>' +
          '<p class="page-lede">Select a month, enter payroll data, calculate, review, and finalize.</p></div>' +
          spinner('Loading payroll…') + '</div>';
      }

      callServer('apiListPayrollRuns').then(function (runs) {
        if (!stillOnPayrollModule_(seq)) return;
        homeState.runs = runs || [];
        var targetRun = null;
        if (params.runId) {
          targetRun = (runs || []).filter(function (r) { return r.payroll_run_id === params.runId; })[0];
          if (targetRun) {
            homeState.year = Number(targetRun.period_year);
            homeState.month = Number(targetRun.period_month);
          }
        }
        if (!targetRun) targetRun = latestRunForPeriod(runs, homeState.year, homeState.month);
        if (!targetRun) {
          if (App.markModuleViewLoaded) App.markModuleViewLoaded('payroll');
          paintUnifiedPayroll_(page, seq, null);
          return;
        }
        return callServer('apiGetPayrollRun', targetRun.payroll_run_id).then(function (detail) {
          if (!stillOnPayrollModule_(seq)) return;
          payrollState.detail = detail;
          homeState.overview = detail;
          if (App.markModuleViewLoaded) App.markModuleViewLoaded('payroll');
          paintUnifiedPayroll_(page, seq, detail);
          prefetchCompEmployees_(seq);
        });
      }).catch(function (err) {
        if (!stillOnPayrollModule_(seq)) return;
        if (App.finishModuleRefresh) App.finishModuleRefresh(true);
        paintErr(page, err.message || 'Failed to load payroll', function () { renderPayrollHome(params); });
      });
    }

    function renderPayrollRun(params) {
      renderPayrollHome({ runId: params && (params.runId || params) });
    }

    function renderCompensation() {
      renderPayrollHome({ openSalaryStructure: true });
    }

    function paintUnifiedPayroll_(page, seq, detail) {
      var year = homeState.year;
      var month = homeState.month;
      var runs = homeState.runs || [];
      var periodRuns = runsForPeriod(runs, year, month);
      var openRun = periodRuns.filter(function (r) { return statusKey(r.status) !== 'LOCKED'; })[0];
      var lockedRun = periodRuns.filter(function (r) { return statusKey(r.status) === 'LOCKED'; })[0];
      var currentRun = detail && detail.run ? detail.run : (openRun || lockedRun || null);
      var st = currentRun ? statusKey(currentRun.status) : '';
      var editable = st === 'DRAFT' || st === 'CALCULATED';
      var summary = detail && detail.summary ? detail.summary : {};
      var phaseLabel = uiPhaseDisplay_(detail);

      var html = '<div class="payroll-page">';
      var homeFlash = consumeFlash ? (consumeFlash('payroll') || consumeFlash('payroll-run')) : null;
      if (flashBannerHtml && homeFlash) html += flashBannerHtml(homeFlash);
      html += '<div class="page-header"><h2>Payroll — ' + escapeHtml(fmtPeriod(year, month)) +
        (currentRun ? ' <span class="phase-chip">' + escapeHtml(phaseLabel) + '</span>' : '') + '</h2>' +
        '<p class="page-lede">Enter days and amounts, calculate on the server, review exceptions, then finalize and generate payslips.</p></div>';

      if (detail) html += hrPhaseStepper(detail);

      html += '<div class="kpi-row">' +
        kpiCard('Employees', String(summary.employee_count || 0),
          detail ? ((summary.calculated_count || 0) + ' calculated' +
            (summary.skipped_count ? ', ' + summary.skipped_count + ' skipped' : '')) : '—') +
        kpiCard('Gross', summary.has_totals ? fmtMoneyInr(summary.gross_earnings) : '—', st === 'DRAFT' ? 'After calculate' : '') +
        kpiCard('Deductions', summary.has_totals ? fmtMoneyInr(summary.total_deductions) : '—', '') +
        kpiCard('Net pay', summary.has_totals ? fmtMoneyInr(summary.net_pay) : '—', '') +
        kpiCard('LOP impact', detail ? ((summary.lop_days || 0) + ' days') : '—',
          detail ? ((summary.lop_employees || 0) + ' employee' + ((summary.lop_employees || 0) === 1 ? '' : 's')) : '') +
        '</div>';

      html += '<div class="card"><h2>Payroll period</h2>' +
        '<div class="period-selects">' +
        '<label class="form-label" style="margin:0">Month <select class="form-select" id="pr-month" style="max-width:180px">' + monthOptions(month) + '</select></label>' +
        '<label class="form-label" style="margin:0">Year <input class="form-input narrow" id="pr-year" type="number" min="2000" max="2100" value="' + escapeHtml(year) + '"></label>' +
        '</div><div id="pr-home-feedback" class="action-feedback hidden" role="status"></div></div>';

      html += paintCompensationBulkCard_();

      if (!currentRun) {
        html += paintAttendanceBulkSection_(null, false, false);
        html += '<div class="card"><h2>Get started</h2>' +
          '<p class="page-lede">No payroll exists for ' + escapeHtml(fmtPeriod(year, month)) + ' yet.</p>' +
          '<div class="primary-next"><button type="button" class="btn btn-primary" id="btn-create-run">Start payroll for ' +
          escapeHtml(fmtPeriod(year, month)) + '</button></div></div>';
      } else if (detail) {
        html += paintAttendanceBulkSection_(currentRun.payroll_run_id, editable, true);
        html += paintPayrollDataSection_(detail, editable);
        html += paintCalculateSection_(detail, editable, st);
        html += paintPayrollCheck_(detail);
        html += paintSalaryStructureCollapsible_();
        html += paintReviewSection_(detail, st);
        html += paintFinalizeSection_(detail, st);
        html += paintPayslipsCard_(detail);
      } else {
        html += paintAttendanceBulkSection_(currentRun.payroll_run_id, editable, true);
        html += '<div class="card"><p class="page-lede">Loading payroll data…</p></div>';
      }

      html += paintPreviousPayrolls_(runs, year, month);
      if (detail && currentRun) html += paintAdvancedSection_(detail, editable, st);
      html += '</div>';

      page.innerHTML = html;
      bindUnifiedPayroll_(page, seq, detail, currentRun, openRun, lockedRun);
      bindPayrollFixActions_(page);
      if (homeState.salaryStructureOpen) ensureCompEmployeesLoaded_(page, seq);
      else prefetchCompEmployees_(seq);
    }

    function paintCompensationBulkCard_() {
      var previewHtml = compBulkState.preview ? paintCompBulkPreview_(compBulkState.preview) : '';
      return '<div class="card bulk-upload-card" id="comp-bulk-card"><h2>Bulk upload salary structures</h2>' +
        '<p class="page-lede">Set up or update salary structures in bulk. All component columns are required; empty numeric cells use 0.</p>' +
        '<ol class="bulk-steps"><li>Download Excel or CSV template</li><li>Choose file</li><li>Validate upload</li><li>Confirm import</li></ol>' +
        '<div class="primary-next" style="flex-wrap:wrap">' +
        '<button type="button" class="btn btn-secondary" id="btn-comp-dl-template">Download Excel template</button>' +
        '<button type="button" class="btn btn-secondary" id="btn-comp-dl-csv">Download CSV template</button>' +
        '<label class="btn btn-secondary" for="comp-bulk-file">Choose Excel/CSV file</label>' +
        '<input type="file" id="comp-bulk-file" class="hidden-file" accept=".xlsx,.xls,.csv">' +
        '<button type="button" class="btn btn-primary" id="btn-comp-validate" disabled>Validate upload</button>' +
        '</div>' +
        '<p id="comp-bulk-file-name" class="hint">No file selected.</p>' +
        '<div id="comp-bulk-preview">' + previewHtml + '</div>' +
        '<div id="comp-bulk-feedback" class="action-feedback hidden" role="status"></div></div>';
    }

    function paintAttendanceBulkSection_(runId, editable, hasRun) {
      var html = '<div class="card bulk-upload-card" id="attendance-bulk-card"><h2>Attendance bulk upload</h2>' +
        '<p class="page-lede">Upload working days plus days_present, days_absent, and leave_days. Payroll calculates paid_days and lop_days automatically.</p>' +
        '<ol class="bulk-steps"><li>Download template (all active employees with ID, name, email — re-download after adding staff)</li><li>Choose Excel/CSV file</li><li>Review validation results</li><li>Confirm import</li></ol>';
      html += '<div class="primary-next" style="flex-wrap:wrap">';
      if (hasRun && runId) {
        html += '<button type="button" class="btn btn-secondary" id="btn-dl-template">Download attendance template</button>';
      }
      if (editable && hasRun && runId) {
        html += '<label class="btn btn-primary" for="pr-bulk-file">Choose file &amp; validate</label>' +
          '<input type="file" id="pr-bulk-file" class="hidden-file" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">';
      } else if (!hasRun || !runId) {
        html += '<span class="hint">Start payroll for this month to enable attendance upload.</span>';
      } else {
        html += '<span class="hint">Attendance upload is available while payroll is Draft or Calculated. Return to draft if needed.</span>';
      }
      html += '</div>';
      if (editable && hasRun) {
        html += '<p id="pr-bulk-file-name" class="hint">No file selected.</p>';
      }
      html += '<div id="pr-upload-preview">' + paintBulkPreview_(bulkState.preview) + '</div>' +
        '<div id="pr-upload-feedback" class="action-feedback hidden" role="status"></div></div>';
      return html;
    }

    function paintPayrollDataSection_(detail, editable) {
      return '<div class="card" id="payroll-data-card"><h2>Payroll data — manual entry</h2>' +
        '<p class="page-lede">Or edit working days, paid days, and LOP directly in the table below.</p>' +
        paintEmployeeTable_(detail, editable) + '</div>';
    }

    function paintBulkPreview_(preview) {
      if (!preview) return '';
      var html = '<div class="upload-preview"><h3>Upload preview</h3>' +
        '<p><strong>' + preview.employeesFound + '</strong> employees found · ' +
        '<strong>' + preview.readyCount + '</strong> ready · ' +
        '<strong>' + preview.attentionCount + '</strong> need attention</p>';
      if (preview.problemsByEmployee && preview.problemsByEmployee.length) {
        html += '<div class="alert alert-warning"><strong>Needs attention</strong><ul class="problem-list">';
        preview.problemsByEmployee.forEach(function (p) {
          html += '<li><strong>' + escapeHtml(p.display_name || p.employee_id) + '</strong>: ' +
            escapeHtml((p.messages || []).join('; ')) + '</li>';
        });
        html += '</ul></div>';
      }
      if (preview.readyCount > 0) {
        html += '<div class="primary-next"><button type="button" class="btn btn-primary" id="btn-commit-upload">Confirm import (' +
          preview.readyCount + ' employees)</button>' +
          '<button type="button" class="btn btn-secondary" id="btn-cancel-upload">Cancel</button></div>';
      }
      html += '</div>';
      return html;
    }

    function paintCalculateSection_(detail, editable, st) {
      if (!detail) return '';
      var html = '<div class="card" id="calculate-card"><h2>Calculate payroll</h2>' +
        '<p class="page-lede">Server calculates basic, allowances, deductions, and net pay from salary structures and days entered.</p>' +
        '<div class="primary-next">';
      if (st === 'DRAFT' || st === 'CALCULATED') {
        html += '<button type="button" class="btn btn-primary" id="btn-calc">' +
          (st === 'CALCULATED' ? 'Recalculate payroll' : 'Calculate payroll') + '</button>';
      }
      if (editable) {
        html += '<button type="button" class="btn btn-secondary" id="btn-save-inputs">Save days &amp; extras</button>';
        html += '<span class="unsaved-hint' + (payrollState.dirty ? '' : ' hidden') + '" id="pr-unsaved">Unsaved changes</span>';
      }
      html += '</div><div id="pr-action-feedback" class="action-feedback hidden" role="status"></div></div>';
      return html;
    }

    function paintPayrollCheck_(detail) {
      if (!detail) return '';
      var es = detail.exceptionSummary || {};
      var ready = es.ready_count != null ? es.ready_count : 0;
      var attention = es.attention_count != null ? es.attention_count : (detail.exceptions || []).length;
      var total = es.total_employees != null ? es.total_employees : (detail.rows || []).length;
      var html = '<div class="card" id="payroll-check-card"><h2>Payroll check</h2>' +
        '<p class="page-lede">Review who is ready to pay and who needs attention before finalizing.</p>' +
        '<div class="check-grid">' +
        '<div class="check-box ready"><div class="check-count">' + ready + '</div><div>Ready to pay</div></div>' +
        '<div class="check-box attention"><div class="check-count">' + attention + '</div><div>Need attention</div></div>' +
        '</div><p class="hint">' + total + ' employees in this payroll</p>';
      var problems = (es.exceptions && es.exceptions.length) ? es.exceptions : (detail.exceptions || []);
      if (problems.length) {
        html += '<div class="alert alert-warning" style="margin-top:12px"><strong>Issues to resolve</strong><ul class="problem-list">';
        problems.forEach(function (p) {
          var msgs = p.messages || p.flags || [];
          html += '<li><strong>' + escapeHtml(p.display_name || p.employee_id) + '</strong>: ' +
            escapeHtml(Array.isArray(msgs) ? msgs.join('; ') : String(msgs)) + '</li>';
        });
        html += '</ul></div>';
      }
      if (detail.lockBlocks && detail.lockBlocks.length) {
        var st = detail.run ? statusKey(detail.run.status) : '';
        var blocks = detail.lockBlocks;
        if (!(st === 'DRAFT' && blocks.length === 1 && blocks[0] === 'Payroll has not been calculated yet.')) {
          html += '<div class="alert alert-danger" style="margin-top:12px"><strong>Before finalizing</strong><ul class="problem-list">';
          if (detail.finalizeBlockers && detail.finalizeBlockers.length) {
            detail.finalizeBlockers.forEach(function (block) {
              html += '<li><strong>' + escapeHtml(block.message) + '</strong>';
              (block.employees || []).forEach(function (emp) {
                html += '<div class="hint" style="margin-top:4px">' + escapeHtml(emp.display_name || emp.employee_id) +
                  ' <span class="mono">(' + escapeHtml(emp.employee_id) + ')</span>';
                if (block.code === 'MISSING_STRUCTURE') {
                  html += ' <button type="button" class="btn btn-secondary btn-sm js-fix-structure" data-id="' +
                    escapeHtml(emp.employee_id) + '">Set up salary</button>';
                } else if (block.code === 'MISSING_BANK') {
                  html += ' <button type="button" class="btn btn-secondary btn-sm js-fix-bank" data-id="' +
                    escapeHtml(emp.employee_id) + '">Add bank details</button>';
                } else if (block.code === 'MISSING_PAN') {
                  html += ' <button type="button" class="btn btn-secondary btn-sm js-fix-pan" data-id="' +
                    escapeHtml(emp.employee_id) + '">Add PAN</button>';
                }
                html += '</div>';
              });
              html += '</li>';
            });
          } else {
            html += '<li>' + escapeHtml(blocks.join('; ')) + '</li>';
          }
          html += '</ul><p class="hint">After fixing employee data or salary structure, click <strong>Recalculate payroll</strong>. ' +
            'Salary structure <em>effective from</em> must be on or before the payroll month end.</p></div>';
        }
      }
      html += '</div>';
      return html;
    }

    function paintSalaryStructureCollapsible_() {
      var open = homeState.salaryStructureOpen ? ' open' : '';
      var mountInner = open ? spinner('Loading employees…') : '';
      return '<details class="card section-details" id="salary-structure-details"' + open + '>' +
        '<summary>Salary structure</summary>' +
        '<p class="page-lede">Search an employee to view or edit their salary structure. Revisions create history.</p>' +
        '<div id="salary-structure-mount">' + mountInner + '</div></details>';
    }

    function paintReviewSection_(detail, st) {
      if (!detail || st === 'DRAFT') return '';
      var html = '<div class="card"><h2>Review summary</h2>';
      if (detail.summary && detail.summary.skipped_count && st !== 'DRAFT') {
        html += '<div class="alert alert-warning">' + detail.summary.skipped_count +
          ' employee(s) were skipped because working days must be greater than 0.</div>';
      }
      if (detail.summary && detail.summary.lop_mismatch_count) {
        html += '<div class="alert alert-warning">LOP days differ from approved leave for ' +
          detail.summary.lop_mismatch_count + ' employee(s).</div>';
      }
      if (detail.departmentTotals && detail.departmentTotals.length) {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Department</th><th>Count</th><th class="num">Gross</th><th class="num">Deductions</th><th class="num">Net</th></tr></thead><tbody>';
        detail.departmentTotals.forEach(function (t) {
          html += '<tr><td>' + escapeHtml(t.department) + '</td><td>' + t.count + '</td><td class="num">' + fmtMoneyInr(t.gross_earnings) +
            '</td><td class="num">' + fmtMoneyInr(t.total_deductions) + '</td><td class="num">' + fmtMoneyInr(t.net_pay) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      } else {
        html += '<p class="hint">Department breakdown appears after calculate.</p>';
      }
      html += '</div>';
      return html;
    }

    function paintFinalizeSection_(detail, st) {
      if (!detail || st === 'LOCKED') return '';
      var blocks = hasApproveLockBlocks(detail);
      var disabled = (st === 'DRAFT' || blocks) ? ' disabled' : '';
      var hint = st === 'DRAFT' ? 'Calculate payroll before finalizing.' :
        (blocks ? 'Resolve all issues in Payroll check first.' : 'Finalizing locks amounts permanently.');
      return '<div class="card" id="finalize-card"><h2>Finalize payroll</h2>' +
        '<p class="page-lede">' + escapeHtml(hint) + '</p>' +
        '<div class="primary-next"><button type="button" class="btn btn-primary" id="btn-finalize"' + disabled +
        '>Finalize payroll</button></div></div>';
    }

    function paintPreviousPayrolls_(runs, currentYear, currentMonth) {
      var others = (runs || []).filter(function (r) {
        return statusKey(r.status) === 'LOCKED' &&
          (Number(r.period_year) !== Number(currentYear) || Number(r.period_month) !== Number(currentMonth));
      });
      var openAttr = homeState.prevPayrollsOpen ? ' open' : '';
      var html = '<details class="card section-details" id="prev-payrolls"' + openAttr + '><summary>Previous payrolls</summary>';
      if (!others.length) {
        html += '<div class="empty-state"><p>No other finalized payrolls yet.</p></div>';
      } else {
        html += '<div class="table-wrap"><table class="data-table"><thead><tr><th>Month</th><th>Status</th><th></th></tr></thead><tbody>';
        others.forEach(function (r) {
          html += '<tr><td>' + escapeHtml(fmtPeriod(r.period_year, r.period_month)) + '</td>' +
            '<td><span class="phase-chip">Finalized</span></td>' +
            '<td><button type="button" class="btn btn-secondary btn-sm js-view-period" data-year="' + r.period_year +
            '" data-month="' + r.period_month + '">View</button></td></tr>';
        });
        html += '</tbody></table></div>';
      }
      html += '</details>';
      return html;
    }

    function paintAdvancedSection_(detail, editable, st) {
      return '<details class="card section-details" id="payroll-advanced-details">' +
        '<summary>More actions</summary>' +
        '<div class="advanced-actions" id="payroll-advanced">' +
        (editable ? '<button type="button" class="btn btn-secondary" id="btn-refresh-lop">Refresh leave LOP</button> ' +
          '<button type="button" class="btn btn-secondary" id="btn-apply-lop">Apply leave LOP to days</button> ' : '') +
        ((st === 'UNDER_REVIEW' || st === 'CALCULATED' || (st === 'APPROVED' && isAdmin())) ?
          '<button type="button" class="btn btn-secondary" id="btn-draft">Return to draft</button> ' : '') +
        (st === 'LOCKED' ? '<button type="button" class="btn btn-secondary" id="btn-correct">Create correction run</button> ' : '') +
        '<p class="hint" style="margin-top:8px">Advanced tools for admins. Leave LOP is a suggestion from approved leave.</p>' +
        '</div></details>';
    }

    function openSalaryStructureForEmployee_(page, employeeId) {
      employeeId = String(employeeId || '').trim();
      if (!employeeId) return;
      compState.employeeId = employeeId;
      compState._editorLoadedFor = '';
      compState.onlyMissing = false;
      compState.empQuery = '';
      homeState.salaryStructureOpen = true;
      var details = $('salary-structure-details');
      if (details) details.open = true;
      ensureCompEmployeesLoaded_(page, App.getState().navSeq);
      if (details && details.scrollIntoView) {
        try { details.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (ignore) {}
      }
    }

    function bindPayrollFixActions_(page) {
      page.querySelectorAll('.js-fix-structure').forEach(function (btn) {
        btn.addEventListener('click', function () {
          openSalaryStructureForEmployee_(page, this.getAttribute('data-id'));
        });
      });
      page.querySelectorAll('.js-fix-bank').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var employeeId = this.getAttribute('data-id');
          if (App.navigate) App.navigate('employee-profile', { employeeId: employeeId, tab: 'payroll' });
        });
      });
      page.querySelectorAll('.js-fix-pan').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var employeeId = this.getAttribute('data-id');
          if (App.navigate) App.navigate('employee-profile', { employeeId: employeeId, tab: 'personal' });
        });
      });
    }

    function prefetchCompEmployees_(seq) {
      if (compState._loaded && compState.employees.length) return;
      callServer('apiListCompensationEmployees', { background: true }).then(function (emps) {
        if (!stillOnPayrollModule_(seq)) return;
        compState.employees = emps || [];
        compState._loaded = true;
        if (homeState.salaryStructureOpen) {
          var page = document.querySelector('.payroll-page');
          if (page) paintSalaryStructureMount_(page);
        }
      }).catch(function () { /* Prefetch is optional; section load will retry. */ });
    }

    function ensureCompEmployeesLoaded_(page, seq) {
      var mount = $('salary-structure-mount');
      if (!mount) return;
      if (compState._loaded && compState.employees.length) {
        paintSalaryStructureMount_(page);
        return;
      }
      mount.innerHTML = spinner('Loading employees…');
      callServer('apiListCompensationEmployees').then(function (emps) {
        if (!stillOnPayrollModule_(seq)) return;
        compState.employees = emps || [];
        compState._loaded = true;
        paintSalaryStructureMount_(page);
      }).catch(function (err) {
        if (mount) {
          mount.innerHTML = '<div class="alert alert-danger">' +
            escapeHtml((err && err.message) || 'Failed to load employees for salary structure.') +
            '</div>';
        }
      });
    }

    function paintSalaryStructureMount_(page) {
      var mount = $('salary-structure-mount');
      if (!mount) return;
      var emps = compState.employees || [];
      var q = String(compState.empQuery || '').toLowerCase();
      var onlyActive = compState.onlyActive !== false;
      var onlyMissing = !!compState.onlyMissing;
      var filtered = emps.filter(function (e) {
        if (onlyActive && String(e.status || '').toUpperCase() === 'INACTIVE') return false;
        if (onlyMissing && e.has_current_structure) return false;
        if (!matchesEmployeeSearch_(e, q)) return false;
        return true;
      });
      var selected = compState.employeeId;
      if (selected && !filtered.some(function (e) { return e.employee_id === selected; })) {
        selected = filtered.length ? filtered[0].employee_id : '';
      }
      if (!selected && filtered.length) selected = filtered[0].employee_id;
      var opts = filtered.map(function (e) {
        var miss = e.has_current_structure ? '' : ' — no structure';
        return '<option value="' + escapeHtml(e.employee_id) + '"' + (e.employee_id === selected ? ' selected' : '') + '>' +
          escapeHtml(e.employee_id + ' — ' + e.display_name) + escapeHtml(miss) + '</option>';
      }).join('');
      mount.innerHTML = '<p class="hint" style="margin-bottom:12px">For Excel/CSV import, use the <strong>Bulk upload salary structures</strong> card at the top of this page.</p>' +
        '<div class="page-toolbar"><div class="filters">' +
        '<label class="form-label" style="margin:0">Search <input class="form-input search-input" id="comp-search" placeholder="Name or ID" value="' + escapeHtml(compState.empQuery || '') + '"></label>' +
        '<label class="form-check"><input type="checkbox" id="comp-active"' + (onlyActive ? ' checked' : '') + '> Active only</label>' +
        '<label class="form-check"><input type="checkbox" id="comp-missing"' + (onlyMissing ? ' checked' : '') + '> Missing structure</label>' +
        '</div></div>' +
        (filtered.length
          ? ('<label class="form-label">Employee <select class="form-select" id="comp-emp" style="max-width:420px">' + opts + '</select></label>')
          : '<div class="empty-state"><p>No matching employees.</p></div>') +
        '<div id="comp-editor"></div>';
      if ($('comp-search')) $('comp-search').addEventListener('input', function () {
        compState.empQuery = this.value;
        paintSalaryStructureMount_(page);
        var el = $('comp-search');
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      if ($('comp-active')) $('comp-active').addEventListener('change', function () {
        compState.onlyActive = this.checked;
        paintSalaryStructureMount_(page);
      });
      if ($('comp-missing')) $('comp-missing').addEventListener('change', function () {
        compState.onlyMissing = this.checked;
        paintSalaryStructureMount_(page);
      });
      if ($('comp-emp')) $('comp-emp').addEventListener('change', function () {
        compState._editorLoadedFor = '';
        loadCompEditor_(this.value);
      });
      if (selected && selected !== compState._editorLoadedFor) {
        compState._editorLoadedFor = selected;
        loadCompEditor_(selected);
      }
    }

    function bindUnifiedPayroll_(page, seq, detail, currentRun, openRun, lockedRun) {
      function syncPeriodFromInputs() {
        var p = readPeriodInputs_();
        if (!p) return;
        if (p.year === homeState.year && p.month === homeState.month) return;
        homeState.year = p.year;
        homeState.month = p.month;
        homeState.overview = null;
        payrollState.detail = null;
        bulkState.preview = null;
        renderPayrollHome({ year: p.year, month: p.month });
      }
      if ($('pr-month')) $('pr-month').addEventListener('change', syncPeriodFromInputs);
      if ($('pr-year')) $('pr-year').addEventListener('change', syncPeriodFromInputs);

      var createBtn = $('btn-create-run');
      if (createBtn) createBtn.addEventListener('click', function () {
        var p = readPeriodInputs_();
        if (!p) return;
        if (!setButtonLoading(createBtn, 'Starting...')) return;
        rpc('apiCreatePayrollRun', [p.year, p.month, ''], createBtn, 'Starting...', $('pr-home-feedback'))
          .then(function (nextDetail) {
            invalidatePayrollHome_();
            payrollState.detail = nextDetail;
            if (setFlash) setFlash('Payroll started for ' + fmtPeriod(p.year, p.month), 'success', 'payroll');
            renderPayrollHome({ year: p.year, month: p.month, runId: nextDetail.run.payroll_run_id });
          })
          .catch(function () {});
      });

      var prevDetails = $('prev-payrolls');
      if (prevDetails) prevDetails.addEventListener('toggle', function () {
        homeState.prevPayrollsOpen = prevDetails.open;
      });
      var ssDetails = $('salary-structure-details');
      if (ssDetails) {
        ssDetails.addEventListener('toggle', function () {
          homeState.salaryStructureOpen = ssDetails.open;
          if (ssDetails.open) {
            var mount = $('salary-structure-mount');
            if (mount && !compState._loaded) mount.innerHTML = spinner('Loading employees…');
            ensureCompEmployeesLoaded_(page, seq);
          }
        });
        if (ssDetails.open) ensureCompEmployeesLoaded_(page, seq);
      }

      var viewers = page.querySelectorAll('.js-view-period');
      for (var vi = 0; vi < viewers.length; vi++) {
        viewers[vi].addEventListener('click', function () {
          var y = Number(this.getAttribute('data-year'));
          var m = Number(this.getAttribute('data-month'));
          refreshPayrollPage_({ year: y, month: m });
        });
      }

      bindCompBulkUpload_(page);
      if (currentRun) {
        var editableRun = statusKey(currentRun.status) === 'DRAFT' || statusKey(currentRun.status) === 'CALCULATED';
        bindBulkUpload_(currentRun.payroll_run_id, page, detail, editableRun);
      }
      if (detail && currentRun) {
        var editable = statusKey(currentRun.status) === 'DRAFT' || statusKey(currentRun.status) === 'CALCULATED';
        bindRunTable_(page, detail, editable);
        bindUnifiedActions_(currentRun.payroll_run_id, page, detail);
      }
    }

    function bindBulkUpload_(runId, page, detail, editable) {
      var dlBtn = $('btn-dl-template');
      if (dlBtn) dlBtn.addEventListener('click', function () {
        if (!setButtonLoading(dlBtn, 'Downloading...')) return;
        rpc('apiDownloadPayrollTemplate', [runId], dlBtn, 'Downloading...', $('pr-upload-feedback'))
          .then(function (file) {
            if (!file || !file.base64) {
              throw { message: 'Template file was empty. Check Apps Script Drive permissions.' };
            }
            downloadBlob(file);
            showToast('Attendance template downloaded (' + (file.fileName || 'file') + ').', 'success');
          })
          .catch(function (err) {
            showToast((err && err.message) || 'Download failed', 'error');
          })
          .then(function () { restoreButton(dlBtn); });
      });

      if (!editable) {
        bindBulkPreviewActions_(runId, page);
        return;
      }

      var fileInput = $('pr-bulk-file');
      if (fileInput) fileInput.addEventListener('change', function () {
        var file = fileInput.files && fileInput.files[0];
        fileInput.value = '';
        if (!file) return;
        var name = (file.name || '').toLowerCase();
        if (name.indexOf('.xlsx') < 0 && name.indexOf('.xls') < 0 && name.indexOf('.csv') < 0) {
          showToast('Upload an Excel (.xlsx) or CSV file.', 'error');
          return;
        }
        var nameEl = $('pr-bulk-file-name');
        if (nameEl) nameEl.textContent = 'Validating ' + file.name + '…';
        readFileBase64_(file).then(function (meta) {
          return rpc('apiValidatePayrollUpload', [runId, meta], null, '', $('pr-upload-feedback'));
        }).then(function (preview) {
          bulkState.preview = preview;
          if (nameEl) nameEl.textContent = file.name + ' — ' + preview.readyCount + ' ready, ' + preview.errorCount + ' errors';
          return callServer('apiGetPayrollRun', runId).then(function (nextDetail) {
            payrollState.detail = nextDetail;
            paintUnifiedPayroll_(page, App.getState().navSeq, nextDetail);
            bulkState.preview = preview;
            var mount = $('pr-upload-preview');
            if (mount) mount.innerHTML = paintBulkPreview_(preview);
            bindBulkPreviewActions_(runId, page);
          });
        }).catch(function (err) {
          if (nameEl) nameEl.textContent = file.name + ' — validation failed';
          showToast((err && err.message) || 'Validation failed', 'error');
        });
      });
      bindBulkPreviewActions_(runId, page);
    }

    function readFileBase64_(file) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = function () { reject(new Error('Could not read file.')); };
        reader.onload = function () {
          resolve({
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            base64: String(reader.result || '').split(',')[1] || ''
          });
        };
        reader.readAsDataURL(file);
      });
    }

    function paintCompBulkPreview_(preview) {
      if (!preview) return '';
      var html = '<div class="upload-preview"><p><strong>' + preview.validCount + '</strong> ready · ' +
        '<strong>' + preview.errorCount + '</strong> need attention</p>';
      if (preview.errors && preview.errors.length) {
        html += '<ul class="problem-list">';
        preview.errors.forEach(function (err) {
          var msgs = (err.messages || []).map(function (m) { return m.message || m; }).join('; ');
          html += '<li>Row ' + escapeHtml(String(err.rowNumber)) + ' (' + escapeHtml(err.employee_id || '') + '): ' +
            escapeHtml(msgs) + '</li>';
        });
        html += '</ul>';
      }
      if (preview.validCount > 0) {
        html += '<div class="primary-next"><button type="button" class="btn btn-primary" id="btn-comp-commit">Confirm import (' +
          preview.validCount + ')</button></div>';
      }
      html += '</div>';
      var el = $('comp-bulk-preview');
      if (el) {
        el.innerHTML = html;
        bindCompBulkCommit_(el);
      }
      return html;
    }

    function bindCompBulkCommit_(container) {
      var commitBtn = container ? container.querySelector('#btn-comp-commit') : $('btn-comp-commit');
      if (commitBtn) commitBtn.addEventListener('click', function () {
        if (!compBulkState.preview || !compBulkState.preview.uploadId) return;
        if (!setButtonLoading(commitBtn, 'Importing...')) return;
        rpc('apiCommitCompensationBulkUpload', [compBulkState.preview.uploadId], commitBtn, 'Importing...', $('comp-bulk-feedback'))
          .then(function (result) {
            compBulkState.preview = null;
            compBulkState.selectedFile = null;
            invalidateCompensation_();
            compState._loaded = false;
            showToast('Imported ' + (result.savedCount || 0) + ' salary structure(s).', 'success');
            ensureCompEmployeesLoaded_(document.querySelector('.payroll-page'), App.getState().navSeq);
          })
          .catch(function () { restoreButton(commitBtn); });
      });
    }

    function bindCompBulkUpload_(page) {
      var fileInput = $('comp-bulk-file');
      var validateBtn = $('btn-comp-validate');
      if (fileInput) fileInput.addEventListener('change', function () {
        compBulkState.selectedFile = fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
        if (validateBtn) validateBtn.disabled = !compBulkState.selectedFile;
        var nameEl = $('comp-bulk-file-name');
        if (nameEl) nameEl.textContent = compBulkState.selectedFile ? compBulkState.selectedFile.name : 'No file selected.';
        compBulkState.preview = null;
        var prev = $('comp-bulk-preview');
        if (prev) prev.innerHTML = '';
      });
      var dlBtn = $('btn-comp-dl-template');
      if (dlBtn) dlBtn.addEventListener('click', function () {
        rpc('apiDownloadCompensationBulkTemplate', [], dlBtn, 'Downloading...', $('comp-bulk-feedback'))
          .then(downloadBlob).catch(function (err) { showToast((err && err.message) || 'Download failed', 'error'); });
      });
      var dlCsv = $('btn-comp-dl-csv');
      if (dlCsv) dlCsv.addEventListener('click', function () {
        rpc('apiDownloadCompensationBulkCsvTemplate', [], dlCsv, 'Downloading...', $('comp-bulk-feedback'))
          .then(downloadBlob).catch(function (err) { showToast((err && err.message) || 'Download failed', 'error'); });
      });
      if (validateBtn) validateBtn.addEventListener('click', function () {
        if (!compBulkState.selectedFile) return;
        if (!setButtonLoading(validateBtn, 'Validating...')) return;
        readFileBase64_(compBulkState.selectedFile).then(function (meta) {
          return rpc('apiValidateCompensationBulkUpload', [meta], validateBtn, 'Validating...', $('comp-bulk-feedback'));
        }).then(function (preview) {
          compBulkState.preview = preview;
          paintCompBulkPreview_(preview);
        }).catch(function () { restoreButton(validateBtn); });
      });
    }

    function bindBulkPreviewActions_(runId, page) {
      var commitBtn = $('btn-commit-upload');
      if (commitBtn) commitBtn.addEventListener('click', function () {
        if (!bulkState.preview || !bulkState.preview.uploadId) return;
        if (!setButtonLoading(commitBtn, 'Importing...')) return;
        rpc('apiCommitPayrollUpload', [runId, bulkState.preview.uploadId], commitBtn, 'Importing...', $('pr-upload-feedback'))
          .then(function () {
            bulkState.preview = null;
            invalidatePayrollRunPeers_(runId);
            return callServer('apiGetPayrollRun', runId);
          })
          .then(function (nextDetail) {
            payrollState.detail = nextDetail;
            homeState.overview = nextDetail;
            paintUnifiedPayroll_(page, App.getState().navSeq, nextDetail);
            showToast('Imported payroll data.', 'success');
          })
          .catch(function (err) {
            restoreButton(commitBtn);
            showToast(err.message || 'Import failed', 'error');
          });
      });
      var cancelBtn = $('btn-cancel-upload');
      if (cancelBtn) cancelBtn.addEventListener('click', function () {
        bulkState.preview = null;
        var mount = $('pr-upload-preview');
        if (mount) mount.innerHTML = '';
      });
    }

    function buildFinalizeModalHtml_(detail) {
      var run = detail.run;
      var summary = detail.summary || {};
      var html = '<dl class="finalize-summary">' +
        '<dt>Month</dt><dd>' + escapeHtml(fmtPeriod(run.period_year, run.period_month)) + '</dd>' +
        '<dt>Employees</dt><dd>' + (summary.employee_count || 0) + '</dd>' +
        '<dt>Gross pay</dt><dd>' + fmtMoneyInr(summary.gross_earnings) + '</dd>' +
        '<dt>Deductions</dt><dd>' + fmtMoneyInr(summary.total_deductions) + '</dd>' +
        '<dt>Net pay</dt><dd>' + fmtMoneyInr(summary.net_pay) + '</dd></dl>';
      var problems = (detail.exceptionSummary && detail.exceptionSummary.exceptions) || detail.exceptions || [];
      var lockBlocks = detail.lockBlocks || [];
      if (problems.length || lockBlocks.length) {
        html += '<div class="alert alert-warning" style="margin-top:12px"><strong>Important exceptions</strong><ul class="problem-list">';
        lockBlocks.forEach(function (b) {
          html += '<li>' + escapeHtml(b) + '</li>';
        });
        problems.forEach(function (p) {
          var msgs = p.messages || p.flags || [];
          html += '<li><strong>' + escapeHtml(p.display_name || p.employee_id) + '</strong>: ' +
            escapeHtml(Array.isArray(msgs) ? msgs.join('; ') : String(msgs)) + '</li>';
        });
        html += '</ul></div>';
      }
      html += '<p style="margin-top:12px">Finalizing locks all amounts permanently. Generate payslips after finalizing.</p>';
      return html;
    }

    function bindUnifiedActions_(runId, page, detail) {
      function afterUpdate(nextDetail, message) {
        payrollState.detail = nextDetail;
        payrollState.dirty = false;
        payrollState.inputDraft = {};
        invalidatePayrollRunPeers_(runId);
        paintUnifiedPayroll_(page, App.getState().navSeq, nextDetail);
        if (message && setActionFeedback && $('pr-action-feedback')) {
          setActionFeedback($('pr-action-feedback'), message, 'success');
        } else if (message) {
          showToast(message, 'success');
        }
      }

      function saveIfNeeded() {
        var st = statusKey(detail.run.status);
        var editable = st === 'DRAFT' || st === 'CALCULATED';
        if (!editable) return Promise.resolve(detail);
        if (!clientValidateInputs_(page)) return Promise.reject({ message: 'Invalid payroll inputs.' });
        return callServer('apiSavePayrollInputs', runId, collectInputs_(page));
      }

      function runAction(btn, fnName, extra, successMsg, loadingText) {
        if (!setButtonLoading(btn, loadingText || 'Working…')) return Promise.resolve();
        var args = extra !== undefined ? [runId, extra] : [runId];
        return rpc(fnName, args, btn, loadingText || 'Working…', $('pr-action-feedback'))
          .then(function (next) { afterUpdate(next, successMsg); })
          .catch(function (err) {
            if (!(setActionFeedback && $('pr-action-feedback'))) {
              showToast(err.message || 'Failed', 'error');
            }
          });
      }

      var save = $('btn-save-inputs');
      if (save) save.addEventListener('click', function () {
        if (!clientValidateInputs_(page)) return;
        if (!setButtonLoading(save, 'Saving...')) return;
        rpc('apiSavePayrollInputs', [runId, collectInputs_(page)], save, 'Saving...', $('pr-action-feedback'))
          .then(function (next) { afterUpdate(next, 'Days and extras saved'); })
          .catch(function (err) {
            if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Save failed', 'error');
          });
      });

      var calc = $('btn-calc');
      if (calc) calc.addEventListener('click', function () {
        if (!setButtonLoading(calc, 'Calculating payroll...')) return;
        saveIfNeeded()
          .then(function () {
            return rpc('apiCalculatePayroll', [runId, {}], calc, 'Calculating payroll...', $('pr-action-feedback'));
          })
          .then(function (next) { afterUpdate(next, 'Payroll calculated.'); })
          .catch(function (err) {
            restoreButton(calc);
            if (setActionFeedback && $('pr-action-feedback')) {
              setActionFeedback($('pr-action-feedback'), err.message || 'Calculate failed', 'error');
            } else {
              showToast(err.message || 'Calculate failed', 'error');
            }
          });
      });

      var finalize = $('btn-finalize');
      if (finalize) finalize.addEventListener('click', function () {
        if (hasApproveLockBlocks(detail)) {
          showToast('Resolve all issues before finalizing.', 'error');
          return;
        }
        confirmModal({
          title: 'Finalize payroll?',
          htmlBody: buildFinalizeModalHtml_(detail),
          okLabel: 'Finalize payroll',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(finalize, 'Finalizing...')) return;
          rpc('apiFinalizePayroll', [runId], finalize, 'Finalizing...', $('pr-action-feedback'))
            .then(function (next) {
              invalidatePayslipViews_();
              afterUpdate(next, 'Payroll finalized.');
            })
            .catch(function (err) {
              if (!(setActionFeedback && $('pr-action-feedback'))) showToast(err.message || 'Finalize failed', 'error');
            });
        });
      });

      var draft = $('btn-draft');
      if (draft) draft.addEventListener('click', function () {
        confirmModal({
          title: 'Return to draft?',
          body: 'This unfreezes days and extras so you can edit and calculate again.',
          okLabel: 'Return to draft'
        }).then(function (ok) {
          if (!ok) return;
          runAction(draft, 'apiReturnPayrollDraft', undefined, 'Returned to draft', 'Updating...');
        });
      });

      var lop = $('btn-refresh-lop');
      if (lop) lop.addEventListener('click', function () {
        if (!setButtonLoading(lop, 'Refreshing...')) return;
        saveIfNeeded()
          .then(function () {
            return rpc('apiRefreshPayrollLop', [runId], lop, 'Refreshing...', $('pr-action-feedback'));
          })
          .then(function (next) { afterUpdate(next, 'Leave LOP refreshed.'); })
          .catch(function (err) {
            restoreButton(lop);
            showToast(err.message || 'Refresh failed', 'error');
          });
      });

      var applyLop = $('btn-apply-lop');
      if (applyLop) applyLop.addEventListener('click', function () {
        confirmModal({
          title: 'Apply leave LOP to payroll days?',
          body: 'This copies approved leave LOP into LOP days and sets paid days to working days minus LOP. Recalculate after this.',
          okLabel: 'Apply leave LOP'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(applyLop, 'Applying...')) return;
          rpc('apiApplyPayrollLeaveLop', [runId], applyLop, 'Applying...', $('pr-action-feedback'))
            .then(function (next) { afterUpdate(next, 'Leave LOP applied. Calculate to update net pay.'); })
            .catch(function (err) {
              showToast(err.message || 'Apply LOP failed', 'error');
            });
        });
      });

      var corr = $('btn-correct');
      if (corr) corr.addEventListener('click', function () {
        confirmModal({
          title: 'Create a correction run?',
          body: 'The finalized payroll stays unchanged. A new draft is created for the same month.',
          okLabel: 'Create correction'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(corr, 'Creating...')) return;
          rpc('apiCreatePayrollCorrection', [runId, ''], corr, 'Creating...', $('pr-action-feedback'))
            .then(function (next) {
              invalidatePayrollHome_();
              payrollState.detail = next;
              if (setFlash) setFlash('Correction draft created.', 'success', 'payroll');
              renderPayrollHome({ runId: next.run.payroll_run_id });
            })
            .catch(function (err) {
              showToast(err.message || 'Correction failed', 'error');
            });
        });
      });

      var regen = $('btn-regen-payslips');
      if (regen) regen.addEventListener('click', function () {
        confirmModal({
          title: 'Generate all payslips?',
          body: 'Creates or replaces payslip files for all employees and sends payslip email notifications to everyone in this payroll. Amounts stay unchanged.',
          okLabel: 'Generate all payslips'
        }).then(function (ok) {
          if (!ok) return;
          if (!setButtonLoading(regen, 'Generating...')) return;
          rpc('apiRegeneratePayslips', [runId], regen, 'Generating...', $('pr-action-feedback'))
            .then(function (next) {
              invalidatePayslipViews_();
              afterUpdate(next, 'Payslips generated.');
            })
            .catch(function (err) {
              showToast(err.message || 'Generate failed', 'error');
            });
        });
      });

      page.querySelectorAll('.js-pay-dl').forEach(function (btn) {
        btn.addEventListener('click', function () {
          if (!setButtonLoading(btn, 'Downloading...')) return;
          rpc('apiGetPayslipDownload', [btn.getAttribute('data-id')], btn, 'Downloading...')
            .then(function (file) { downloadBlob(file); })
            .catch(function (err) { showToast(err.message || 'Download denied', 'error'); });
        });
      });

      page.querySelectorAll('.js-gen-payslip').forEach(function (btn) {
        btn.addEventListener('click', function () {
          runSinglePayslipGenerate_(
            btn.getAttribute('data-run') || runId,
            btn.getAttribute('data-emp'),
            btn.getAttribute('data-name'),
            btn,
            afterUpdate
          );
        });
      });

      var genOne = $('btn-gen-one-payslip');
      if (genOne) genOne.addEventListener('click', function () {
        var sel = $('pr-payslip-one-emp');
        var employeeId = sel ? sel.value : '';
        var empName = sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].text : employeeId;
        runSinglePayslipGenerate_(runId, employeeId, empName, genOne, afterUpdate);
      });
    }

    function optFilter_(val, cur, label) {
      return '<option value="' + val + '"' + (String(cur) === val ? ' selected' : '') + '>' + escapeHtml(label) + '</option>';
    }

    function readPeriodInputs_() {
      var y = Number($('pr-year') && $('pr-year').value);
      var m = Number($('pr-month') && $('pr-month').value);
      if (!y || y < 2000 || y > 2100) {
        showToast('Enter a valid year.', 'error');
        return null;
      }
      if (!m || m < 1 || m > 12) {
        showToast('Choose a month.', 'error');
        return null;
      }
      return { year: y, month: m };
    }

    function payslipRows_(detail) {
      return (detail.rows || []).filter(function (r) { return r.record; });
    }

    function runSinglePayslipGenerate_(runId, employeeId, empName, btn, afterUpdate) {
      employeeId = String(employeeId || '').trim();
      if (!employeeId) {
        showToast('Select an employee.', 'error');
        return;
      }
      empName = empName || employeeId;
      confirmModal({
        title: 'Generate payslip for ' + empName + '?',
        body: 'Creates or replaces the payslip file for this employee only and sends them the payslip email notification.',
        okLabel: 'Generate & notify'
      }).then(function (ok) {
        if (!ok) return;
        if (btn && !setButtonLoading(btn, 'Generating...')) return;
        rpc('apiRegeneratePayslipForEmployee', [runId, employeeId], btn, 'Generating...', $('pr-action-feedback'))
          .then(function (next) {
            invalidatePayslipViews_();
            afterUpdate(next, 'Payslip generated and notification sent for ' + employeeId + '.');
          })
          .catch(function (err) {
            if (btn) restoreButton(btn);
            showToast(err.message || 'Generate failed', 'error');
          });
      });
    }

    function paintPayslipOneEmployeeBox_(rows, runId) {
      if (!rows.length) return '';
      var html = '<div class="card" id="payslip-one-card" style="margin-top:12px;border-color:var(--primary,#2563eb)">' +
        '<h3>Generate for one employee</h3>' +
        '<p class="page-lede">Pick an employee to create their payslip and send the email notification to them only.</p>' +
        '<div class="primary-next" style="flex-wrap:wrap;gap:8px;align-items:flex-end">' +
        '<label class="form-label" style="margin:0">Employee<br>' +
        '<select class="form-select" id="pr-payslip-one-emp" style="min-width:260px;margin-top:4px">';
      rows.forEach(function (row, idx) {
        var emp = row.employee || {};
        html += '<option value="' + escapeHtml(emp.employee_id) + '"' + (idx === 0 ? ' selected' : '') + '>' +
          escapeHtml(emp.display_name || emp.employee_id) + ' (' + escapeHtml(emp.employee_id) + ')</option>';
      });
      html += '</select></label>' +
        '<button type="button" class="btn btn-primary" id="btn-gen-one-payslip">Generate &amp; notify</button>' +
