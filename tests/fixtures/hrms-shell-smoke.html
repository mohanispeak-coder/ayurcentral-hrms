  var ASK_HR_MAX_CHARS = 1000;
  var ASK_HR_STATUS_MS = 4000;
  var ASK_HR_STATUS_STEPS = [
    'Searching HR knowledge base…',
    'Reading relevant documents…',
    'Preparing your answer…'
  ];
  var ASK_HR_ERROR_COPY = {
    UNAUTHORIZED: 'You need to be signed in to use Ask HR.',
    AUTHORIZATION: 'You need to be signed in to use Ask HR.',
    AUTHORIZATION_ERROR: 'You need to be signed in to use Ask HR.',
    EXPIRED: 'Your session has expired. Please sign in again to use Ask HR.',
    REPLAY: 'This request could not be completed. Please try again.',
    VALIDATION: 'Your request was too long. Please keep it under 1000 characters.',
    VALIDATION_ERROR: 'Your request was too long. Please keep it under 1000 characters.',
    RATE_LIMITED: 'You\'re sending requests too quickly. Please wait a moment.',
    NOT_CONFIGURED: 'Ask HR is not available yet. Please try again later.',
    CONFIGURATION: 'Ask HR is not available yet. Please try again later.',
    CONFIGURATION_ERROR: 'Ask HR is not available yet. Please try again later.',
    NOT_FOUND: 'I couldn\'t find that in the HR knowledge base. Try asking about leave, policies, or HR procedures.',
    UPSTREAM: 'Sorry, I couldn\'t reach the HR knowledge base. Please try again.',
    TIMEOUT: 'The HR knowledge base took too long to respond. Please try again.',
    LOCK_TIMEOUT: 'The HR knowledge base took too long to respond. Please try again.',
    SYSTEM: 'Sorry, I couldn\'t reach the HR knowledge base. Please try again.',
    SYSTEM_ERROR: 'Sorry, I couldn\'t reach the HR knowledge base. Please try again.'
  };

  var askHrUi = {
    open: false,
    busy: false,
    requestSeq: 0,
    statusTimer: null,
    statusIndex: 0,
    messages: [],
    sessionKnown: false
  };

  function isAskHrAllowed() {
    if (state.session && state.session.authorized) return true;
    if (state.session && state.session.authorized === false) return false;
    if (askHrUi.sessionKnown) return false;
    return !!getSessionToken();
  }

  function askHrFriendlyError(code) {
    var key = String(code || 'UPSTREAM').toUpperCase();
    return ASK_HR_ERROR_COPY[key] || ASK_HR_ERROR_COPY.UPSTREAM;
  }

  function mapAskHrTransportError(err) {
    var raw = String((err && err.message) || err || '').toLowerCase();
    if (raw.indexOf('not found') !== -1 || raw.indexOf('is not a function') !== -1) {
      return { code: 'NOT_CONFIGURED' };
    }
    if (raw.indexOf('timed out') !== -1 || raw.indexOf('timeout') !== -1) {
      return { code: 'TIMEOUT' };
    }
    return { code: 'UPSTREAM' };
  }

  /**
   * Same sessionToken injection as other RPCs. Business errors arrive as
   * { ok: false, error } inside the unwrapped callServer payload.
   */
  function callAskHr(question) {
    return callServer('apiAskHr', question)
      .then(function (payload) {
        if (!payload || typeof payload !== 'object') {
          return Promise.reject({ code: 'UPSTREAM' });
        }
        if (payload.ok === false || (payload.error && payload.ok !== true)) {
          return Promise.reject(payload.error || { code: 'UPSTREAM' });
        }
        return payload;
      })
      .catch(function (err) {
        if (err && err.code) {
          return Promise.reject({ code: err.code });
        }
        return Promise.reject(mapAskHrTransportError(err));
      });
  }

  function sanitizeAskHrFileUrl(raw) {
    if (!raw || typeof raw !== 'string') return '';
    var trimmed = raw.replace(/^\s+|\s+$/g, '');
    if (!trimmed) return '';
    var lower = trimmed.toLowerCase();
    if (lower.indexOf('javascript:') === 0 || lower.indexOf('data:') === 0 ||
        lower.indexOf('vbscript:') === 0 || lower.indexOf('file:') === 0) {
      return '';
    }
    try {
      var parsed = new URL(trimmed);
      if (parsed.protocol !== 'https:') return '';
      var host = String(parsed.hostname || '').toLowerCase().replace(/\.$/, '');
      if (host === 'drive.google.com' || host === 'docs.google.com') {
        return parsed.href;
      }
    } catch (ignore) {}
    return '';
  }

  function appendMultilineText(el, text) {
    var parts = String(text == null ? '' : text).split('\n');
    var i;
    for (i = 0; i < parts.length; i++) {
      if (i) el.appendChild(document.createElement('br'));
      el.appendChild(document.createTextNode(parts[i]));
    }
  }

  function setAskHrComposeError(message) {
    var el = $('ask-hr-compose-error');
    if (!el) return;
    if (message) {
      el.textContent = message;
      el.classList.remove('hidden');
    } else {
      el.textContent = '';
      el.classList.add('hidden');
    }
  }

  function setAskHrBusyUi(busy) {
    askHrUi.busy = !!busy;
    var send = $('ask-hr-send');
    var input = $('ask-hr-input');
    var panel = $('ask-hr-panel');
    if (send) {
      send.disabled = !!busy;
      send.textContent = busy ? 'Sending…' : 'Send';
    }
    if (input) input.disabled = !!busy;
    if (panel) {
      if (busy) panel.setAttribute('aria-busy', 'true');
      else panel.removeAttribute('aria-busy');
    }
  }

  function scrollAskHrToBottom() {
    var scroller = $('ask-hr-messages');
    if (scroller) scroller.scrollTop = scroller.scrollHeight;
  }

  function stopAskHrStatus() {
    if (askHrUi.statusTimer) {
      clearInterval(askHrUi.statusTimer);
      askHrUi.statusTimer = null;
    }
    askHrUi.statusIndex = 0;
    var existing = $('ask-hr-status');
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  }

  function startAskHrStatus() {
    stopAskHrStatus();
    var thread = $('ask-hr-thread');
    if (!thread) return;
    var bubble = document.createElement('div');
    bubble.id = 'ask-hr-status';
    bubble.className = 'ask-hr-bubble ask-hr-bubble-status';
    bubble.setAttribute('role', 'status');
    var spin = document.createElement('span');
    spin.className = 'spinner-sm';
    spin.setAttribute('aria-hidden', 'true');
    var copy = document.createElement('div');
    copy.className = 'ask-hr-status-copy';
    var label = document.createElement('span');
    label.id = 'ask-hr-status-text';
    label.textContent = ASK_HR_STATUS_STEPS[0];
    var hint = document.createElement('span');
    hint.className = 'ask-hr-status-hint';
    hint.textContent = 'This can take up to a minute.';
    copy.appendChild(label);
    copy.appendChild(hint);
    bubble.appendChild(spin);
    bubble.appendChild(copy);
    thread.appendChild(bubble);
    scrollAskHrToBottom();
    askHrUi.statusTimer = setInterval(function () {
      askHrUi.statusIndex = (askHrUi.statusIndex + 1) % ASK_HR_STATUS_STEPS.length;
      var textEl = $('ask-hr-status-text');
      if (textEl) textEl.textContent = ASK_HR_STATUS_STEPS[askHrUi.statusIndex];
    }, ASK_HR_STATUS_MS);
  }

  function hideAskHrIntro() {
    var intro = $('ask-hr-intro');
    if (intro) intro.classList.add('hidden');
  }

  function restoreAskHrIntro() {
    var intro = $('ask-hr-intro');
    var thread = $('ask-hr-thread');
    if (thread) thread.innerHTML = '';
    if (intro) intro.classList.remove('hidden');
  }

  function appendAskHrUserBubble(text) {
    var thread = $('ask-hr-thread');
    if (!thread) return;
    hideAskHrIntro();
    var bubble = document.createElement('div');
    bubble.className = 'ask-hr-bubble ask-hr-bubble-user';
    appendMultilineText(bubble, text);
    thread.appendChild(bubble);
    scrollAskHrToBottom();
  }

  function appendAskHrErrorBubble(message) {
    var thread = $('ask-hr-thread');
    if (!thread) return;
    hideAskHrIntro();
    var bubble = document.createElement('div');
    bubble.className = 'ask-hr-bubble ask-hr-bubble-error';
    bubble.setAttribute('role', 'alert');
    bubble.textContent = message;
    thread.appendChild(bubble);
    scrollAskHrToBottom();
  }

  function appendAskHrAnswerBubble(payload) {
    var thread = $('ask-hr-thread');
    if (!thread) return;
    hideAskHrIntro();
    var bubble = document.createElement('div');
    bubble.className = 'ask-hr-bubble ask-hr-bubble-bot';

    var answerText = payload && typeof payload.answer === 'string' ? payload.answer : '';
    if (payload && payload.notFound && !answerText) {
      answerText = askHrFriendlyError('NOT_FOUND');
    }
    if (!answerText) {
      answerText = askHrFriendlyError('NOT_FOUND');
    }

    var body = document.createElement('div');
    appendMultilineText(body, answerText);
    bubble.appendChild(body);

    var keyPoints = payload && Array.isArray(payload.keyPoints) ? payload.keyPoints : [];
    var safePoints = [];
    var i;
    for (i = 0; i < keyPoints.length; i++) {
      if (keyPoints[i] != null && String(keyPoints[i]).replace(/^\s+|\s+$/g, '')) {
        safePoints.push(String(keyPoints[i]));
      }
    }
    if (safePoints.length) {
      var keyLabel = document.createElement('div');
      keyLabel.className = 'ask-hr-key-label';
      keyLabel.textContent = 'Key points';
      bubble.appendChild(keyLabel);
      var list = document.createElement('ul');
      list.className = 'ask-hr-keypoints';
      for (i = 0; i < safePoints.length; i++) {
        var li = document.createElement('li');
        li.textContent = safePoints[i];
        list.appendChild(li);
      }
      bubble.appendChild(list);
    }

    var refs = payload && Array.isArray(payload.references) ? payload.references : [];
    var sourceItems = [];
    for (i = 0; i < refs.length; i++) {
      var ref = refs[i] || {};
      var fileName = String(ref.fileName || ref.name || 'Source document');
      var href = sanitizeAskHrFileUrl(ref.fileUrl || ref.url || '');
      sourceItems.push({ fileName: fileName, href: href });
    }
    if (sourceItems.length) {
      var srcLabel = document.createElement('div');
      srcLabel.className = 'ask-hr-src-label';
      srcLabel.textContent = 'Source documents';
      bubble.appendChild(srcLabel);
      var sources = document.createElement('ul');
      sources.className = 'ask-hr-sources';
      for (i = 0; i < sourceItems.length; i++) {
        var sli = document.createElement('li');
        if (sourceItems[i].href) {
          var link = document.createElement('a');
          link.href = sourceItems[i].href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = sourceItems[i].fileName;
          sli.appendChild(link);
        } else {
          sli.textContent = sourceItems[i].fileName;
        }
        sources.appendChild(sli);
      }
      bubble.appendChild(sources);
    }

    thread.appendChild(bubble);
    scrollAskHrToBottom();
  }

  function clearAskHrConversation() {
    askHrUi.requestSeq += 1;
    askHrUi.messages = [];
    stopAskHrStatus();
    setAskHrBusyUi(false);
    setAskHrComposeError('');
    restoreAskHrIntro();
    var input = $('ask-hr-input');
    if (input && !input.disabled) input.focus();
  }

  function closeAskHrPanel() {
    var panel = $('ask-hr-panel');
    var fab = $('ask-hr-fab');
    if (panel) panel.classList.add('hidden');
    askHrUi.open = false;
    if (fab) {
      fab.setAttribute('aria-expanded', 'false');
      if (isAskHrAllowed()) {
        fab.classList.remove('hidden');
        fab.focus();
      }
    }
  }

  function openAskHrPanel() {
    if (!isAskHrAllowed()) return;
    var panel = $('ask-hr-panel');
    var fab = $('ask-hr-fab');
    var input = $('ask-hr-input');
    if (!panel) return;
    panel.classList.remove('hidden');
    askHrUi.open = true;
    if (fab) {
      fab.classList.add('hidden');
      fab.setAttribute('aria-expanded', 'true');
    }
    if (input && !askHrUi.busy) {
      setTimeout(function () { input.focus(); }, 0);
    }
  }

  function syncAskHrVisibility() {
    var fab = $('ask-hr-fab');
    var panel = $('ask-hr-panel');
    if (!fab || !panel) return;
    if (!isAskHrAllowed()) {
      askHrUi.open = false;
      panel.classList.add('hidden');
      fab.classList.add('hidden');
      fab.setAttribute('aria-expanded', 'false');
      return;
    }
    if (askHrUi.open) {
      panel.classList.remove('hidden');
      fab.classList.add('hidden');
      fab.setAttribute('aria-expanded', 'true');
    } else {
      panel.classList.add('hidden');
      fab.classList.remove('hidden');
      fab.setAttribute('aria-expanded', 'false');
    }
  }

  function sendAskHrQuestion(rawQuestion) {
    setAskHrComposeError('');
    if (askHrUi.busy) return;

    if (!isAskHrAllowed()) {
      appendAskHrErrorBubble(askHrFriendlyError('UNAUTHORIZED'));
      return;
    }

    var question = String(rawQuestion || '').replace(/^\s+|\s+$/g, '');
    if (!question) {
      setAskHrComposeError('Please enter a question.');
      return;
    }
    if (question.length < 3) {
      setAskHrComposeError('Please enter a question.');
      return;
    }
    if (question.length > ASK_HR_MAX_CHARS) {
      setAskHrComposeError('Your request was too long. Please keep it under 1000 characters.');
      return;
    }

    var input = $('ask-hr-input');
    if (input) input.value = '';

    askHrUi.messages.push({ role: 'user', text: question });
    appendAskHrUserBubble(question);
    setAskHrBusyUi(true);
    startAskHrStatus();
    var seq = ++askHrUi.requestSeq;

    callAskHr(question)
      .then(function (payload) {
        if (seq !== askHrUi.requestSeq) return;
        stopAskHrStatus();
        setAskHrBusyUi(false);
        askHrUi.messages.push({ role: 'assistant', payload: payload });
        appendAskHrAnswerBubble(payload || {});
      })
      .catch(function (err) {
        if (seq !== askHrUi.requestSeq) return;
        stopAskHrStatus();
        setAskHrBusyUi(false);
        var code = err && err.code ? err.code : 'UPSTREAM';
        var message = askHrFriendlyError(code);
        askHrUi.messages.push({ role: 'error', text: message });
        appendAskHrErrorBubble(message);
      });
  }

  function initAskHr() {
    var fab = $('ask-hr-fab');
    var panel = $('ask-hr-panel');
    var form = $('ask-hr-form');
    var input = $('ask-hr-input');
    var closeBtn = $('ask-hr-close');
    var clearBtn = $('ask-hr-clear');
    var messages = $('ask-hr-messages');
    if (!fab || !panel || !form) return;

    fab.addEventListener('click', function () {
      if (!isAskHrAllowed()) return;
      openAskHrPanel();
    });

    closeBtn && closeBtn.addEventListener('click', function () {
      closeAskHrPanel();
    });

    clearBtn && clearBtn.addEventListener('click', function () {
      clearAskHrConversation();
    });

    form.addEventListener('submit', function (evt) {
      evt.preventDefault();
      sendAskHrQuestion(input ? input.value : '');
    });

    if (input) {
      input.addEventListener('keydown', function (evt) {
        if (evt.key === 'Enter' && !evt.shiftKey) {
          evt.preventDefault();
          sendAskHrQuestion(input.value);
        }
      });
    }

    if (messages) {
      messages.addEventListener('click', function (evt) {
        var el = evt.target;
        if (el && el.nodeType !== 1) el = el.parentElement;
        var btn = el && el.closest ? el.closest('[data-ask-hr-q]') : null;
        if (!btn || askHrUi.busy) return;
        var q = btn.getAttribute('data-ask-hr-q') || '';
        if (input) input.value = q;
        sendAskHrQuestion(q);
      });
    }

    document.addEventListener('keydown', function (evt) {
      if (evt.key === 'Escape' && askHrUi.open) {
        evt.preventDefault();
        closeAskHrPanel();
      }
    });

    syncAskHrVisibility();
  }

  document.addEventListener('DOMContentLoaded', function () {
    registerLazyRouteStubs();
    bindAuthUi();
    bindModuleRefreshUi();
    initAskHr();
    bootstrap();
  });

  window.HrmsApp = {
    getState: function () { return state; },
    registerRoute: function (id, def) { ROUTES[id] = def; },
    registerModuleRoutes: registerModuleRoutes,
    navigate: navigate,
    callServer: callServer,
    showToast: showToast,
    routeStill: routeStill,
    setHtml: setHtml,
    escapeHtml: escapeHtml,
